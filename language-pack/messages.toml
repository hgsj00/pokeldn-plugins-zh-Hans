"Build, import, keep and trade Pokemon PKHeX finds illegal: any level, moves, ability, ball or shininess. When no legal Pokemon has what you asked for, the builder makes it anyway and marks it Not legal. A broken Pokemon can crash the other game when it is drawn, so back your save up. The GTS still takes legal Pokemon only." = "允许创建、导入、保存及交换被 PKHeX 判定为不合法的宝可梦：任意等级、招式、特性、精灵球或异色。找不到符合要求的合法宝可梦时，创建工具仍会按设置生成，并标记为“不合法”。有问题的宝可梦在对方游戏显示时可能导致崩溃，请先备份存档。GTS 仍只接受合法的宝可梦。"
