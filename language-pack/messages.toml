"Stand facing it and press A yourself. At its cry, touch no button: the game presses A by itself on a shiny frame and the battle starts. If the countdown passes 0, wait for the next one. Do not walk or battle first: a wild battle stops the presses until you send it again. This can take a few minutes" = "站到它面前，自己按下 A。听到它的叫声时，不要碰任何按键：游戏会在异色帧自动按下 A，随后进入对战。若倒数过了 0，请等下一次。不要先走动或对战：野生宝可梦对战会让自动按键停止，重新发送才会恢复。这可能需要几分钟"
"Stand in front of it. Once the map shows after the recap, tap Up once to face it, then hold B. The game presses A by itself on a shiny frame; if the countdown passes 0 with nothing, keep holding B for the next one. This can take a few minutes" = "站在它面前。前情回顾结束、地图出现后，向上按一下，让角色面向它，再按住 B。游戏会在异色帧自动按下 A；若倒数过了 0 仍没有反应，请继续按住 B 等下一次。这可能需要几分钟"
