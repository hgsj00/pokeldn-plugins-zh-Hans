"This board talks through a USB-to-serial chip the phone app does not drive (it drives the CP210x only). Use this board with the desktop app." = "这块开发板通过 USB 转串口芯片通信，而手机 App 不驱动这款芯片（只驱动 CP210x）。请改用电脑版 App 连接这块开发板。"
"Connect an ESP32-S3, C3 or C6 board by its native USB port, or a classic ESP32 with a CP210x USB chip, to the phone with a data cable (some cables only charge)." = "用数据线把 ESP32-S3、C3 或 C6 开发板（走原生 USB 口），或带 CP210x USB 芯片的经典款 ESP32 接到手机上（有些线只能充电）。"
"Without USB access the app cannot reach the board. Tap Allow USB access and choose OK. Ticking \"Always open\" skips the question next time." = "没有 USB 访问权限，App 就连接不到开发板。请点“允许访问 USB 设备”，再选“确定”。勾选“始终打开”后，下次不再询问。"
"Some phones have a USB host or \"OTG\" switch. Open Settings and search for \"OTG\"; turn it on if it is there." = "部分手机有 USB 主机模式或“OTG”开关。打开“设置”搜索“OTG”；如果有，就把它打开。"
"OnePlus phones switch USB devices off after a while. Open Settings, search for \"OTG connection\" and turn it on. The board lights up without replugging." = "OnePlus 手机会在一段时间后关闭 USB 设备。打开“设置”，搜索“OTG 连接”并打开。开发板会亮起，不必重新插拔。"
"This phone may have an \"OTG connection\" switch. Open Settings and search for \"OTG\"; turn it on if it is there." = "这台手机可能有“OTG 连接”开关。打开“设置”搜索“OTG”；如果有，就把它打开。"
"Android asks once whether pokeldn may use the board. Tap Allow USB access, then OK on Android's prompt." = "Android 会询问一次是否允许 pokeldn 使用开发板。请点“允许访问 USB 设备”，再在 Android 的提示中选择“确定”。"
