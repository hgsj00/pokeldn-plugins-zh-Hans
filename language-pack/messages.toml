"the room both players enter; default the link code, and no code meets anyone else trading online without one" = "双方玩家进入的房间；默认使用连接密码，没有密码时会与同样没有密码的在线交换玩家匹配"
"after each trade, trade again and offer the Pokemon the console just sent, so one that evolves by trade evolves on the console; the player offers ours back (docs/architecture.md, Trade back)" = "每次交换后再次交换，提供主机刚送出的宝可梦，让需要通信进化的宝可梦在主机上进化；玩家则提供本程序送出的宝可梦作为回礼（docs/architecture.md，Trade back）"
"trainer name; defaults to DEFAULT_TRAINER" = "训练家名称；默认使用 DEFAULT_TRAINER"
"game version; defaults to DEFAULT_TRAINER" = "游戏版本；默认使用 DEFAULT_TRAINER"
"trainer language; defaults to DEFAULT_TRAINER" = "训练家语言；默认使用 DEFAULT_TRAINER"
"decimal trainer ID, optionally followed by decimal secret ID" = "十进制训练家 ID，后面可选填十进制里 ID"
"LDN passphrase hex; default uses the frlg emulator value" = "十六进制 LDN 通行密码；默认使用 frlg 模拟器的值"
"Wi-Fi phy; explicit phyN overrides --adapter" = "Wi-Fi phy；显式指定 phyN 时会覆盖 --adapter"
"named Wi-Fi adapter profile used while --phy is auto" = "--phy 为 auto 时使用的具名 Wi-Fi 网卡配置"
"record an optional JSONL protocol diagnostic" = "可选记录 JSONL 格式的协议诊断"
"save the received mon here (trades=1); for trades>1 this is a base/prefix and each received mon is saved as <stem>_trade<k>_<species>.pk3" = "将收到的宝可梦保存到此（trades=1）；trades>1 时此路径作为基础或前缀，每只收到的宝可梦保存为 <stem>_trade<k>_<species>.pk3"
"LDN passphrase as hex (live); default = the built-in 64-byte emulator passphrase (shared by frlg/rse)" = "以十六进制表示的 LDN 口令（实时）；默认使用内置的 64 字节模拟器口令（frlg/rse 共用）"
"wifi phy for the LDN join (live)" = "加入 LDN 所用的 Wi-Fi phy（实时）"
"Switch prod.keys (live); default: keys_path from config/host*.toml" = "Switch 的 prod.keys（实时）；默认取自 config/host*.toml 的 keys_path"
"(live) record every Pia datagram both directions to a .jsonl (incl. the SSID), so a live attempt can be decrypted/analysed offline" = "（实时）把双向的每个 Pia 数据报记录到 .jsonl（含 SSID），以便离线解密并分析一次实时尝试"
"a complete FRLG .pokegift file, or a .wc3 Wonder Card" = "完整的 FRLG .pokegift 文件，或 .wc3 神秘卡片"
"how long to host" = "主机端保持开放的时间"
"the nickname our connection response carries" = "连接回应中携带的昵称"
"1, 6, 11; code (default): the channel the link code puts a searching console on, the only one it joins on; auto: scan for the console's own network under our scene id and host on its channel" = "1、6、11；code（默认）：连接密码让正在搜索的主机所在的频道，也是唯一会加入的频道；auto：按本程序的 scene ID 扫描主机自身的网络，并在它的频道上建房"
"the link code the player enters: three picker names (English or French) or indices 0-9, comma-separated" = "玩家输入的连接密码：三个选择器名称（英文或法语），或 0-9 的索引，以逗号分隔"
"every datagram, one JSON line each" = "每个数据报各一行 JSON"
"the player name our identity carries, the one the trade screen shows" = "身份数据中携带的玩家名称，即交换画面显示的名称"
"write the peer's offered PB7 here" = "将对方提供的 PB7 写入此处"
"offer every --offer and --next-offer structure under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again" = "为每条 --offer 与 --next-offer 换用新的 PID 与加密常数，保留异色状态，让领取过的存档能再次领取"
"answer the console's offer with this 232-byte box structure (echo: its own back), and its commits with commits" = "以这个 232 字节的盒子结构回应主机的提供（echo：送回主机自己的结构），并以 commits 回应它的提交"
"host over ldn_mitm for an emulator instead of the radio (docs/ldn.md)" = "通过 ldn_mitm 为模拟器建房，取代无线通信设备（docs/ldn.md）"
"the Mystery Gift card each --offer and --next-offer was made from, in the same order: its key in PKHeX's event database (pokeldn.pokemon.Service.gift_events)" = "按相同顺序指定各条 --offer 与 --next-offer 的来源神秘礼物卡片：即其在 PKHeX 事件数据库中的键（pokeldn.pokemon.Service.gift_events）"
"make each --gift-event card that gives the receiver's own trainer again for the console's save, during the trade: the console offers first, a Pokemon its save caught names the trainer, and ours goes up made for it; for any other, the trainer the console's session data names. Failing both, the offer goes as given, under the trainer from Settings (pokeldn.receiver_gift, docs/gift_simulated.md)" = "交换时，把每张 --gift-event 卡片重新做成初训家为领取者本人的版本，依据主机存档：主机先提供宝可梦，若这只宝可梦是该存档捕捉的，就以它标明的训练家为准，本程序据此生成要提供的宝可梦；若是其他情况，则用主机连接阶段数据标明的训练家。两者都取不到时，按原样提供，并使用“设置”中的训练家（pokeldn.receiver_gift，docs/gift_simulated.md）"
"jsonl of every datagram seen while seated, hex, with its verdict" = "占用连接位置期间见到的每个数据报，记录其十六进制内容及判定结果到 JSONL"
"the nickname the connection response carries, what the console shows as the partner (a real station sends its Switch profile's)" = "连接回应中携带的昵称，即主机上显示的交换对象名称（实机会发送其 Switch 个人资料中的名称）"
"offer every --offer structure under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again" = "为每个 --offer 结构换用新的 PID 与加密常数，保留异色状态，让领取过的存档能再次领取"
"answer the host's offers with a box structure of our own. 'echo' returns the host's own, which the game accepts by construction; a path is a 232-byte structure, encrypted or not. Repeatable, one per trade on the seat; trade N writes what it received to --received with -N. After the last, a further trade is not answered and the player backs out" = "以本程序自己的盒子结构回应主机端的提供。echo 会送回主机端自己的结构，游戏在原理上必然接受；指定路径时须为 232 字节的结构，加密与否均可。可重复指定，同一连接位置每次交换用一条；第 N 次交换会把收到的内容写入 --received 并加上 -N。最后一条用完后，不再回应后续交换，玩家会退出"
"host over ldn_mitm on the LAN for an emulator; no radio and no root" = "通过局域网的 ldn_mitm 为模拟器建房；不需无线通信设备，也不需 root 权限"
"the party slot we offer" = "要提供的同行位置"
"a PK8 to place in the offered party slot, encrypted or PKHeX export. Repeatable, one per trade: the player trades again from the box, or searches again; the last serves every later trade" = "放入指定同行位置的 PK8，可为加密文件或 PKHeX 导出文件。可重复指定，每次交换用一条：玩家可从盒子再次交换，或重新搜索；之后的交换持续使用最后一条"
"draw a new encryption constant and PID for the offered Pokemon" = "为提供的宝可梦重新抽取加密常数与 PID"
"write the joiner's Pokemon here; trade N > 1 writes FILE-N" = "将加入端的宝可梦写入此处；第 N 次交换（N>1）写入 FILE-N"
"the Link Code the player searches with, e.g. 12345678; none by default" = "玩家搜索时使用的连接密码，例如 12345678；默认不设密码"
"host a Max Raid den lobby with this boss instead of a Link Trade (docs/swsh_raid.md)" = "用这个头目开设极巨团体战巢穴大厅，取代连接交换（docs/swsh_raid.md）"
"a reward row, item id and count; up to 15; none gives an emulated den's rows" = "一列奖励，含道具 ID 与数量，最多 15 列；未指定则使用模拟巢穴的奖励列"
"the BattleSeed value; random by default" = "BattleSeed 的值；默认随机"
"host a Max Raid with a boss of this Wild Area Event delivery (an EventsGallery 'Index NNN' folder) instead of --raid-boss; its rewards unless --raid-reward (docs/swsh_raid.md, Event raids)" = "用这份旷野地带活动配信（EventsGallery 的 Index NNN 文件夹）中的头目开设极巨团体战，取代 --raid-boss；未指定 --raid-reward 时使用该活动的奖励（docs/swsh_raid.md，Event raids）"
"with --raid-event: whose table the boss comes from; the advertisement's version by default" = "搭配 --raid-event：头目取自哪个版本的数据表；默认为该配信广告的版本"
"the --raid-boss boss is Gigantamax; a retail console accepts it where a base den holds that Gigantamax Pokemon (docs/swsh_raid.md)" = "--raid-boss 指定的头目为超极巨化；实机只在该一般巢穴本身会出现这只超极巨化宝可梦时接受（docs/swsh_raid.md）"
"host a Dynamax Adventure (Max Lair) lobby whose legendary is this species; the host leaves once the adventure starts (docs/swsh_raid.md)" = "开设极巨大冒险（极巨巢穴）大厅，其传说的宝可梦为该种类；冒险开始后主机端即离开（docs/swsh_raid.md）"
"the adventure seed (ChikaBattleSeed): the rentals and encounters; random by default" = "冒险种子（ChikaBattleSeed），决定租借与遭遇；默认随机"
"join an emulated console hosting over ldn_mitm on the LAN; no radio, no root, no keys. Each of --scans waits --dwell seconds for an answer" = "加入通过局域网 ldn_mitm 建房的模拟器；不需无线通信设备、root 权限或密钥。--scans 的每次扫描都会等待 --dwell 秒"
"--ip-join: the console's address" = "--ip-join：主机的地址"
"which party slot of --send-snapshot to offer back, 1-6; 0 offers nothing and only records what the console offers us" = "要换回的 --send-snapshot 同行位置，范围 1-6；0 表示不提供，只记录主机提供的内容"
"a .pk8 to put in --offer-slot in place of the snapshot's record: stored or party form, encrypted or PKHeX's decrypted export. Its OT name and ids become the snapshot's unless --offer-file-as-is. Repeatable, one per trade on the session: the console's player picks again from the box; the last serves every later trade" = "用 .pk8 取代快照中 --offer-slot 的数据：盒子或同行格式，加密文件或 PKHeX 解密导出文件。其初训家名称与 ID 会改成快照的，除非指定 --offer-file-as-is。可重复指定，本次连接每次交换用一条：玩家需从盒子再次选择，之后的交换持续使用最后一条"
"draw a new encryption constant and PID for every offered Pokemon" = "为每只提供的宝可梦重新抽取加密常数与 PID"
"the move slot our Pokemon uses every turn" = "本程序的宝可梦每回合使用的招式位置"
"a .pokegift or 720-byte .wc8 record to send instead of building one" = "要发送的 .pokegift 或 720 字节 .wc8 数据，取代自行生成"
"the phy renumbers on every driver reload" = "每次重新加载驱动程序，phy 编号都会改变"
"prod.keys; default from config/host.toml" = "prod.keys；默认取自 config/host.toml"
"every datagram and event, one JSON line each" = "每个数据报与事件各一行 JSON"
"host the room the player enters with this password, e.g. 00000000" = "用这个密码开设玩家要进入的房间，例如 00000000"
"3 is French" = "3 代表法语"
"offer it under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again" = "换用新的 PID 与加密常数后提供，保留异色状态，让领取过的存档能再次领取"
"the Pokemon we trade: a complete, legal, encrypted 328-byte PB8 whose PID the console's save does not already hold; repeatable, one per trade in order, the last offered again after the list" = "要交换的宝可梦：完整、合法、已加密的 328 字节 PB8，其 PID 主机存档尚未持有；可重复指定，依次每次交换用一条，列表用完后重复提供最后一条"
"the Mystery Gift card each --offer was made from, in the same order: its key in PKHeX's event database (pokeldn.pokemon.Service.gift_events)" = "按相同顺序指定各条 --offer 的来源神秘礼物卡片：即其在 PKHeX 事件数据库中的键（pokeldn.pokemon.Service.gift_events）"
"the PlayerInfo language byte, a MsgLangId (3 is French); 1, 8, 9 and 10 cap the greeting's name at 6 characters, others at 12 (docs/bdsp_protocol.md)" = "PlayerInfo 的语言字节 MsgLangId（3 为法语）；1、8、9、10 会把问候语中的名称限制为 6 个字符，其余为 12 个字符（docs/bdsp_protocol.md）"
"a PB8 to offer (328 or 344 bytes, encrypted or PKHeX's decrypted export), edited by --trade-nickname and --trade-ot. 328 bytes hold much more than this project has identified, so what we send is a real Pokemon with named fields changed rather than one invented from nothing. Repeatable, one per trade in order; the last is offered again after the list" = "要提供的 PB8（328 或 344 字节，加密文件或 PKHeX 解密导出文件），可由 --trade-nickname 与 --trade-ot 修改。328 字节中有许多本项目尚未识别的数据，因此发送的是改过已命名字段的真实宝可梦，而不是凭空编造的一只。可重复指定，依次每次交换用一条；列表用完后重复提供最后一条"
"nickname for the offered Pokemon" = "提供的宝可梦的昵称"
"how long one connection request waits for its answer" = "单次连接请求等待回应的时间"
"the eight digits the player types" = "玩家输入的 8 位数字"
"how long to hold the network up" = "维持网络开放的时间"
"the Mystery Gift card each --trade-box-record was made from, in the same order: its key in PKHeX's event database (pokeldn.pokemon.Service.gift_events)" = "按相同顺序指定各条 --trade-box-record 的来源神秘礼物卡片：即其在 PKHeX 事件数据库中的键（pokeldn.pokemon.Service.gift_events）"
"write every datagram here as JSON lines" = "把每个数据报以 JSON 行写入此处"
"the LDN node name; a retail console publishes its profile name here" = "LDN 节点名称；实机会在此公布其个人资料名称"
"write the record the console traded to this file, -N before the extension for trade N above 1" = "将主机交换过来的数据写入此文件；第 N 次交换（N>1）时在扩展名前加上 -N"
"offer the record under a new PID and encryption constant, drawn once per run, shiny state kept, so a save that took it before takes it again" = "换用新的 PID 与加密常数后提供（每次运行抽取一次），保留异色状态，让领取过的存档能再次领取"
"offer this record file instead of the reference one; stored or party, encrypted or decrypted. Repeatable, one per trade in order; the last is offered again after the list" = "用这个数据文件取代参考文件，可为盒子或同行格式、加密或已解密。可重复指定，依次每次交换用一条；列表用完后重复提供最后一条"
"join over ldn_mitm on the LAN; no radio and no root" = "通过局域网上的 ldn_mitm 加入；不需无线通信设备，也不需 root 权限"
"the eight digits; '' joins any code" = "8 位数字；留空 '' 表示不限密码"
"the whole run" = "整次运行的时间"
"how long one seat is held" = "单个连接位置的持有时间"
"the name in our data exchange record; the console shows it" = "本程序数据交换记录中的名称，主机会显示它"
"the record to trade away, stored or party, encrypted or not; the default is the reference Azelf under our player name. Repeatable: one per trade in order, on this seat or in the host role once taken" = "要送出的数据，可为盒子或同行格式、加密或未加密；默认使用初训家为本程序玩家名称的参考亚克诺姆。可重复指定，依次每次交换用一条，用于此连接位置，或在接任主机端之后"
"write the record the console traded to this file" = "将主机交换过来的数据写入此文件"
"every datagram as one JSON line" = "每个数据报各一行 JSON"
"the LDN node name" = "LDN 节点名称"
"the Link Code the player sets, e.g. 12345678; empty for none" = "玩家设置的连接密码，例如 12345678；留空表示不设密码"
"the player name record 1 of our identity carries, the one the trade screen shows" = "身份数据记录 1 中携带的玩家名称，即交换画面显示的名称"
"offer each record under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again" = "为每条数据换用新的 PID 与加密常数，保留异色状态，让领取过的存档能再次领取"
"a file holding the 348-byte record this host offers (raw, or hex text; a 352-byte game message is stripped of its header). With it the host answers the console's offer with its own, confirms, and follows the console through the commit and the four exchange steps the way a pair's host does (pokeldn.sv.trade). Repeatable: the second and later records are offered in the same seat, one per trade, as each trade closes" = "包含本主机端所提供 348 字节数据的文件（原始二进制或十六进制文本；352 字节的游戏消息会去掉头部）。指定后，主机端会用自己的数据回应主机的提供、进行确认，并像配对中的主机端那样随主机走完提交与四个交换步骤（pokeldn.sv.trade）。可重复指定：第二条及以后的数据会在同一连接位置、随每次交换结束依次提供"
"the Mystery Gift card each --trade-offer was made from, in the same order: its key in PKHeX's event database (pokeldn.pokemon.Service.gift_events)" = "按相同顺序指定各条 --trade-offer 的来源神秘礼物卡片：即其在 PKHeX 事件数据库中的键（pokeldn.pokemon.Service.gift_events）"
"a field written into the offered record before it is sealed, by its pokeldn.sv.pokemon name: nickname=SHINY, species=906, level=50, ivs=31,31,31,31,31,31, pid=0x1234, trainer_id=12345, ball=4, moves=33,0,0,0. Repeatable, and `shiny` alone rolls a personality value shiny against the record's own ids" = "封存提供的数据前写入的字段，名称按 pokeldn.sv.pokemon：nickname=SHINY、species=906、level=50、ivs=31,31,31,31,31,31、pid=0x1234、trainer_id=12345、ball=4、moves=33,0,0,0。可重复指定；单独使用 shiny 时，会按数据自身的 ID 掷出异色 PID"
"a file to write the console's own offer to, the 348-byte body of its 80 00 02 00 message, as hex text. What it holds is read by pokeldn.sv.pokemon" = "将主机自己的提供写入此文件，内容为主机 80 00 02 00 消息的 348 字节主体，使用十六进制文本；文件内容可由 pokeldn.sv.pokemon 读取"
"host a Tera Raid: the raid seed, eight hex digits; the boss, its Tera type and the rewards follow from it and the four --raid-* context flags" = "开设太晶团体战：团体战种子，8 位十六进制数字；头目、其太晶属性与奖励由种子及四个 --raid-* 上下文标志决定"
"the party record our player brings to the raid, legal per PKHeX; with --raid-seed" = "本程序派往团体战的同行宝可梦数据，需通过 PKHeX 合法性检查；搭配 --raid-seed 使用"
"a reward row in place of the seed's, in order; up to 45" = "依次取代种子奖励的奖励列，最多 45 列"
"the story stage, which sets a standard crystal's star odds" = "剧情阶段，决定一般结晶的星级概率"
"a standard or a black (six-star) crystal" = "一般结晶或黑色（6 星）结晶"
"host an event raid: a Poke Portal News delivery's folder (an EventsGallery event, or its Files); the seed draws from the event's encounters at --raid-version and --raid-progress, and --raid-map and --raid-content are unused" = "开设活动团体战：宝可入口站新闻配信的文件夹（EventsGallery 的活动，或其 Files）；种子会按 --raid-version 与 --raid-progress 从活动的遭遇中抽取，--raid-map 与 --raid-content 不使用"
"the delivery group of the event's den, 1 to 10; by default the first with dens and an encounter at that progress" = "活动巢穴的配信组，范围 1-10；默认选择在该进度下既有巢穴又有遭遇的第一组"
"with --raid-event: serve a catch-once encounter (every seven-star raid, Walking Wake, Iron Leaves...) as a normal catch, its capture rate normal and its record number a stand-in no save has caught, so a save that caught it may catch it again; one that cannot be caught stays so (docs/sv_raid.md, Event raids)" = "搭配 --raid-event：把每份存档只能捕捉一次的活动遭遇（所有 7 星团体战、波荡水、铁斑叶等）按普通捕捉处理，捕获率为普通值，记录编号使用没有存档捕捉过的占位编号，让捕捉过的存档能再次捕捉；原本不可捕捉的仍然不可捕捉（docs/sv_raid.md，Event raids）"
"consoles the raid waits for, 1 to 3; it starts once N are in the lobby and every one is Ready, or when the lobby timer runs out" = "团体战等待的主机数，范围 1-3；当 N 台主机进入大厅且全部就绪，或大厅计时结束时开始"
"join only a console searching with this Link Code; empty takes any" = "仅加入用这个连接密码搜索的主机；留空则不限"
"join an emulated console over the LAN through ldn_mitm instead of the radio: no root, no phy, no prod.keys" = "通过局域网的 ldn_mitm 加入模拟器，取代无线通信设备：不需 root 权限、phy 或 prod.keys"
"--ip-join: the emulator's address" = "--ip-join：模拟器的地址"
"how long to keep trying" = "持续尝试的时间"
"how long to stay in one joined session before scanning again" = "加入一个连接后，重新扫描前停留的时间"
"join the Tera Raid lobby a console hosts and bring this party record, legal per PKHeX; our player readies, answers the start and leaves when the battle begins, its Pokemon fighting on for the console" = "加入主机开设的太晶团体战大厅，并带上这份通过 PKHeX 合法性检查的同行宝可梦数据；本程序的玩家会准备就绪、回应开始，并在对战开始时离开，其宝可梦替主机继续战斗"
"with --union-circle, a task after which our player leaves the circle and the run ends: snacksworth gives the host every Team and solo clear it lacks for all of Snacksworth's legendaries, one a second from the start demo's end; bp a clear paying the host the --bbq-clear BP" = "搭配 --union-circle：一项任务，完成该项后本程序的玩家离开集友圈并结束运行。snacksworth：从开场演出结束起，每秒替建房玩家完成一项集友圈或单人任务，补足点心大叔所有传说的宝可梦所需的每一项完成数；bp：完成一项任务，付给建房玩家 --bbq-clear BP"
"the BP, 1 to 9999999, --circle-task bp gives" = "--circle-task bp 给出的 BP，范围 1-9999999"
"with --union-circle: 10 s after the circle's start demo has ended, keep 3 wild Pokemon of this species (dev number) out 15 to 25 m from the host's player, as a console shares its own: one the host battles, removes or goes more than 50 m from comes again near it" = "搭配 --union-circle：集友圈开场演出结束 10 秒后，在建房玩家周围 15-25 米处保持 3 只该种类（开发用编号）的野生宝可梦，模拟主机分享自己野生宝可梦的方式：被建房玩家对战、移除，或离其超过 50 米的那只，会重新出现在其附近"
"a file holding the 348-byte record this joiner offers (raw, or hex text; a 352-byte game message is stripped of its header). With it the joiner answers the host's offer with its own, confirms, commits, and echoes the four exchange steps the way a pair's joiner does (pokeldn.sv.trade). Repeatable: the second and later records are offered in the same seat, one per trade, as each trade closes" = "包含本加入端所提供 348 字节数据的文件（原始二进制或十六进制文本；352 字节的游戏消息会去掉头部）。指定后，加入端会用自己的数据回应主机端的提供、进行确认、提交，并像配对中的加入端那样回应四个交换步骤（pokeldn.sv.trade）。可重复指定：第二条及以后的数据会在同一连接位置、随每次交换结束依次提供"
"a field written into the offered record before it is sealed, by its pokeldn.sv.pokemon name: nickname=SHINY, species=906, ivs=31,31,31,31,31,31, trainer_id=12345, ball=4. Repeatable, and `shiny` alone rolls a personality value shiny against the record's own ids" = "封存提供的数据前写入的字段，名称按 pokeldn.sv.pokemon：nickname=SHINY、species=906、ivs=31,31,31,31,31,31、trainer_id=12345、ball=4。可重复指定；单独使用 shiny 时，会按数据自身的 ID 掷出异色 PID"
"a file to write the host's own offer to, the 348-byte body of its 80 00 02 00 message, as hex text" = "将主机端自己的提供写入此文件，内容为主机端 80 00 02 00 消息的 348 字节主体，使用十六进制文本"
"seconds to allow the association itself; a console whose host phase ends mid-connect leaves ldn.connect blocked with no timeout of its own" = "允许关联本身的秒数；若主机在连接途中结束建房阶段，ldn.connect 会一直阻塞，且自身没有超时限制"
"a searching console put both of its measured sessions on channel 6" = "实测中，一台正在搜索的主机两次测量到的会话都在频道 6"
"the link code the player types" = "玩家输入的连接密码"
"the LDN node name; a searching console advertises one space" = "LDN 节点名称；正在搜索的主机会公布一个空格"
"the 354-byte offer message: the preview, then our pick. Repeatable, one per trade in the seat; the last serves every later trade" = "354 字节的提供消息：先预览，再是本程序的选择。可重复指定，同一连接位置每次交换用一条；之后的交换持续使用最后一条"
"send the offer under a new PID and encryption constant, shiny state kept, so a save that took this record before takes it again" = "换用新的 PID 与加密常数后发送，保留异色状态，让领取过此数据的存档能再次领取"
"write the Pokemon the console picks here; trade N > 1 writes FILE-N. A preview, the console's cursor on its box, is not written" = "将主机选定的宝可梦写入此处；第 N 次交换（N>1）写入 FILE-N。主机在盒子上移动光标产生的预览不会写入"
"host an emulated console over ldn_mitm, with no radio" = "通过 ldn_mitm 为模拟器建房，不使用无线通信设备"
"how long to hold one seat" = "单个连接位置的持有时间"
"bound the association alone; the seat itself is not bounded by it" = "仅限制关联本身；连接位置本身不受它限制"
"only join a console waiting on this link code" = "仅加入用这个连接密码等待的主机"
"the name the Session join's PlayerInfo carries; a reference joiner sends one space" = "Session 加入消息中 PlayerInfo 携带的名称；参考加入端会发送一个空格"
"write the host's offered PA9 here; trade N > 1 writes FILE-N" = "将主机端提供的 PA9 写入此处；第 N 次交换（N>1）写入 FILE-N"
"a 354-byte offer message to send once the streams are open. Repeatable, one per trade in the seat; the last serves every later trade" = "数据流打开后要发送的 354 字节提供消息。可重复指定，同一连接位置每次交换用一条；之后的交换持续使用最后一条"
"join an emulated host over the LAN through its ldn_mitm bridge, with no radio and no root" = "通过局域网经其 ldn_mitm 桥接加入模拟器主机端，不需无线通信设备，也不需 root 权限"
"The card holds a male and a female version; the player gets their own" = "卡片分男性与女性版本；玩家会收到自己那份"
"Listed under Mystery Gift; the player picks it, then it lands in the save." = "列在神秘礼物下；玩家选择后便存入存档。"
"Shown on the Wonder News screen as soon as it is received." = "一收到就显示在神秘新闻画面。"
"Runs on the console while it receives, inside the Mystery Gift menu." = "主机接收时，在神秘礼物菜单内运行。"
"Your ARM code, checked offline before it is sent" = "你的 ARM 代码，发送前会先离线检查"
"any cartridge; call no ROM address" = "任何卡带；不调用 ROM 地址"
"Received once per save" = "每份存档仅可领取一次"
"The player can pass the card on" = "玩家可以把卡片转送"
"Choose the save to put on the console." = "请选择要写入主机的存档。"
"This save has no whole copy of a game in it." = "这个存档里没有完整的游戏存档副本。"
"Checking the save's party with PKHeX..." = "正在用 PKHeX 检查存档中的同行宝可梦…"
"Save boosts for later" = "保存强化供稍后使用"
"After sending the saved boosts, send \"Mom restores your boosts\" once. After each restart, talk to Mom at home in Pallet Town to turn them back on. Send Mom's gift again if you receive another Wonder Card." = "发送已保存的强化后，请再发送一次“Mom restores your boosts”。每次重新启动后，到真新镇家里与妈妈对话即可重新启用。若收到另一张神秘卡片，请再次发送“Mom's gift”。"
"Keep a copy of these boosts in your save. After sending the saved boosts, send \"Mom restores your boosts\" once. After each restart, talk to Mom at home in Pallet Town to turn them back on. Send Mom's gift again if you receive another Wonder Card." = "在存档中保留这些强化的副本。发送已保存的强化后，请再发送一次“Mom restores your boosts”。每次重新启动后，到真新镇家里与妈妈对话即可重新启用。若收到另一张神秘卡片，请再次发送“Mom's gift”。"
"Text prints faster" = "文字显示更快"
"Counts down to the next shiny wild Pokemon in the grass, top right of the screen" = "在画面右上角显示距离下次在草丛遇见异色野生宝可梦的倒数"
"No grass, water or roaming encounters; fishing and Sweet Scent still work" = "不会在草丛、水面或游走中遭遇；钓鱼与甜甜香气仍然有效"
"The lead Pokemon's six IVs and its nature, top right of the overworld" = "队首宝可梦的六项个体值与性格，显示在地图画面右上角"
"The lead Pokemon walks behind you, hops ledges with you, and smiles and cries when you face it and press A" = "队首宝可梦会跟在身后，与你一起跳下高台；面向它按 A 时，它会微笑并发出叫声"
