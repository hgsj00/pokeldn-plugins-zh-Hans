"The original trainer of every Pokemon the app builds for you. Put your own name, gender and IDs to make them yours, so a traded Pokemon keeps its friendship: FireRed and LeafGreen show a five-digit ID, the Switch games a six-digit one. The IDs were drawn at random on first launch; Find mine takes the ones of the last game you traded with. Play several games with different saves? Give each game its own trainer; a game you leave unchanged keeps the shared one." = "App 为你创建的宝可梦所使用的初训家数据。填入自己的名称、性别与 ID，宝可梦就归属于你，交换后仍保有亲密度：《火红／叶绿》显示 5 位数 ID，Switch 游戏显示 6 位数。ID 在首次启动时随机抽取；“Find mine”会取你最近一次交换的游戏所用的那一组。同时玩多个游戏、各用不同存档？可以为每个游戏设置自己的训练家；没有改动的游戏会沿用共用的那一组。"
"it is legal only with a handler, and your own save clears the handler as it receives it" = "它只有在设有持有者时才算合法，而你的存档在接收时会清除这一设置。"
