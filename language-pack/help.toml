"swsh-lan-raid-join:--respond" = "用连接响应应答控制台发给我们的连接请求"
"swsh-lan-raid-join:--respond-result" = "0 也可接受"
"swsh-lan-raid-join:--respond-with" = "响应中两个 id 字段分别放入谁的常量 id 和变量 id——这是推断，因此 “both” 会在多次重传中交替使用两者"
