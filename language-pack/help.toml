"sv-circle-join:--connect-timeout" = "允许建立关联本身的秒数；若主机的建房阶段在连接途中结束，ldn.connect 会一直阻塞，且自身没有超时限制"
"sv-circle-join:--open-delay" = "加入响应之后（没有 --session-join 时则为席位之后）多少秒才发出十一个 ack 和两个 stream open；零售版加入方在加入后 0.75 s 打开"
