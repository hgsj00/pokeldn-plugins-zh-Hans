"sv-join:--ack-entries" = "确认载荷中的条目数；零售版站点会发送四个"
"sv-join:--ack-dest-bits" = "可靠头部的目标位；3 会附加零售站点发送的四字节位图，0 则保留九字节头部"
"sv-join:--ack-sweep" = "在席位中轮换 --ack-flags、--ack-entries 与 --ack-dest-bits 的每种组合，每个 --ack-sweep-period 换一种，并在每种生效时打印。这样一次席位就能看出访客解析的是哪种形态"
"sv-join:--ack-sweep-period" = "每个轮扫变体保持生效的秒数"
"sv-join:--ack-period" = "在房主使用的每个 stream 上，周期性批量 ack 之间的秒数"
"sv-join:--unicast" = "改为发送到房主地址，而不是 LDN 广播地址。两个零售版站点都会广播每个 Pia 包（sv11），而广播无需对端做 ARP 解析"
