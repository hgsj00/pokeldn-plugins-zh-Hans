"swsh-lan:--quiet-for" = "没有 update 会话达到多少秒就算重广播停止 - 主机每秒发送十条，所以这里是漏掉十五条"
"swsh-lan:--seq-delta" = "对照组。对主机从未发送过的序列号回 ACK：若在 --seq-delta 1 下重播照旧继续，就说明 0 下的停止归因于 ACK 的内容，而不是仅仅因为我们发送过 ACK"
"swsh-lan:--connect" = "收到 ack 后，在协议 0x14 上扫描版本 4 的连接请求"
"swsh-lan:--nat-flags" = "字节 [1] 的取值，列表或 LO-HI"
"swsh-lan:--nat-location" = "字节 [0x10] 的取值"
"swsh-lan:--request-gap" = "请求之间的秒数；主机在 40 ms 内应答了 BDSP 的请求"
"swsh-lan:--connect-station" = "请求中 0x05 处头部字节及其 IV 源 id 的取值；列表或 LO-HI"
"swsh-lan:--respond" = "用连接响应应答控制台发给我们的连接请求"
"swsh-lan:--respond-result" = "0 也可接受"
"swsh-lan:--respond-with" = "响应中两个 id 字段分别放入谁的常量 id 和变量 id——这是推断，因此 “both” 会在多次重传中交替使用两者"
"swsh-lan:--request-platform" = "[2] 处平台字节的取值。9 是真实值；任何其他值都会得到连接响应而不是被丢弃，这可用于探测我们的消息是否真的到达 0x14 处理程序"
"swsh-lan:--request-flags" = "MESSAGE 标志字节的取值。0x09 是主机在自己的 Local Protocol 消息上使用的值；BDSP 的站点请求携带 0x11"
"swsh-lan:--request-unicast" = "把请求发送给主机而不是广播地址"
"swsh-lan:--request-broadcast" = "改为把它们发送到广播地址"
"swsh-lan:--src-var" = "我们自己的站点变量 id；省略时为新的随机值，因为在 BDSP 上复用一个会被当成“already one of my stations”"
"swsh-lan:--no-variable-id" = "清除 [3]，这会让控制台跳过变量 id 比较"
"swsh-lan:--unicast" = "发送给主机而不是广播地址"
"swsh-lan:--join" = "站点握手关闭后，发送 Mesh Protocol（0x18）加入请求，并对返回的任何内容回 ack"
"swsh-lan:--join-wait" = "等待站点接受多久后放弃加入"
"swsh-lan:--join-seconds" = "重传加入请求多久；Pia 自带的加入端到 10 就放弃"
"swsh-lan:--join-gap" = "Pia 每 500 毫秒重传一次未确认的加入请求"
"swsh-lan:--join-port" = "加入流程所使用的 Pia 端口；更新网格使用可靠端口"
"swsh-lan:--join-station-index" = "字节 [1]。0xFD 是 0x017c1700 比较所针对的值；其他任何值都是说明已进入处理程序的标志"
"swsh-lan:--join-ack-id" = "加入请求的固定确认 id；省略时随机"
"swsh-lan:--answer-rtt" = "应答控制台的 0x58 RTT 请求。版本 4 下为十六字节，回复会回显那七个尚未被读取的字节"
"swsh-lan:--ack-reliable" = "确认 0x7C 可靠窗口。通过的信号是重传停止，并且序列号继续前进"
"swsh-lan:--ack-slots" = "填充 32 个 ack 槽位中的哪些；“all”（默认）会全部填充，因为只会读取某个站点索引处的槽位，而具体是哪个索引尚未确定。“0” 是主机，“1” 是我们"
"swsh-lan:--ack-lowest-pending" = "头部自身的“待确认的最低序列号”。我们在该协议上尚未发送任何内容，因此 1（我们将要使用的下一个 id）和 0 都说得通；主机自身在等待自己的第一条消息时发送 1"
"swsh-lan:--data-destination" = "0x58 和 0x7C 上的站点 BITMAP。主机向我们发送 2，即站点索引 1；1 是站点 0（也就是主机）的位"
"swsh-lan:--send-data" = "mesh 建立后发送 APPLICATION DATA - 本项目的第一次。载荷以十六进制给出；\"610000000a00\" 就是主机在 0x7C 上反复发给我们的六个字节。没有这个标志就什么也不发送"
"swsh-lan:--send-protocol" = "0x80（广播可靠窗口，默认值：它每秒向我们请求一次序列 1）或 0x7c（单播窗口，它从未有 ack 可发给我们，因为它从未收到过我们的数据）"
"swsh-lan:--send-sequence" = "序列 id。两个窗口都要求 1；第一条消息还会携带 FLAG_IS_INITIALIZED，并定义流的起始位置"
"swsh-lan:--send-stream" = "流 id。0 是主机在两个协议上发送的值"
"swsh-lan:--send-destinations" = "头部的目标列表。“console” 指定其站点常量 id，即它自己的广播 ack 对我们的做法；“none” 发送计数 0，0x01859578 从不过滤该值，且每条 0x7C 消息都会携带它。“auto” 按协议镜像主机：0x7C 上为 none，0x80 上为 console"
"swsh-lan:--send-zlib" = "压缩消息，就像控制台压缩它发送的每条 0x80 消息那样。该标志属于 Pia 消息（版本 4 下为 0x10），所以怎么选都没有代价 —— 而且它只是一个变量，所以单独扫它"
"swsh-lan:--send-port" = "Pia 消息端口。主机在 0 和 1 上发送它的 0x80 ack，每个数据包同时携带两者；“0,1” 即是照此模拟"
"swsh-lan:--send-wait" = "等待站点握手多久后放弃发送"
"swsh-lan:--send-after" = "接受之后多少秒才发第一条数据消息，这样它到达时 mesh 加入与 RTT 交换已经在进行"
"swsh-lan:--send2-data" = "经由 --send2-protocol 的第二条流，在主机发出 --send2-trigger 后发送。`60ea000012020801` 是 BlockDataHolder{imReady:true}，主机在 0x80 上发出它并等待它"
"swsh-lan:--send2-trigger" = "发送前先在 --send2-protocol 上等待该负载；省略则在网格一建立就发送"
"swsh-lan:--trade-ready" = "我们的提供被确认后，在 TRADE holder（20030）上发送 imReady。主机从未发送过这些字节，而已发布的客户端会在提供之前等待它们，所以也许轮到我们来说"
"swsh-lan:--rpc-port-answers" = "在交换 RPC 自己的 Pia 端口上、用它自己的可靠窗口来应答。控制台在 0x7C 端口 1 上发送它们；在端口 0 上应答会落在它不读取它们的窗口上"
"swsh-lan:--answer-migration" = "用 MIGRATION_RESPONSE 应答控制台在 0x18 端口 1 上的 MIGRATION_START。只有玩家接受时 `440001` 才会到达那里，而之后控制台会在所有窗口上静默：它最后请求的是两字节的 mesh，而不是应用数据"
"swsh-lan:--leave-with-host" = "当主持主机离开时，对其携带主机迁移状态的更新会话进行 ack，并在其 START_HOST_MIGRATION 时离开网络，如同它自己的客户端所做；每一步在无应答时等待 10 秒"
"swsh-lan:--migration-answer" = "主机迁移网格时发送的内容。“auto” 在开始消息指定我们为下一个主机时发送 MIGRATION_FINISH，指定其他任何对象时发送 MIGRATION_RESPONSE，这与二进制中的行为一致。“response” 则始终应答 0x48，用于对比"
"swsh-lan:--open-content" = "我们的提供被确认后，对每个 N 在 content N 的 10000 基址 holder 上发送 `ping`，例如 40 对应 `382700000a00`；这正是 nxldn-lab 的客户端用来开始确认阶段的开场消息，此处根据我们自己的 content 注册表重建，而不是照抄"
"swsh-lan:--confirm-command" = "当 CONFIRMATION 信封（40040）发送主体以 `0100` 结尾的四字节状态时——这与选择内容在其宝可梦之前发送的提示相同——在该内容以 10000 为基的 holder 上、id 10040、可靠端口 0 回复 SyncSaveDataHolder{syncCommand{data:N}}，并在端口 1 上应答状态本身。内容 40 接受的是命令而不是宝可梦：其解析器 0x010df6d0 接受一条携带一个 int32 的子消息。它自身的机器按该顺序发送 0、1、2 和 3（swsh_trade.SYNC_COMMANDS）"
"swsh-lan:--confirm-phase" = "用低 u16 中的阶段 N 来应答确认内容的四字节步骤，而不是回显控制台自己的值。控制台正是从这些字节读出其阶段（`0x006d6490` 存储它们，`0x006d3260` 读取它们），而本项目迄今发送的每个步骤都是把该值原样回显"
"swsh-lan:--ladder-refresh" = "确认阶梯等待主机回应期间，每隔 SECONDS 秒重新发送我们那对 40040 消息，并将其中的时钟推进到当前时间。0 表示关闭"
"swsh-lan:--abort-on-stall" = "一旦确认阶梯产生了它的第一个步骤，就在 SECONDS 过去而没有新的步骤体之后立即结束本次运行：停止发送、断开连接，让实机报告连接丢失。用确认把停滞的阶梯维持住，反而会让游戏宣布交换失败，这会让玩家损失大约一小时。最后一个步骤体之后除了确认没有别的内容。0 表示关闭，此时会完整地保持等待。"
"swsh-lan:--confirm-commands" = "--confirm-command 的握手形式：每当确认内容在 elementId 20000 上放入新的四字节主体时，依次发送这些值中的下一个。内容 40 自身的机器发送 0,1,2,3，并在每步之后停留；一条命令可推进两级，之后阶梯便停止"
"swsh-lan:--confirm-final-delta" = "CONFIRMATION content 用哈希应答我们的 syncCommand 后，重新装载 40040 这一对，并以该时钟增量再次发送两个成员，这正是 --selection-final-delta 在 40050 上所做的动作，可让选择阶段越过它自己的哈希"
"swsh-lan:--selection-final-delta" = "选择 HASH 被应答后，以该时钟增量再次发送 40050 对的两个成员。nxldn-lab 的 `selection_final_delta` 为 9（nxldn-lab 的 `selection_final_delta`）。--rpc-pair 按封套锁存，因此第二对需要先清除锁存。0 表示关闭"
"swsh-lan:--open-content-offer" = "让 --open-content 在 10000 基址的 holder 上发送我们的 PK8，而不是空的 `ping`。ping 会打开 content 50 并被当作我们的宝可梦：实机因此进入确认阶段，并要求玩家用他们的宝可梦换一颗蛋。同一时刻、同一 holder，里面放一只宝可梦"
"swsh-lan:--box-on-accept" = "MIGRATION_START 一到就发送这些 box 命令 - 这是唯一表示玩家按下接受的信号。主机在此之后还会持续确认约五秒"
"swsh-lan:--box-period" = "排队的 offer 后载荷之间的秒数。把它们拉开，让轮扫覆盖到接受：主机是在接受时才拆除，而不是靠计时器，因此几秒内发出的命令都会在拆除前到达"
"swsh-lan:--selection-offer" = "当主机在选择阶段宝可梦之后跟随主体以 `0100` 结尾的状态时，在该内容以 10000 为基的 holder（id 10050）上、可靠端口 0 提供我们的宝可梦，并在端口 1 上应答该状态"
"swsh-lan:--pair-after-hash" = "hash 体应答之后，发送针对它的双成员 RPC 对来打开 content N 的阶段（40 是确认）。在这台实机上，只有成对的形式才能打开一个阶段：40030 打开了提供，40050 打开了选择。单纯的内容 ping（`382700000a00`）和单纯的 sync-120 ping（`780000000a00`）都会被忽略"
"swsh-lan:--sync-after-offer" = "把 holder N 上的 sync 紧跟在我们的选择提供之后排队，放在 --selection-offer 打开时真正执行的那条分支里。--sync-after-hash 在那里无法触发：这个可以"
"swsh-lan:--sync-field" = "--sync-after-hash 发送哪个 SyncPingDataHolder 字段：1 ping、2 pingReply、3 pingSynced（`780000001a00`，即跟踪记录中的那个）"
"swsh-lan:--sync-after-hash" = "hash 体应答之后，在端口 0 上对 sync holder N 发送 `ping`（120 是确认用的那个）。实机会自己驱动 97、60000、110 和 130，并在 130 的 pingSynced 到达时打开选择阶段；它从不发送 120。阶段跟随的是它的 sync，而不是内容 ping"
"swsh-lan:--open-after-hash" = "hash 体应答之后，在端口 0 上对 content N 的 10000 基址 holder 执行 `ping` 以打开下一阶段——40 就是确认，因此这会发送 `382700000a00`。hash 应答到达后，实机就停止发送 40050 且不再多说什么；Pia 会重传它仍在等待的一切，所以这种静默意味着已满足，下一阶段需要主动打开"
"swsh-lan:--rpc-bodies" = "对 40000 频段内每个不同的 (envelope, base, field-5 body) 只应答一次，此外还覆盖开局的那一对。每条消息的时钟都会前进，所以载荷不能当作键，但消息体可以：`00000000` 和 `000018fc` 是开局消息，其他任何值都是新的。按 envelope 设置的守卫会在哈希体处停止应答并卡在那里"
"swsh-lan:--rpc-pair" = "把控制台的 40030 RPC 当作它本来的一对来应答：每个 base 收集一个成员，先 10000 后 20000，以 BASE 字段为键。`payload[5] in (0x19, 0x1A)` 是内层长度，并随发送方的 station-id varint 变化（某些控制台上是 0x1A/0x1B）。按该顺序各发送一次，此窗口内不再发送其他内容；`said_by_port` 只保留最后一个载荷，所以镜像会反复发送其中一个成员，永远不发另一个"
"swsh-lan:--open-early" = "在 0x84 快照 ack 时、双方都尚未发起提供之前，对 content N 的 10000 基址 holder 执行 `ping`。主机的盒子发送受 content+0x4c 处的一个 ready 布尔值控制，只有 `0x010ce040` 在结果码为 0 时会设置它；在此之前，游戏尝试发送的每条命令都停在 content+0x48。停下的命令若与下一条不匹配，就会置位错误字节 +0x4d，而 `0x010c9bb0` 会把它变成交换状态 9：中止，应用层上没有任何提示"
"swsh-lan:--box-open" = "主机一确认我们的 0x84 快照就发送这些 box 命令 - 早于任一方提供宝可梦。游戏只在交换会话建立后的第一帧、且 session+0x419 处的角色位为 clear（0x010c9bb0）时发送一次命令 3，因此两方中总有一方要在其他事情发生前先给开场。若改为在双方都 offer 之后才发送，主机会在玩家还在挑选时就离开"
"swsh-lan:--box-commands" = "我们的提供被确认后，依次对每个 N 在 trade holder 上发送 boxSyncStateCommand{data:N}，每个已确认的序列发一条。20030 是 BoxSyncStateDataHolder，其字段 2 是命令枚举；本项目 1 表示提供、2 表示撤回；4 表示确认、5 表示撤回确认"
"swsh-lan:--snapshot-account" = "替换快照 profile 开头的三个 id（伪设备 id、账号 Uid、网络服务账号 id）。它们属于实机自身，否则会原样交回"
"swsh-lan:--selection-offer-data" = "配合 --selection-offer：在 RPC 端口上用携带我们 ownerId 的 40050 Data 的第 5 个字段（`body`）放入我们的 PK8 来应答主机的选择状态，而不是在 10050 端口 0 上用 PokemonTradeDataHolder。Content 50 的接收处理程序会把发送方解析为站点索引，无法解析时静默丢弃；holder 形式不携带 owner"
"swsh-lan:--selection-offer-sweep" = "把我们的 PK8 作为 elementId 10000 上的 Data 发送，并作为 30000 基址 id（30050）上的 holder 发送，每个 content 都会注册它。可同时指定多个变量"
"swsh-lan:--selection-offer-high" = "配合 --selection-offer：把我们的 PK8 作为 PokemonTradeDataHolder 放在基于 20000 的 holder（id 20050）上来应答选择状态，箱子阶段自己的宝可梦正是在它之上多一个 content 传输的。覆盖 --selection-offer-mirror 和 --selection-offer-data"
"swsh-lan:--selection-offer-mirror" = "配合 --selection-offer：把我们的 PK8 放进携带主机自身字段集的 40050 来应答选择状态 - 即 syncId、clock、body，且不含 elementId 和 ownerId，这正是它自己的选择提议被解码的方式。覆盖 --selection-offer-data"
"swsh-lan:--offer-echo" = "原样回送实机刚提供给我们的那个 PK8，而不是从 --send-snapshot 里取一个。这些字节来自它自己的存档，所以如果运行仍然中止，就可以排除这条记录"
"swsh-lan:--offer-on-50" = "把我们的 PK8 放进 40050 对中第二个成员的字段 5。content 50 是 PokemonTradeDataHolder，即传输；content 30 是盒子交换。一个 344 字节的 PK8 就装在该字段里"
"swsh-lan:--send-selection" = "何时在 0x7c 端口 1 上用一对 40050 开始选择阶段。“offer”在我们的提供被确认后立即发送，这是主机仍在读取的唯一窗口；“migration”在迁移开始时发送，此时主机已经停止。这一对消息与主机自己的 40030 是同一个封套，位于偏移 50，并带我们的站点 id；构建器会逐字节复现它的 40030 对"
"swsh-lan:--update-mesh" = "一旦迁移使我们成为主机，就像实机那样广播 UPDATE_MESH：用它最后发出的那条，并把主机索引设为我们的。实机在移交角色后就停止发送这些消息，如果没有任何一方接手，mesh 大约 1.3 s 后就会消失"
"swsh-lan:--update-mesh-period" = "多久广播一次；实机大约每 2 s 发送一次"
"swsh-lan:--migration-period" = "每隔多久重传迁移响应，直到被确认"
"swsh-lan:--answer-once" = "对控制台发送的每个载荷只应答一次，而不是每个周期都为其上一个载荷重新推导答案。`said` 从不清空，所以没有这个选项时，一个提议会发出数百次。控制台自己的每条消息只发送一次"
"swsh-lan:--offer-slot" = "回赠 --send-snapshot 的哪个队伍槽位，1-6；0 表示不提供任何内容，只记录主机提供给我们的内容"
"swsh-lan:--offer-file" = "用于 --offer-slot 并取代快照记录的 .pk8，可以是盒子或同行格式、加密文件或 PKHeX 解密导出文件。除非指定 --offer-file-as-is，否则会使用快照的初训家名称与 ID。可重复指定，会话中每次交换一条：主机的玩家会从盒子里重新选择；之后的所有交换都使用最后一条"
"swsh-lan:--trade-back" = "每次交换后再次交换，将主机刚送出的宝可梦换回，让需要通信进化的宝可梦在主机上进化；玩家需将本程序送出的宝可梦换回（docs/architecture.md，Trade back）"
"swsh-lan:--fresh-pid" = "为每只被提议的宝可梦抽取新的加密常数和 PID"
"swsh-lan:--offer-file-as-is" = "保留文件自带的初训家名和训练家 id"
"swsh-lan:--offer-species" = "在 --offer-slot 中构建记录，而不是原样发送：使用这个全国图鉴编号，在快照公布的队伍记录中以及提议中都是如此，好让两者仍然讲同一个故事"
"swsh-lan:--offer-ability" = "所构建记录的特性 id；--offer-species 会保留模板原来的特性"
"swsh-lan:--offer-level" = "所构建记录 0x148 处的等级字节，1..100；除非给出 --offer-experience，否则经验值字保持不变"
"swsh-lan:--offer-experience" = "所构建记录 0x10 处的经验值字"
"swsh-lan:--offer-moves" = "四个招式 id，以逗号分隔；0 表示清空该槽位。PP 保持模板中原有的值"
