"sv-join:--scene-id" = "只加入此 LDN 场景的网络：4 为连接交换，7 为太晶团体战"
"sv-join:--raid-pokemon" = "加入主机开设的太晶团体战大厅，并带上这份通过 PKHeX 合法性检查的同行宝可梦记录。本程序角色会准备就绪、回应开始，并在对战开始时离开，由其宝可梦替主机继续战斗"
"sv-join:--raid-ready-delay" = "在团体战大厅中、我们的玩家准备之前的秒数"
"sv-join:--union-circle" = "加入实机托管的集友圈，像团体战客人加入团体战那样：占住座位、发送我们的身份、打开游戏的通道、应答主机的开始、把我们的玩家放到主机所在的位置并在 --hold 期间保持（docs/sv_union_circle.md）"
"sv-join:--circle-task" = "搭配 --union-circle：完成指定任务后，本程序角色会离开集友圈并结束运行。snacksworth 会在开场演出结束后，每秒为建房玩家补上一项其缺少的团队任务或单人任务通关，以补齐解锁点心大叔全部传说宝可梦所需的通关；bp 则完成一项给予建房玩家 --bbq-clear BP 的任务"
"sv-join:--bbq-clear" = "--circle-task bp 给予的 BP，范围为 1 到 9999999"
