"sv-host:--raid-event" = "创建活动团体战：指定宝可入口站新闻的配信文件夹（EventsGallery 活动或其 Files）；种子会按 --raid-version 与 --raid-progress 抽取活动遭遇，并忽略 --raid-map 与 --raid-content"
