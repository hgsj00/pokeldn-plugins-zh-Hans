"bdsp-join:--room-walk" = "可靠握手之后，发送 N 条我们自己的位置消息，并观察主机的屏幕"
"bdsp-join:--join-wait" = "--room-pattern fixed：一次加入最多等待多少秒来引出主机对 NetCharacterStateData 的请求，超时后就发出下一次"
"bdsp-join:--room-walk-steps" = "突发模式行走中的位置消息。按实机自身的步幅，60 就是 55.8 个单位，会完全离开 Union Room；传 8 可以让行走在屏幕仍能看到的地方结束"
"bdsp-join:--room-walk-period" = "突发模式中位置消息之间的秒数。默认值是主机自身的中位间隔"
"bdsp-join:--room-walk-stride" = "单条位置消息跨越的单位数。默认值来自主机自身行走的实测（每 0.41 秒 0.93 单位，基于其 80 条消息）；我们最初的行走是每 0.6 秒 0.15 单位，只有真实玩家速度的九分之一，卡顿全在于此"
"bdsp-join:--no-answer-requests" = "用它指名的消息应答控制台的 NetRequestData。自首次加入以来，它在每次抓包中都请求数据 id 0x23，却从未被应答；这就是那个探针，所以单独启用它"
"bdsp-join:--no-match-wait" = "用 isMatchWait=1 而不是 0 来应答控制台对 NetDataIsMatchWaitData (0x23) 的请求。UnionRoomManager$$SetNetData 中有一处比较以此为交换的门槛（main.bin 0x01fd56e4 处的 `cmp w23, #1`，随后是 UnionFrontDeskTradeController$$StartMatch）；此前每次运行都回答 0，那表示站点拒绝被匹配"
"bdsp-join:--no-trade-reply" = "用我们的消息应答控制台的交换消息。它会先发一条训练家记录，再发一只宝可梦，然后等待；两者都未应答时，玩家会停在“En attente d'une reponse”。这不会完成一次交换 —— 玩家仍要在自己的屏幕上确认，在那里拒绝则存档保持不变"
"bdsp-join:--no-complete-trade" = "用 tradeState=WAIT 应答 NetDataTradeReadyOkData (0x21)，并让交换完成。这会写入控制台的存档：该消息是控制台 `targetTradeState` 的唯一写入者，两个状态都为 WAIT 会把 UnionTradeManager 转入 SECURIY_TRADE，而 TradeStateModel$$InitState 会调用 PlayerSave。玩家选中的宝可梦会离开其盒子，我们的宝可梦取而代之。需要 --trade-reply。请先询问用户"
"bdsp-join:--security-repeat" = "我们安全阶段状态的重复间隔秒数，直到主机报告 SEND_READYOK。CHILD 主机的 SEND_READYOK 只有在其中收到消息时才会结束"
"bdsp-join:--fresh-pid" = "以新的 PID 与加密常数提供，保留异色状态，让曾接收过的存档能再次接收"
"bdsp-join:--trade-template" = "要提供的 PB8（328 或 344 字节，加密文件或 PKHeX 解密导出文件），可由 --trade-nickname 与 --trade-ot 修改。328 字节所含的信息远多于本项目已解析的部分，因此我们发送的是修改了已知字段的真实宝可梦，而非凭空编造。可重复指定，按顺序每次交换一个；列表用完后重复提供最后一个"
"bdsp-join:--trade-nickname" = "所提供宝可梦的昵称"
"bdsp-join:--trade-back" = "每次交换后再次交换，将主机刚送出的宝可梦换回，让需要通信进化的宝可梦在主机上进化；玩家需将本程序送出的宝可梦换回（docs/architecture.md，Trade back）"
"bdsp-join:--answer-return-select" = "只应答控制台的 NetDataReturnSelectData（一次回合重置）一次；该应答没有测到任何效果"
"bdsp-join:--return-select-value" = "用于应答的字节（默认 0，即主机对 {1} 的应答 [0x1c27f48]；{1} 会被理解为我们退出，且在阶段 2 之后会显示“对方取消了交换”）"
"bdsp-join:--trade-ot" = "所提供的宝可梦的初训家名称"
"bdsp-join:--trade-name" = "我们自己的训练家记录中的名字"
"bdsp-join:--save-shown" = "将主机在交换画面上显示的每只宝可梦写入此文件夹，无论交换是否完成"
"bdsp-join:--trade-save-poke" = "交换完成后，将主机换出的宝可梦写入何处；第 N 次交换（N > 1）写入 FILE-N"
"bdsp-join:--join-offset-x" = "我们的角色相对于主机自身角色在 x 上的生成位置。默认 +2.0 固定在某一侧，而站在该侧墙边的玩家会生成到边界之外（随后崩溃）。负值则放到另一侧"
"bdsp-join:--join-offset-z" = "z 方向上的同一值"
"bdsp-join:--no-initiate-talk" = "主动走向主机的角色，而不是等对方走过来。主机选择表情后会原地站定等待被交互，因此正在招募的主机只能由别人走过去接触。等到其广播状态表明正在招募后，发送 NetDataTalkReserveData，也就是主机自己的字节 63 00 01 00"
"bdsp-join:--after-approach" = "在对方回应我们的接近后发送此消息，也就是发起方接下来要发的那条。`0x06:0000000000` 是 NetDataTalkData{sexId 0, CHECK}，正是 SwitchTalkStateMine 构造的内容。可重复指定，按顺序发送"
"bdsp-join:--after-approach-gap" = "靠近应答与每条 --after-approach 消息之间的秒数"
"bdsp-join:--initiate-delay" = "主机开始广播后等待多少秒再靠近"
"bdsp-join:--initiate-tries" = "放弃前重传 approach 多少次"
"bdsp-join:--initiate-gap" = "靠近重传之间的秒数"
"bdsp-join:--match-wait-period" = "配合 --match-wait：在整个保持期间每 S 秒额外发送一次 NetDataIsMatchWaitData{1}（0 表示禁用，只保留按请求应答）。主机只在 t=8.4-9.4 请求一次 0x23，而玩家要在这之后很久才能在 Y 菜单里进入交换选项"
"bdsp-join:--after-talk" = "应答对话预约后，在可靠流上发送此游戏消息，`0x08:00` 是 NetDataSelectData{index: 0}。可重复指定，按顺序发送。主机会停在 TalkState GREETING 等待被推进，而究竟是哪条消息能推进它无法离线判断：这就是用来扫描的入口"
"bdsp-join:--after-talk-gap" = "对话应答与每条 --after-talk 消息之间的秒数"
"bdsp-join:--no-answer-talk" = "用 NetDataTalkReserveResultData 应答 NetDataTalkReserveData。若不应答，玩家的角色会卡住"
"bdsp-join:--can-talk" = "NetDataTalkReserveResultData.IsCanTalk：1 接受对话，0 拒绝。拒绝是安全的探测方式：它应当释放玩家，而不是展开一段我们无法维持的流程"
"bdsp-join:--state" = "主机请求 NetCharacterStateData 时我们角色上报的 OpcState.OnlineState。0 NONE 表示“什么都不做”，即角色处于空闲；3 RECRUITMENT_BATTLE、4 RECRUITMENT_TRADE、5 RECRUITMENT_RECORD、6 RECRUITMENT_GREETINGS、8 COMMUNICATE"
"bdsp-join:--recruiting" = "StateData.isRecruiment，即同一应答的第二个字节"
"bdsp-join:--join-avatar" = "NetJoinData.avatarId，它决定使用哪个模型：它作为 UnionCharacterTable 的索引，OpLoadCharacter 会加载对应的资源名。默认值 8 就是屏幕上显示的那个女孩"
"bdsp-join:--join-color" = "NetJoinData.colorId。游戏也会根据 avatar id 推导一个颜色（OpcManager.GetNpcColorId），因此它可能不是起决定作用的字段"
"bdsp-join:--request-ids" = "走动之后，为这些数据 id 各发送一条 NetRequestData，在可靠流上逐条发送，并打印返回的内容。联盟交谊厅会应答其中六个 id（docs/bdsp_protocol.md）；0x22 则是不透明的那个"
"bdsp-join:--pre-request" = "在第一次 --request-ids 请求之前放入可靠流的一条游戏消息，例如 0x59:01000100 可把站点 1 加入主机的等待匹配列表。可重复指定，按顺序发送"
"bdsp-join:--no-ug-join" = "地下大洞窟：主机的 NetZoneData 到达后，在其所在区域、以它的位置加上 --join-offset-x/z 发送 NetUgJoinData"
"bdsp-join:--ug-join-delay" = "主机的 NetZoneData 之后多少秒才进行地下（Underground）加入"
"bdsp-join:--answer-with" = "当主机发送游戏消息 ID 时，用 FILE 中的主体（原始字节，无头部）应答一次：0x15:capsule.bin 用我们的球壳应答其球壳，0x14:record.bin 应答其记录"
"bdsp-join:--inject-file" = "轮询此文件，并把每个新的 `ID:HEX` 行作为游戏消息在可靠窗口上发送，重传直到被确认。各行只发送一次，按顺序；`#` 开始注释"
"bdsp-join:--request-gap" = "一个请求到达与下一个请求发出之间的秒数"
"bdsp-join:--request-delay" = "走动之后多少秒才发第一个请求"
"bdsp-join:--no-send-card" = "走动之后，为我们自己的站点发送一条 NetDataTranerCardData。这条消息描述玩家的外观，要验证的是游戏为我们绘制的角色是否会在屏幕上改变"
"bdsp-join:--room-pattern" = "square 每个角生成一个角色；line 和 fixed 用来检验游戏眼中的身份标识是站点还是位置"
"bdsp-join:--no-reliable-auto-ack" = "主机发来的可靠数据一到就确认"
"bdsp-join:--reliable-sweep" = "尝试偏移 1 处字节的多少个取值"
"bdsp-join:--reliable-ack-wait" = "静默要持续多久才算一次已送达的确认"
"bdsp-join:--connect-timeout" = "单次连接请求等待应答的时长"
"bdsp-join:--no-rtt" = "在我们占着座位时，应答控制台的 RTT 请求（协议 0x58）"
"bdsp-join:--no-leave-on-host-migration" = "当实机主机开始主机迁移（Local Protocol 0x13）时离开网络，该消息在其玩家离开房间时发出；留下的站点会看到它重复 10 s，之后实机才关闭其网络"
"bdsp-join:--no-join-ack" = "在 STATION 协议上对 mesh 加入响应回 ack"
"bdsp-join:--join-ack-seconds" = "持续确认 mesh 加入响应多久；主机会每 500 ms 重发一次，直到被确认"
"bdsp-join:--ack-repeats" = "对接受做多少次确认；实机会重复发送它直到被确认"
"bdsp-join:--sweep-ids" = "探测全部 256 个协议 id，而不只是 wiki 里点名的那些"
"bdsp-join:--ids" = "改为探测以逗号分隔的 id 列表"
"bdsp-join:--vary-var" = "识别之后，改变变量 id，以找出结果 7 究竟在检验什么"
"bdsp-join:--gap" = "等待回复的秒数；每个探测都会得到回复，所以这个值很短"
"bdsp-join:--probe-id" = "主机未注册的协议 id，因此其版本为 0"
"bdsp-join:--probe-version" = "在期望值为 0 时发送 1，必定得到“版本过高”"
"bdsp-join:--unicast" = "只做单播这一遍，跳过广播那一遍"
"bdsp-join:--broadcast-only" = "只做广播这一遍，即确认所验证的组帧"
