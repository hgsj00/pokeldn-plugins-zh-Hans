"sv-circle-join:--join-player-id" = "加入请求中的 16 字节玩家 id：“arceus”（先 1 后 0，作为两个大端 u64，即零售版 Arceus 所声明的值）、“random”、“high”（带前导 0xff 的随机值）或 32 个十六进制数字。朱版主机自身的值是 10047bd4a25543e057cee5c71ab1f2a2（sv18）"
"sv-circle-join:--join-player-name" = "加入请求中唯一玩家记录里的玩家名；零售主机的该值为单个空格"
