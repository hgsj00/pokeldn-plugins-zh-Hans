"za-online:--fresh-pid" = "以新的 PID 与加密常数发送提供，保留异色状态，让接收过这条记录的存档能再次接收"
"za-online:--offer-at" = "在预览之后这么多秒做出我们的选择，而不等待实机的选择；默认会应答实机的选择"
"za-online:--offer-out" = "将主机选定的宝可梦写入此处；第 N 次交换（N > 1）写入 FILE-N。主机光标停留在盒子上时的预览不会写入"
"za-online:--save-shown" = "将主机在交换画面上显示的每只宝可梦写入此文件夹，不论交换是否完成"
"za-online:--ip-host" = "通过局域网经 ldn_mitm 为模拟主机建房；无需无线射频设备和 root 权限"
"za-online:--our-ip" = "配合 --ip-host：要通告的地址"
"za-online:--comm-id" = "十六进制；默认为该标题自身的值。模拟的 Z-A 会通过 ldn_mitm 通告并扫描 ffffffffffffffff"
"za-online:--hold-after-trade" = "交换后实机回到它的盒子之后，可选地保留座位这么多秒，然后把会话交给实机并关闭；默认情况下主机会等待实机离开"
"za-online:--online" = "与远方的玩家交换：对方主机的提供会在这里给出，双方都只在两台主机都确认后才确认（docs/online.md）"
"za-online:--online-code" = "双方玩家进入的房间；默认为连接密码，而没有密码就无法遇到其他在线交换的玩家"
"za-online:--gift-event" = "按相同顺序指定各条 --trade-offer 所依据的神秘礼物卡片：即其在 PKHeX 配信数据库中的键（pokeldn.pokemon.Service.gift_events）"
"za-online:--for-receiver" = "交换时，对于使初训家成为领取者本人的 --gift-event 卡片，按主机存档重新生成：由主机先提供宝可梦，根据该存档捕捉到的宝可梦确定训练家；若无法确定，则使用主机会话数据中的训练家。两者都失败时，按原样提供，使用“设置”中的训练家（pokeldn.receiver_gift，docs/gift_simulated.md）"
"za-online:--trade-back" = "每次交换后再次交换，将主机刚送出的宝可梦换回，让需要通信进化的宝可梦在主机上进化；玩家需将本程序送出的宝可梦换回（docs/architecture.md，Trade back）"
