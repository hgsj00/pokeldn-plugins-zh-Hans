"lgpe-join:--discover-timeout" = "等待扫描响应和同步多久"
"lgpe-join:--ack-peer-clock" = "在克隆类型 2 的确认中携带对端的通告时钟，而不是从我们自己的通告往返得来的时钟，后者才是参考加入者所携带的"
"lgpe-join:--trainer-name" = "身份数据中携带的玩家名称，即交换界面显示的名称"
"lgpe-join:--our-trainer" = "替换第一条消息中的训练家 id 对。在共享同一存档的两个模拟器之间捕获的载荷会带有主机自己的 id 对，这会把加入端呈现为它正在交换的那个站点"
"lgpe-join:--leave-after" = "像实机退出交换界面那样离开会话，时机在我们应答的第一个交换步骤之后这么久（docs/lgpe_session.md）"
"lgpe-join:--hold-after-trade" = "队列中最后一次交换结束后等待指定时长再离开座位；默认本次运行会一直保留座位，直到主机离开或时间限制结束"
"lgpe-join:--stall-leave" = "在双方玩家都已投票、而主机这么久仍未同意时，按实机退出的方式离开，且发生在任何提交之前；0 表示从不。它结束的是等待，而不是一次已确认交换已经保存的交换锁"
"lgpe-join:--received" = "将对方提供的 PB7 写入此处"
"lgpe-join:--save-shown" = "将主机在交换界面上显示的每只宝可梦写入此文件夹，无论交换是否成功"
"lgpe-join:--fresh-pid" = "为每条 --offer 重新生成 PID 和加密常数，保留异色状态，使先前接收过的存档能再次接收"
"lgpe-join:--offer" = "用我们自己的盒子结构回应房主提供的宝可梦。echo 会将房主自己的原样送回，游戏因此必然接受；给出路径时，该文件是 232 字节的结构，加密与否均可。可重复指定，座位上的每次交换各用一条；第 N 次交换会将收到的内容写入 --received 并加上 -N。最后一条之后，不再回应后续交换，玩家便退出"
"lgpe-join:--withhold-announce" = "仅测试：只对房主跳过我们前 N 条通告，视作丢失，让重发把它们带过去"
