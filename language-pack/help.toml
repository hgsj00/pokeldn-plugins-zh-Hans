"frlg-gift:--gift-file" = "完整的 FRLG .pokegift 文件，或 .wc3 神秘卡片"
"frlg-gift:--export-gift" = "保存一个 .pokegift 文件后退出，不使用无线电"
"frlg-gift:--save-to-board" = "将礼物保存到 ESP32 开发板后结束运行；此后每次通电，开发板都会在无须电脑的情况下自行向每台加入的主机配信"
"frlg-gift:--save-backup" = "把控制台整个 128 KB 的存档复制到 FILE（.sav）；控制台的存档不会被改动 [docs/frlg_gift.md, Save backup and restore]"
"frlg-gift:--save-restore" = "把 .sav 文件写入主机：紧挨其最新存档，逐个读回每个扇区，然后由游戏载入并保存；任一步未完成都保留旧存档"
"frlg-gift:--save-restore-emerald" = "将绿宝石的 .sav 文件写到主机最新存档旁边，然后就此停止，供之后传输绿宝石 ROM 使用；正在运行的游戏会保留自己的存档（docs/rse_switch_build.md，Delivery without Atmosphere）"
"frlg-gift:--rom-transfer" = "将 .gba ROM 写入主机的 ROM 副本，然后软重启进入；该 ROM 会一直有效，直到游戏重新启动（docs/rse_switch_build.md，Delivery without Atmosphere）"
"frlg-gift:--rom-live" = "配合 --rom-transfer：用 JSON 文件给出主机自身会话所运行的 ROM 区块（格式为 {game code: [block, ...]}），取代程序包内自带的实测区块"
"frlg-gift:--rom-base" = "配合 --rom-transfer：主机自身卡带的 ROM（取自其 RomFS）；随后以主机的副本为参照改用 LZMA 传输，传输量约为原本的三分之一；设为 none 时，不使用卡带作为参照，仍采用 LZMA，传输量约为原本的一半"
"frlg-gift:--rom-no-boot" = "配合 --rom-transfer：写入并检查所有区块后结束会话，而不启动它"
"frlg-gift:--save-resume-dir" = "配合 --save-backup：保留在此处被链路中断的备份；下一次从它继续"
"frlg-gift:--news" = "要分发的神秘新闻负载（神秘礼物 → 神秘新闻 → 好友）。\n可选新闻：\n  pokeldn  id 1：最简单的连接证明新闻，内容是从 CERULEAN CITY 那个男人处获得一颗树果\n  berry    id 2：一条十行的新闻，用来检验主机的滚动指示器"
"frlg-gift:--buffer-script" = "通过 CLI_RUN_BUFFER_SCRIPT 在主机上运行原生 ARM 代码，而不是发送礼物：trainer-id-probe：从 gSaveBlock2Ptr 读出 playerTrainerId 并返回（只读，不写入任何内容）；save-dump：利用主机交给我们的指针读出两个存档块中任意一块的任意部分，无需绝对地址（只读，不写入任何内容）；memory-dump：把主机自己的外发消息重新指向目标，从而读出主机内存的任意区域（需要 --dump-address；只读，不写入任何内容）；memory-dump-multi：同上，但在一次会话中读取若干个连续块（--dump-address --dump-blocks N）：客户端脚本对每个块运行一次载荷，每一轮发送下一个千字节；memory-dump-scatter：同上，但各块是互不相关的地址（--dump-scatter A,B,C）：载荷携带一张基址表，由游标索引它，因此一次会话读的是计划真正要求的十六千字节，而不是十六个连续千字节；save-write：向存档块写入字节，并在同一次运行中读回同一区域；主机随后会存档，因此写入会落到 flash（--write-hex、--dump-block、--dump-offset）；rng-trace：每帧采样一个内存字，可在每次采样的两半之间调用一个 ROM 函数，并对返回的东西检查 LCG 递推（--trace-address、--trace-call、--trace-samples；只读，外加被调用函数自身所做的一切）；memory-scan：在内存中搜索一个 32 位值并返回它所在的位置；它返回 0 表示下一帧再被调用，因此一次运行可覆盖任何 dump 都无法覆盖的范围（--scan-word、--scan-start、--scan-end、--scan-blocks；只读，不写入任何内容）；table-scan：按形状在内存中搜索一张表，即 N 个连续的字、每个都恰好比前一个高 D，并返回每一段的起始位置及其起始值；当表中没有任何已知常量时，就是这样找到指针表的（--table-delta、--table-runlen、--table-start、--table-end、--table-blocks；只读，不写入任何内容）；rom-checksum：对一段内存做校验和，最多分 128 块，每块返回一个和；主机把它们与同一 ROM 镜像上的相同和并列比较，并指出不同的块（--sum-start、--sum-end、--sum-block、--sum-budget、--sum-reference；只读，不写入任何内容）；anchors：向机器询问它在哪里：我们自己的加载地址、返回 ROM 的返回地址、栈，以及客户端的五个缓冲区（只写它自己的外发缓冲区）；create-mon：调用 CreateMon，一个接收八个参数的 ROM 函数，并返回它构建的 100 字节 struct Pokemon；宝可梦构建在我们自己的镜像内，因此除非 --create-mon-append 或 --create-mon-destination 要求，主机上不会被写入任何内容（--create-mon-call、--create-mon-species、--create-mon-level、--create-mon-personality）；string-gather：跟随一个指针数组并把字符串本身连续发回，而不是发回一个大多是指针的窗口：一次运行取回整个 Easy Chat 组（--gather-address、--gather-count、--gather-stride；只读，不写入任何内容）；call：以我们选定的参数调用任意 ROM 函数，最多八个字，先放 r0..r3 再放栈，并返回其 r0，同时在调用两侧各读一个地址（--call-address、--call-arg、--call-watch）；载荷本身不写入任何内容，但被调用函数可能会写，因此该地址必须已先作为代码读过；flash-read：选择 flash bank，用 CPU 从 64 KiB 窗口中按字节复制一个存档扇区到 EWRAM，并发送这份副本：主机的外发消息无法直接指向 flash 本身（--flash-sector、--flash-read-offset、--dump-size；只读，不写入任何内容）；flash-patch：通过分 bank 的窗口从 flash 读出一个存档扇区，修改一个字段，重算校验和并用 swi 0x48 写回，然后递增带计数器的扇区，好让加载器采用该 band。不从 RAM 重建任何东西，因此存档例程会序列化的字段不会丢失（--flash-id、--flash-patch-offset、--flash-patch-hex；需要 --write-unsafe）；flash-write：在主机上的 EWRAM 中拼出 4 KB，并用 swi 0x48 直接写入一个 flash 扇区，完全绕开游戏的存档代码 - 没有计数器、校验和或签名（--flash-sector、--flash-fill-base、--flash-fill-step、--flash-words；位于存档 band 内的扇区需要 --write-unsafe）；call-chain：在一帧内运行一组 ROM 调用和内存访问，并为每一步返回一个字，任何一步都可以把上一步的结果用作自己的地址 - 这正是让返回指针的函数（GetVarPointer）变成一次写入的方式（--chain-step，可重复；写入步骤需要 --write-unsafe）；sloop-svc：以我们选定的 r0..r3 发出一个 Sloop 系统调用（swi 0x40..0x62），可选地把 r0 或 r1 指向我们发送的最多 256 字节，并按系统调用留下的状态返回寄存器和这些字节（--svc-number、--svc-arg、--svc-text/--svc-hex、--svc-data-in；只读集合之外的编号需要 --write-unsafe）；install-resident：把一个常驻钩子复制到 EWRAM 顶部并安装到 gIntrTable[4]，它会在那里每帧运行，直到软复位；返回它找到的 V-blank 处理程序（--resident turbo，--resident-param extra=N field=N battle=N hold=0x100 budget=228；需要 --write-unsafe）；install-kept：在检查校验和后，安装保存在存档 filler_B20 中的常驻钩子（由 save-write --resident 写入）；返回它找到的 V-blank 处理程序，未安装任何东西时返回 0xBAD0BAD0；rom-reset-probe：通过 swi 0x48 折叠把 4 KB 模式写入 0x08000000 + n * 0x1000 处的 ROM 副本，然后做 GBA 软复位，以确定 ROM 副本的写入能否经受软复位。第二次神秘礼物会话会 dump 该地址（--rom-fold-n、--rom-fill-base；需要 --write-unsafe）"
"frlg-gift:--dump-address" = "配合 --buffer-script memory-dump：要读出的主机地址（0x02000000 EWRAM、0x03000000 IWRAM、0x08000000 ROM）。接受 0x 十六进制"
"frlg-gift:--dump-scatter" = "配合 --buffer-script memory-dump-scatter：要读取的互不相关的地址，每个一块，按此顺序。方案要求的是分散的若干 KB，而不是一个长区域，这就是响应它的 payload。接受 0x 十六进制"
"frlg-gift:--dump-blocks" = "配合 --buffer-script memory-dump-multi：在一次会话中拉取多少个连续块。MG_LINK_BUFFER_SIZE 限制的是一条消息而非一次会话，因此客户端脚本对每个块运行一次 payload，每轮发送下一个块"
"frlg-gift:--dump-size" = "配合 --buffer-script memory-dump：要读取的字节数，1..1024（MG_LINK_BUFFER_SIZE）"
"frlg-gift:--dump-block" = "配合 --buffer-script save-dump：要读取哪个存档块；sav2 是名字、训练家 ID 和图鉴，sav1 是队伍、背包、金钱、flag 和变量"
"frlg-gift:--dump-offset" = "配合 --buffer-script save-dump：该块内的字节偏移。接受 0x 十六进制"
"frlg-gift:--dump-file" = "配合用于转储的 --buffer-script：把返回的字节写入此文件"
"frlg-gift:--table-delta" = "配合 --buffer-script table-scan：该段中每个字必须比前一个字大出的值。2 可找出指向连续 u16 的指针表，gSpecialVars 正是如此。接受 0x 十六进制"
"frlg-gift:--table-runlen" = "配合 --buffer-script table-scan：连续多少个字才值得作为一段报告（默认 12，即 gSpecialVar_0x8000..0x800B 这十二个条目）"
"frlg-gift:--table-start" = "配合 --buffer-script table-scan：起始位置，按 16 字节对齐（默认 0x08000000，即卡带）"
"frlg-gift:--table-end" = "配合 --buffer-script table-scan：要读取的最后一个地址之后一位（默认 0x09000000）"
"frlg-gift:--table-blocks" = "配合 --buffer-script table-scan：每帧扫描的 16 字节块数（默认 192，对帧的指令负担与 memory-scan 的 512 相同）"
"frlg-gift:--table-max-calls" = "配合 --buffer-script table-scan：看门狗，以调用次数（= 帧）计"
"frlg-gift:--sum-start" = "配合 --buffer-script rom-checksum：起始位置，按 --sum-block 对齐（默认 0x08000000，即卡带）"
"frlg-gift:--sum-end" = "配合 --buffer-script rom-checksum：要累加的最后一个地址之后一位，须为 --sum-start 之后的整数个块（默认 0x09000000）"
"frlg-gift:--sum-block" = "配合 --buffer-script rom-checksum：块大小，从 32 起的 2 的幂；范围内最多 128 块（默认 0x20000）"
"frlg-gift:--sum-budget" = "配合 --buffer-script rom-checksum：每帧累加的 32 字节块数（默认 512，对帧的负担不超过 memory-scan 的 512）"
"frlg-gift:--sum-max-calls" = "配合 --buffer-script rom-checksum：看门狗，以调用次数（= 帧）计（默认：该范围所需的次数加二）"
"frlg-gift:--sum-reference" = "配合 --buffer-script rom-checksum：用于比较校验和的 ROM 映像（默认：config.REFERENCE_ROMS 为主机版本指定的映像）"
"frlg-gift:--scan-word" = "配合 --buffer-script memory-scan：要搜索的 32 位值。payload 返回 0 以便下一帧再次被调用，因此一次运行能扫描整个范围，而不是 dump 读取的 1024 字节。接受 0x 十六进制"
"frlg-gift:--scan-start" = "配合 --buffer-script memory-scan：起始位置，按 32 字节对齐（默认 0x08000000，即卡带）"
"frlg-gift:--scan-end" = "配合 --buffer-script memory-scan：要读取的最后一个地址之后一位（默认 0x09000000，即 16 MB 卡带的末尾）"
"frlg-gift:--scan-blocks" = "配合 --buffer-script memory-scan：每帧扫描的 32 字节块数，即主机链路必须承受的预算（默认 512，约为 16 ms 一帧中的 3 ms）"
"frlg-gift:--scan-max-calls" = "配合 --buffer-script memory-scan：看门狗。始终不返回 1 的 payload 会让神秘礼物菜单卡住，因此扫描在这么多帧后放弃并作答（默认：该范围所需的帧数加二）"
"frlg-gift:--gather-address" = "配合 --buffer-script string-gather：要跟随的数组中第一个指针的地址。返回结果就是这些字符串本身，首尾相接，因此一次运行能带回整张表，而不是一个主要由指针组成的窗口。接受 0x 十六进制"
"frlg-gift:--gather-count" = "配合 --buffer-script string-gather：最多跟随多少个指针"
"frlg-gift:--gather-stride" = "配合 --buffer-script string-gather：从一个指针到下一个指针的字节数（默认 12，即 struct EasyChatWordInfo，其 `text` 位于偏移 0；纯 `const u8 *` 数组则为 4）"
"frlg-gift:--gather-maxlen" = "配合 --buffer-script string-gather：可接受的最长字符串，含终止符。否则并非字符串的指针会被一直复制到遇上 0xFF 为止（默认 64）"
"frlg-gift:--trace-address" = "配合 --buffer-script rng-trace：每帧采样一次的字。gRngValue 在法文卡带上为 0x03004220，在英文卡带上为 0x030042D0 [builds.py]。接受 0x 十六进制"
"frlg-gift:--trace-call" = "配合 --buffer-script rng-trace：在每个样本的两次读取之间调用的 ROM 函数，以 THUMB 指针给出（bit 0 置位），0 表示不调用。Random 在法文版是 0x080486B1，英文版是 0x08048671；两次读取之间的递推关系便是这两个地址确如我们所言的证据"
"frlg-gift:--trace-samples" = "配合 --buffer-script rng-trace：采样多少帧，1..96"
"frlg-gift:--call-address" = "配合 --buffer-script call：要调用的 ROM 函数，以 THUMB 指针给出（bit 0 置位）。在法文卡带上 SeedRng 为 0x080486D1、Random 为 0x080486B1，在英文卡带上分别为 0x08048691 和 0x08048671 [builds.py]。地址按原样发送，所以要配合 --console-build 使用。0 表示不调用任何函数，用于在不涉及 ROM 的情况下检查发送路径"
"frlg-gift:--call-arg" = "配合 --buffer-script call：一个参数字，可重复，最多八个。前四个放入 r0..r3，其余放在栈上的 [sp+0..12]，CreateMon 自身的序言会从那里读取它们"
"frlg-gift:--call-watch" = "配合 --buffer-script call：一个在调用前和调用后各立即读取一次的字，两次都会返回。gRngValue 在法文版是 0x03004220，英文版是 0x030042D0。对于不返回任何值的函数（例如 SeedRng），这是该调用确实达到了调用目的的唯一证据"
"frlg-gift:--expect-console" = "除非加入的实机是这张卡带，否则拒绝该会话，并对照其游戏数据中的版本进行检查。不匹配时不发送任何内容"
"frlg-gift:--console-build" = "hook、stub 或 ROM 调用按哪个游戏代号构建地址：BPRF、BPGF、BPRE、BPGE、BPRS、BPGS、BPRD、BPGD、BPRI、BPGI、BPRJ、BPGJ。auto（默认）会为每个代号构建，并在发送任何依赖地址的内容之前，发送主机游戏代码所指明的那个；其他代号会被拒绝。一个游戏代码只服务于对应卡带。没有构建地址的字节无论如何都会发往任何主机"
"frlg-gift:--chain-step" = "--buffer-script call-chain：一个步骤，可重复，最多 16 个，在一帧内按顺序执行。`call:NAME_OR_ADDR[,ARG]...` 调用 ROM 函数（AddBagItem、AddMoney、AddPCItem、CalcCRC16、CheckBagHasItem、CheckBagHasSpace、CompactPartySlots、CreateMon、FlagClear、FlagGet、FlagSet、GetMoney、GetSetPokedexFlag、GetVarPointer、IncrementGameStat、InitRamScript、IsEnoughMoney、ItemIsMail、Random、ReadFlash、RemoveBagItem、RemoveMoney、RunScriptImmediately、SeedRng、SpeciesToNationalPokedexNum、StringCompare、VarGet、VarSet，或一个 THUMB 地址）；`read32|read16|read8:ADDR` 读取；`write32|write16|write8:ADDR,VALUE` 写入并回读自身，且需要 --write-unsafe。目标为 `prev` 表示上一步的结果，`prev+N` 表示其后 N 字节，这正是把返回指针的函数变成写入的方式；一个操作可带 +keep 以保持 prev 不变。示例：--chain-step call:GetVarPointer,0x4024 --chain-step write16:prev,7。具名函数会在主机的构建版本上解析"
"frlg-gift:--create-mon-call" = "配合 --buffer-script create-mon：以八个参数调用的 ROM 函数，THUMB 指针。默认是主机版本的 CreateMon（法文版 0x08041151，英文版 0x080411FD）；0 表示不调用任何函数，用于在不涉及 ROM 的情况下检查发送路径"
"frlg-gift:--create-mon-species" = "配合 --buffer-script create-mon：宝可梦编号，1..411（内部编号，不是全国图鉴编号）"
"frlg-gift:--create-mon-level" = "配合 --buffer-script create-mon：等级，1..100"
"frlg-gift:--create-mon-iv" = "配合 --buffer-script create-mon：所有个体值都设为这个值，0..31。32 或更大则改为随机生成 [USE_RANDOM_IVS]，这会使运行结果不确定"
"frlg-gift:--create-mon-personality" = "配合 --buffer-script create-mon：32 位性格值，它决定性格、性别、特性槽，并与训练家 ID 一起决定宝可梦是否异色。省略时，主机用 Random32 随机生成一个"
"frlg-gift:--create-mon-ot-id-type" = "配合 --buffer-script create-mon：0 = 初训家是玩家，ID 取自真实存档；1 = 使用 --create-mon-ot-id；2 = 反复随机直到不是异色"
"frlg-gift:--create-mon-ot-id" = "配合 --buffer-script create-mon --create-mon-ot-id-type 1：要使用的初训家 ID"
"frlg-gift:--create-mon-append" = "配合 --buffer-script create-mon：把生成的宝可梦追加到玩家的队伍。槽位由 gSaveBlock1Ptr 计算得出，不能直接指定，且始终是第一个空闲槽 - playerParty[playerPartyCount] - 因此绝不会碰到已占用的槽位，也不会有宝可梦被销毁。队伍已满时不写入任何内容并会说明。这是玩家的实时存档，主机会把它提交到 flash：需要 --write-unsafe"
"frlg-gift:--create-mon-append-dry-run" = "配合 --buffer-script create-mon：与 --create-mon-append 相同的运行 - 相同的调用、对同一个 gSaveBlock1Ptr 的相同运算 - 只是省略了会修改存档的两处写入。它会报告队伍数量和本应写入的地址，并读回该槽位当前的 100 字节，因此结果能说明真实运行会覆盖什么。不写入任何内容，所以不需要额外授权"
"frlg-gift:--create-mon-destination" = "配合 --buffer-script create-mon：把生成的 100 字节复制到主机内存中的这个地址。无论哪种方式，宝可梦都在我们自己的映像里构建，因此不指定它就不会向主机写入任何内容。需要 --write-unsafe"
"frlg-gift:--write-text" = "配合 --buffer-script save-write：写入 --dump-offset 处存档块的 ASCII 内容。同一次运行中会读回同一区域，因此结果即是证明。主机会随后保存，所以内容会进入 flash"
"frlg-gift:--write-hex" = "配合 --buffer-script save-write：要写入的字节，以十六进制给出"
"frlg-gift:--flash-sector" = "配合 --buffer-script flash-write：swi 0x48 要写入的 4 KB flash 扇区（0..31）。扇区 0..27 属于两个存档区段，需要 --write-unsafe；28..31 不属于其中任何一个"
"frlg-gift:--rom-fold-n" = "配合 --buffer-script rom-reset-probe：要写入的 ROM 副本区块（每块 4 KB），范围为 0..0xFFF；地址为 0x08000000 + N * 0x1000。载荷会在该处写入一段模式并进行软重启；需要 --write-unsafe"
"frlg-gift:--rom-fill-base" = "配合 --buffer-script rom-reset-probe：模式的 word[0]（默认为 'EMER'）"
"frlg-gift:--flash-fill-base" = "配合 --buffer-script flash-write：主机所构造模式的 word[0]"
"frlg-gift:--flash-fill-step" = "配合 --buffer-script flash-write：加到模式的每个字上"
"frlg-gift:--flash-words" = "配合 --buffer-script flash-write：要构造扇区的多少个字"
"frlg-gift:--flash-footer" = "配合 --buffer-script flash-write：构造一个格式正确的存档扇区，而不是原始模式 - 主机将数据之后的部分清零，对 3968 字节的数据区计算游戏自身的校验和，并写入 id、校验和、签名和计数器"
"frlg-gift:--flash-id" = "配合 --flash-footer：写入 +0xFF4 的扇区 ID"
"frlg-gift:--flash-counter" = "配合 --flash-footer：写入 +0xFFC 的存档计数器"
"frlg-gift:--flash-derive" = "配合 --flash-footer：在主机上读取 gLastWrittenSector 和 gSaveCounter，写入 --flash-id 此刻实际所在的扇区，而不是构造 payload 时计算出的位置。需要 --write-unsafe"
"frlg-gift:--svc-number" = "配合 --buffer-script sloop-svc：一个系统调用，0x40..0x62（0x4D 是 bad-word 检查）；最多重复八次，在一次会话中按顺序发出"
"frlg-gift:--svc-arg" = "配合 --buffer-script sloop-svc：依次为 r0、r1、r2、r3（可重复）"
"frlg-gift:--svc-text" = "配合 --buffer-script sloop-svc：要发送的 UTF-8 数据，最多 256 字节"
"frlg-gift:--svc-hex" = "配合 --buffer-script sloop-svc：改以十六进制给出数据"
"frlg-gift:--resident" = "配合 --buffer-script install-resident：要安装的挂钩（turbo）"
"frlg-gift:--resident-param" = "配合 --buffer-script install-resident：一个挂钩参数，例如 extra=6"
"frlg-gift:--svc-bkpt" = "配合 --buffer-script sloop-svc：改为发出 THUMB 的 `bkpt N` 而不是 `swi N`（0xFF 是游戏从不发出的那个；需要 --write-unsafe）"
"frlg-gift:--svc-data-in" = "配合 --buffer-script sloop-svc：让这个寄存器指向主机上的数据副本"
"frlg-gift:--flash-read-offset" = "配合 --buffer-script flash-read：从扇区内开始读取的字节偏移"
"frlg-gift:--flash-patch-offset" = "配合 --buffer-script flash-patch：该字段在扇区数据内的字节偏移"
"frlg-gift:--flash-patch-hex" = "配合 --buffer-script flash-patch：该字段的替换字节，以十六进制给出。扇区中其余内容都保持游戏自身存档例程写入的样子"
"frlg-gift:--flash-position" = "配合 --flash-derive：瞄准区段位置 N（0..13）并由它推导出 ID，而不是从 --flash-id 推导位置。位置 13 是 GetSaveValidStatus 为整个槽位报告计数器的那一个扇区"
"frlg-gift:--flash-counter-bias" = "配合 --flash-derive：加到页脚所用的 gSaveCounter 上。0 让该扇区留在自己的区段内；正值则可压过活动槽位"
"frlg-gift:--write-unsafe" = "允许写入 SaveBlock2 结构中从不读取的填充区域之外的存档内容。这是玩家的实时存档，主机会把它写入闪存；没有此选项时写入会被拒绝"
"frlg-gift:--flag-id" = "神秘卡片 flagId，1000..1019；不使用此选项时，会采用所选礼物已注册的默认值，见下方"
"frlg-gift:--questionnaire" = "要求主机在商店问卷中持有这条四词 Easy Chat 短语后才会发送任何内容 [SVR_CHECK_QUESTIONNAIRE]。每个词是一个英文单词名、`species:N`、`move:N`、`group/index` 或原始 id。在 species 与 move 组之外，词 id 按语言区分，所以先从目标主机上读出该短语：每次会话都会记录它当前持有的四个 id。"
"frlg-gift:--denied-message" = "不认识该口令的主机所读到的内容（最多 63 个字符）；默认为 “That is not the phrase.”"
"frlg-gift:--hunt-nature" = "配合 --gift rng-mon-hunt：搜索会接受哪些性格，以逗号分隔（Hardy、Lonely、Brave、Adamant、Naughty、Bold 等），也可用纯数字 ID。不指定则接受任意性格。"
"frlg-gift:--hunt-iv" = "配合 --gift rng-mon-hunt：某一项个体值的下限，可重复（speed=31、attack=20）。各项依次为 hp、attack、defense、speed、sp_attack、sp_defense，按 ROM 抽取它们的顺序命名 - 并非摘要界面显示的顺序。"
"frlg-gift:--event-pokemon" = "配合 --gift event-pokemon：第三代配信的一份全新副本，由 PKHeX 按该活动自身的 PID/个体值方法生成，例如 “WISHMKR Jirachi”、“10 ANIV Pikachu”、“Aura Mew”。优先使用 --language 指定的版本。不指定时，卡片会发送一份内置的 WISHMKR Jirachi。"
"frlg-gift:--hunt-cap" = "配合 --gift rng-mon-hunt：桩代码在放弃并保持 rng 不变之前最多尝试多少个状态。默认为能在 100 次中成功找到 99 次的最小上限。"
"frlg-gift:--hunt-species" = "配合 --gift rng-mon-hunt：桩代码自身的 `setwildbattle` 在屏幕上放出的内容。物种和等级都不来自 rng，因此这不影响搜索。默认是 5 级的 MAGIKARP，一个球即可捕获。"
"frlg-gift:--hunt-level" = "配合 --gift rng-mon-hunt：该物种出现的等级。"
"frlg-gift:--ram-script-map-group" = "RAM 脚本绑定到哪个地图组（[decomp:data/maps/map_groups.json] 中的 group_order 索引）。默认是玩家的家，那里的\n妈妈从不移动。华蓝洞窟 B1F 是组 1 地图 74，MEWTWO 是对象 3。"
"frlg-gift:--ram-script-map-num" = "RAM 脚本绑定到该组中的哪张地图。"
"frlg-gift:--ram-script-object" = "该地图上的哪个对象事件。局部 id 按 map.json 中的顺序分配，并从\n1 开始。绑定会替换该对象自身的脚本，因此请选一个从不移动的对象。"
"frlg-gift:--hunt-freeze-frames" = "配合 --gift rng-mon-hunt：最坏情况下搜索最多可以阻塞原野多久，以帧计（默认 900，约 15 秒）。搜索期间原野引擎尚未返回，因此玩家看到的是音乐照常播放的静止画面；搜索可能超过此时长的条件会在构造卡片之前被拒绝。"
"frlg-gift:--news-id" = "覆盖新闻 id（1..65535）。实机只在新闻与它已持有的不同时才保留它 [IsWonderNewsSameAsSaved]，所以要把同一段文本重发给同一台实机，就调大这个值"
"frlg-gift:--client-ready-idle-frames" = "诊断：LinkPlayer 待机之后、第一条神秘礼物消息之前的静默子轮询数；默认使用内置时序"
"frlg-gift:--inter-block-gap-frames" = "诊断：一条神秘礼物消息各块之间的空闲 VBlank 数；如果运行在消息中途卡住就把它调大（默认使用内置时序）"
"frlg-gift:--block-repeat" = "把每个块分片发送 N 次（1-8，默认 2）；以有限冗余对抗控制台的静默数据报丢失"
"frlg-gift:--ram-script-block-repeat" = "仅用于 ident-25 投递脚本的分片冗余（1-8，默认 3）；控制台从不回射礼物块，所以丢失的分片无法重发"
"frlg-gift:--no-end-on-success" = "在投递后的 RFU 关闭序列之后停止；由受监管的 run_mystery_gift.sh 房主使用"
"frlg-gift:--idle-timeout" = "在没有有意义的 Switch 流量（加入或 Pia/RFU 数据报）达到这么多秒后停止；默认：禁用"
"frlg-gift:--attempt-log-dir" = "把完成的加入尝试记录追加到 DIR 中按日生成的 csv 文件；默认：禁用（受监管的 shell 主机会启用 logs/）"
"frlg-gift:--game-data-log" = "把控制台关于自身的陈述 —— 它的卡片计数器、它的四个问卷词以及它的 Easy Chat 战斗资料 —— 追加到这个 jsonl 账本。tools/frlg/game_data_read.py 会读回它，并说明会话之间有哪些变化"
"frlg-gift:--no-make-artifact" = "为将要发送的确切神秘礼物字节写入带注释的清单（默认：禁用）"
"frlg-gift:--artifact-dir" = "--make-artifact 输出的目录（默认：artifacts）"
"frlg-gift:--config" = "共享房主 TOML（默认：config/host.toml）"
"frlg-gift:--local-config" = "可选的机器本地 TOML（默认：同目录的 host.local.toml）"
"frlg-gift:--no-local-config" = "不加载 host.local.toml"
"frlg-gift:--print-effective-config" = "打印安全且实际生效的主机配置并退出"
"frlg-gift:--ot" = "训练家名称；默认为 DEFAULT_TRAINER"
"frlg-gift:--version" = "游戏版本；默认为 DEFAULT_TRAINER"
"frlg-gift:--language" = "训练家语言；默认为 DEFAULT_TRAINER"
"frlg-gift:--id" = "十进制训练家 ID，后面可选填十进制里 ID"
"frlg-gift:--card-flag-id" = "我们在联盟交谊厅卡片交换中，训练家卡所声明的神秘卡片标志 id。持有该 id 卡片的主机会启用自身的卡片计数器，因此与我们进行交换或线缆俱乐部对战会使其递增 [union_room.c:1777]；默认 0，不启用任何计数器"
"frlg-gift:--no-trust-pia" = "使用由 Pia 支持的发送一次块投递（推荐）；--no-trust-pia 会启用诊断用的 RFU 重传"
"frlg-gift:--verbose" = "显示详细的协议日志，而不是里程碑"
"frlg-gift:--no-live" = "为真实的 Switch 当主机"
"frlg-gift:--password" = "十六进制 LDN 口令；默认使用 frlg 模拟器的值"
"frlg-gift:--phy" = "Wi-Fi phy；显式指定 phyN 时会覆盖 --adapter"
"frlg-gift:--adapter" = "--phy 为 auto 时使用的具名 Wi-Fi 网卡配置文件"
"frlg-gift:--over-ip" = "通过局域网而不是无线，为模拟控制台当主机：在端口 11452 上应答 ldn_mitm 发现，并用 UDP 承载 Pia。取要通告的地址，或 auto。不需要适配器，不需要 prod.keys，也不需要 root"
"frlg-gift:--comm-id" = "十六进制的 LDN local_communication_id"
"frlg-gift:--capture" = "记录一份可选的 JSONL 协议诊断数据"
"frlg-gift:--scene" = "LDN 场景；默认为已知的 FRLG 场景"
"frlg-gift:--no-skip-encryption" = "把发送 CCMP 交给 mac80211/硬件处理；空中帧仍保持加密"
"frlg-gift:--no-accept-decrypted-ccmp" = "接受保留了 CCMP 头和 MIC 的硬件解密接收帧（TP-Link Archer T3U/rtw88_8822bu 配置）"
"frlg-gift:--no-native-nonce-sequence" = "使用火红版会话级递增的 Pia nonce"
"frlg-gift:--no-session-response-first" = "在 type 5 广播之前先单播 Session type 2"
"frlg-gift:--tick-hz" = "主机每秒发出多少个 RFU 槽位（默认 59.727，每个 GBA VBlank 一个）。真实的一对实机远低于此；调低它会让每个连接步骤按相同倍数变慢。"
"rse-trade-host:--out" = "收到的宝可梦的输出路径"
"rse-trade-host:--save-shown" = "将主机在交换界面上显示的每只宝可梦写入此文件夹，无论交换是否成功"
"rse-trade-host:--slot" = "一次交换中提供的主机端同行位置，从 0 开始计数（默认：1）"
"rse-trade-host:--slots" = "用于多次交换的、从 0 开始的逗号分隔提议槽位"
"rse-trade-host:--union-room" = "为联盟室（宝可梦中心 2F 中间的 NPC）当主机，而不是交换中心的第三个 NPC；配合 --union-room-keepalive 120 和 --board-type 使用"
"rse-trade-host:--colosseum" = "开设电缆俱乐部 COLOSSEUM，而不是交换中心（宝可梦中心 2F，第三个 NPC -> Colosseum -> Single Battle -> JOIN）。入口仍是交换中心的，所以 --card-flag-id 仍会启动控制台的卡片计数器，而只有这条路径会增加其 battlesWon [decomp:src/cable_club.c:792]。整支队伍都会参战"
"rse-trade-host:--union-room-activity" = "--union-room 广播哪种活动；默认为 “in-room”，即站在房间里的主机所连接的那个裸 IN_UNION_ROOM。“search” 是房间之前那个界面所寻找的值（未测试）"
"rse-trade-host:--union-room-keepalive" = "联盟交谊厅：在第一个 UNI 帧之前，用 N 个 VBlank 重新发送父级 NI_START；若连续五帧无人应答，房间子进程就会断开链路，而它在最后一个 NI_START 之后 480 帧才进入 UNI。120 已验证"
"rse-trade-host:--board-type" = "联盟交谊厅交换板：登记所提供的宝可梦（其种类和等级）并求换该属性的宝可梦，这样主机的交换板上就会列出我们。主机必须拥有该属性的宝可梦才能开始交换"
"rse-trade-host:--board-level" = "覆盖交换板上显示的等级"
"rse-trade-host:--union-room-chat" = "联盟交谊厅：接受主机的“Tchat”而不是拒绝。双方各发送一个加入块，随后主机的键盘会打开，它输入的每一行都会被记录下来"
"rse-trade-host:--union-room-battle" = "联盟交谊厅：接受主机的“Combat”而不是拒绝。主机的同行中需要有两只 30 级或以下的非蛋宝可梦，否则它会在自己的屏幕上拒绝；对战由主机主控并运行，我们负责应答它的控制器命令"
"rse-trade-host:--battle-fight" = "联盟交谊厅对战：在第一个行动提示处选择战斗并使用第一个招式，而不是认输。目前只有认输路径在真机上得到验证"
"rse-trade-host:--battle-move" = "配合 --battle-fight 的联盟交谊厅对战：使用场上宝可梦四个招式栏中的哪一个。默认值 0 是第一个招式栏，对当前跟踪的队伍来说是 Refresh，不造成伤害"
"rse-trade-host:--chat-file" = "联盟交谊厅聊天：主机端运行期间持续跟踪此文件，并发送其中追加的每一行，这样就能实时回复聊天，而不必在启动时排入队列"
"rse-trade-host:--chat-message" = "联盟交谊厅聊天：聊天开始后要发送的一行内容，可重复指定。每条最多 15 个 Gen-3 字符表字符，这是主机键盘自身的上限，也是其聊天行能绘制的宽度；它们逐条发出，间隔 1.5 秒"
"rse-trade-host:--anim-delay" = "覆盖已验证的交换动画帧延迟"
"rse-trade-host:--player-ids-repeat-frames" = "诊断：开局的 SEND_PLAYER_IDS 突发在 LinkPlayer 块请求之前占用的连续轮询次数；默认使用内置时序"
"rse-trade-host:--link-player-idle-frames" = "诊断：LinkPlayer 交换之后、队长自己开始训练家卡片交换之前的静默控制台轮询数"
"rse-trade-host:--save-rounds" = "交换结束后、双方队伍再次交换之前的待机回合数；默认为 6（Switch《火红》的回合数），使用 --version emerald 时为 5（docs/rse_link.md，Trade）"
"rse-trade-host:--hold-after-trade" = "队列中最后一次交换结束后等待指定时长再关闭会话；默认本次运行会一直保持会话，直到主机离开或时间限制结束"
"rse-trade-host:--online" = "与远方的玩家交换：对方主机的提供会在这里给出，双方都只在两台主机都确认后才确认（docs/online.md）"
"rse-trade-host:--online-code" = "双方玩家进入的房间；默认为连接密码，而没有密码就无法遇到其他在线交换的玩家"
"rse-trade-host:--trade-back" = "每次交换后再次交换，将主机刚送出的宝可梦换回，让需要通信进化的宝可梦在主机上进化；玩家需将本程序送出的宝可梦换回（docs/architecture.md，Trade back）"
"rse-trade-host:--config" = "共享房主 TOML（默认：config/host.toml）"
"rse-trade-host:--local-config" = "可选的机器本地 TOML（默认：同目录的 host.local.toml）"
"rse-trade-host:--no-local-config" = "不加载 host.local.toml"
"rse-trade-host:--print-effective-config" = "打印安全且实际生效的主机配置并退出"
"rse-trade-host:--ot" = "训练家名称；默认为 DEFAULT_TRAINER"
"rse-trade-host:--version" = "游戏版本；默认为 DEFAULT_TRAINER"
"rse-trade-host:--language" = "训练家语言；默认为 DEFAULT_TRAINER"
"rse-trade-host:--id" = "十进制训练家 ID，后面可选填十进制里 ID"
"rse-trade-host:--card-flag-id" = "我们在联盟交谊厅卡片交换中，训练家卡所声明的神秘卡片标志 id。持有该 id 卡片的主机会启用自身的卡片计数器，因此与我们进行交换或线缆俱乐部对战会使其递增 [union_room.c:1777]；默认 0，不启用任何计数器"
"rse-trade-host:--no-trust-pia" = "使用由 Pia 支持的发送一次块投递（推荐）；--no-trust-pia 会启用诊断用的 RFU 重传"
"rse-trade-host:--verbose" = "显示详细的协议日志，而不是里程碑"
"rse-trade-host:--no-live" = "为真实的 Switch 当主机"
"rse-trade-host:--password" = "十六进制 LDN 口令；默认使用 frlg 模拟器的值"
"rse-trade-host:--phy" = "Wi-Fi phy；显式指定 phyN 时会覆盖 --adapter"
"rse-trade-host:--adapter" = "--phy 为 auto 时使用的具名 Wi-Fi 网卡配置文件"
"rse-trade-host:--over-ip" = "通过局域网而不是无线，为模拟控制台当主机：在端口 11452 上应答 ldn_mitm 发现，并用 UDP 承载 Pia。取要通告的地址，或 auto。不需要适配器，不需要 prod.keys，也不需要 root"
"rse-trade-host:--comm-id" = "十六进制的 LDN local_communication_id"
"rse-trade-host:--capture" = "记录一份可选的 JSONL 协议诊断数据"
"rse-trade-host:--scene" = "LDN 场景；默认为已知的 Direct Corner 场景"
"rse-trade-host:--no-skip-encryption" = "把发送 CCMP 交给 mac80211/硬件处理；空中帧仍保持加密"
