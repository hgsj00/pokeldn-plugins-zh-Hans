"sv-online:--send-at" = "DELAY:PROTO:PORT:HEX[:z][:start|:end]，在座位形成后指定秒数发送的可靠数据消息；序列号沿用该端口自身的序列。某个配对的主机端会在 9 秒时用这种方式发送自己的 0x7c 端口 1 表格更新"
"sv-online:--record-set" = "包含 NNN.bin 记录的文件夹；将这些记录通过 0x81 端口 0 发送，作为本主机端自己的身份，方式与配对中的主机端发送其 46 条记录相同。第一条带有 INITIALIZED，每条记录都已使用 zlib 压缩；默认使用 pokeldn.sv.reference 中的记录集"
"sv-online:--trainer-name" = "身份记录 1 携带的玩家名称，即交换画面显示的名称"
"sv-online:--no-identity" = "除非 --record-set 或 --send-on-open 指定了某个站点身份，否则不发送任何站点身份；默认使用 pokeldn.sv.reference 中记录的那个"
"sv-online:--record-delay" = "席位之后多少秒才发出记录集"
"sv-online:--records-per-packet" = "把记录按每 N 条打包成一个数据包，第一条之后的每个都继承其包头，正如零售版主机的重传轮次所做（docs/sv.md）"
"sv-online:--record-spacing" = "记录包之间的秒数；零售版团体战房主把它的身份分散在约 0.13 s 内"
"sv-online:--announce" = "用站点 id 运行游戏的端口 2 开场，而不是重放：在 0x80 端口 2 上携带本房主自己站点 id 的 type-7 通告，以及一个携带主机站点 id 的 type 9，作为对其在 0x7c 端口 2 上 type-3 join 的应答（pokeldn.sv.port2）"
"sv-online:--announce-delay" = "席位之后多少秒才发出 type 7；参考那一对的房主约在 2.3 时发送"
"sv-online:--fresh-pid" = "为每笔记录重新生成 PID 与加密常数，保留异色状态，让接收过它的存档能再次接收"
"sv-online:--trade-offer" = "保存本主机端所提供的 348 字节记录的文件（原始二进制或十六进制文本；352 字节的游戏报文会去掉头部）。指定后，主机端会以自己的提供回应主机送来的提供，并确认，像配对中的主机端一样随主机走完提交和四个交换步骤（pokeldn.sv.trade）。可重复指定：第 2 条及之后的记录在同一连接位置提供，每次交换一条，随每次交换结束依次使用"
"sv-online:--gift-event" = "按相同顺序指定各条 --trade-offer 所依据的神秘礼物卡片：即其在 PKHeX 配信数据库中的键（pokeldn.pokemon.Service.gift_events）"
"sv-online:--for-receiver" = "交换时，对于使初训家成为领取者本人的 --gift-event 卡片，按主机存档重新生成：由主机先提供宝可梦，根据该存档捕捉到的宝可梦确定训练家；若无法确定，则使用主机会话数据中的训练家。两者都失败时，按原样提供，使用“设置”中的训练家（pokeldn.receiver_gift，docs/gift_simulated.md）"
"sv-online:--trade-back" = "每次交换后再次交换，将主机刚送出的宝可梦换回，让需要通信进化的宝可梦在主机上进化；玩家需将本程序送出的宝可梦换回（docs/architecture.md，Trade back）"
"sv-online:--offer-set" = "在提供记录封装前写入其中的字段，名称按 pokeldn.sv.pokemon：nickname=SHINY、species=906、level=50、ivs=31,31,31,31,31,31、pid=0x1234、trainer_id=12345、ball=4、moves=33,0,0,0。可重复指定；单独使用 shiny 时，会按该记录自身的 ID 随机生成异色 PID"
"sv-online:--offer-dump" = "把所提供记录的 348 字节主体以十六进制写入此文件并退出，不需要射频"
"sv-online:--offer-out" = "将主机自己提供的宝可梦写入此文件，内容为其 80 00 02 00 报文的 348 字节主体，以十六进制文本表示。其内容可由 pokeldn.sv.pokemon 读取"
"sv-online:--save-shown" = "将主机在交换画面上显示的每只宝可梦写入此文件夹，不论交换是否完成"
"sv-online:--send-on-open" = "DELAY:PROTO:PORT:HEX[:z][:start|:end]，在主机宣布自己的 0x80 键已在 0x7c 端口 1 上打开后指定秒数发送。在该打开之前发往端口 0 的消息会被主机确认，却永远不会到达游戏；该端口上此后的所有消息同样如此；可重复指定；默认使用 pokeldn.sv.reference 中的身份分片"
"sv-online:--offer-after-open" = "主机打开 key-0x80 之后多少秒由房主先发 offer；与 --send-on-open 是同一道闸门"
"sv-online:--offer-at" = "席位之后多少秒由房主先发 offer，早于主机，如参考那一对的房主；不设此项时房主应答主机的 offer"
