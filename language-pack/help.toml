"swsh-lan-raid-join:--request-flags" = "MESSAGE 标志字节的取值。0x09 是主机在自己的 Local Protocol 消息上使用的值；BDSP 的站点请求携带 0x11"
"swsh-lan-raid-join:--request-unicast" = "把请求发送给主机而不是广播地址"
"swsh-lan-raid-join:--request-broadcast" = "改为把它们发送到广播地址"
"swsh-lan-raid-join:--src-var" = "我们自己的站点变量 id；省略时为新的随机值，因为在 BDSP 上复用一个会被当成“already one of my stations”"
"swsh-lan-raid-join:--no-variable-id" = "清除 [3]，这会让控制台跳过变量 id 比较"
"swsh-lan-raid-join:--unicast" = "发送给主机而不是广播地址"
"swsh-lan-raid-join:--join" = "站点握手关闭后，发送 Mesh Protocol（0x18）加入请求，并对返回的任何内容回 ack"
"swsh-lan-raid-join:--join-wait" = "等待站点接受多久后放弃加入"
"swsh-lan-raid-join:--join-seconds" = "重传加入请求多久；Pia 自带的加入端到 10 就放弃"
"swsh-lan-raid-join:--join-gap" = "Pia 每 500 毫秒重传一次未确认的加入请求"
"swsh-lan-raid-join:--join-port" = "加入流程所使用的 Pia 端口；更新网格使用可靠端口"
"swsh-lan-raid-join:--join-station-index" = "字节 [1]。0xFD 是 0x017c1700 比较所针对的值；其他任何值都是说明已进入处理程序的标志"
"swsh-lan-raid-join:--join-ack-id" = "加入请求的固定确认 id；省略时随机"
"swsh-lan-raid-join:--answer-rtt" = "应答控制台的 0x58 RTT 请求。版本 4 下为十六字节，回复会回显那七个尚未被读取的字节"
"swsh-lan-raid-join:--ack-reliable" = "确认 0x7C 可靠窗口。通过的信号是重传停止，并且序列号继续前进"
"swsh-lan-raid-join:--ack-slots" = "填充 32 个 ack 槽位中的哪些；“all”（默认）会全部填充，因为只会读取某个站点索引处的槽位，而具体是哪个索引尚未确定。“0” 是主机，“1” 是我们"
"swsh-lan-raid-join:--ack-lowest-pending" = "头部自身的“待确认的最低序列号”。我们在该协议上尚未发送任何内容，因此 1（我们将要使用的下一个 id）和 0 都说得通；主机自身在等待自己的第一条消息时发送 1"
"swsh-lan-raid-join:--data-destination" = "0x58 和 0x7C 上的站点 BITMAP。主机向我们发送 2，即站点索引 1；1 是站点 0（也就是主机）的位"
"swsh-lan-raid-join:--send-data" = "mesh 建立后发送 APPLICATION DATA - 本项目的第一次。载荷以十六进制给出；\"610000000a00\" 就是主机在 0x7C 上反复发给我们的六个字节。没有这个标志就什么也不发送"
"swsh-lan-raid-join:--send-protocol" = "0x80（广播可靠窗口，默认值：它每秒向我们请求一次序列 1）或 0x7c（单播窗口，它从未有 ack 可发给我们，因为它从未收到过我们的数据）"
"swsh-lan-raid-join:--send-sequence" = "序列 id。两个窗口都要求 1；第一条消息还会携带 FLAG_IS_INITIALIZED，并定义流的起始位置"
"swsh-lan-raid-join:--send-stream" = "流 id。0 是主机在两个协议上发送的值"
"swsh-lan-raid-join:--send-destinations" = "头部的目标列表。“console” 指定其站点常量 id，即它自己的广播 ack 对我们的做法；“none” 发送计数 0，0x01859578 从不过滤该值，且每条 0x7C 消息都会携带它。“auto” 按协议镜像主机：0x7C 上为 none，0x80 上为 console"
"swsh-lan-raid-join:--send-zlib" = "压缩消息，就像控制台压缩它发送的每条 0x80 消息那样。该标志属于 Pia 消息（版本 4 下为 0x10），所以怎么选都没有代价 —— 而且它只是一个变量，所以单独扫它"
"swsh-lan-raid-join:--send-port" = "Pia 消息端口。主机在 0 和 1 上发送它的 0x80 ack，每个数据包同时携带两者；“0,1” 即是照此模拟"
"swsh-lan-raid-join:--send-wait" = "等待站点握手多久后放弃发送"
"swsh-lan-raid-join:--send-after" = "接受之后多少秒才发第一条数据消息，这样它到达时 mesh 加入与 RTT 交换已经在进行"
"swsh-lan-raid-join:--send2-data" = "经由 --send2-protocol 的第二条流，在主机发出 --send2-trigger 后发送。`60ea000012020801` 是 BlockDataHolder{imReady:true}，主机在 0x80 上发出它并等待它"
"swsh-lan-raid-join:--send2-trigger" = "发送前先在 --send2-protocol 上等待该负载；省略则在网格一建立就发送"
"swsh-lan-raid-join:--trade-ready" = "我们的提供被确认后，在 TRADE holder（20030）上发送 imReady。主机从未发送过这些字节，而已发布的客户端会在提供之前等待它们，所以也许轮到我们来说"
"swsh-lan-raid-join:--rpc-port-answers" = "在交换 RPC 自己的 Pia 端口上、用它自己的可靠窗口来应答。控制台在 0x7C 端口 1 上发送它们；在端口 0 上应答会落在它不读取它们的窗口上"
"swsh-lan-raid-join:--answer-migration" = "用 MIGRATION_RESPONSE 应答控制台在 0x18 端口 1 上的 MIGRATION_START。只有玩家接受时 `440001` 才会到达那里，而之后控制台会在所有窗口上静默：它最后请求的是两字节的 mesh，而不是应用数据"
"swsh-lan-raid-join:--leave-with-host" = "当主持主机离开时，对其携带主机迁移状态的更新会话进行 ack，并在其 START_HOST_MIGRATION 时离开网络，如同它自己的客户端所做；每一步在无应答时等待 10 秒"
"swsh-lan-raid-join:--migration-answer" = "主机迁移网格时发送的内容。“auto” 在开始消息指定我们为下一个主机时发送 MIGRATION_FINISH，指定其他任何对象时发送 MIGRATION_RESPONSE，这与二进制中的行为一致。“response” 则始终应答 0x48，用于对比"
"swsh-lan-raid-join:--open-content" = "我们的提供被确认后，对每个 N 在 content N 的 10000 基址 holder 上发送 `ping`，例如 40 对应 `382700000a00`；这正是 nxldn-lab 的客户端用来开始确认阶段的开场消息，此处根据我们自己的 content 注册表重建，而不是照抄"
"swsh-lan-raid-join:--confirm-command" = "当 CONFIRMATION 信封（40040）发送主体以 `0100` 结尾的四字节状态时——这与选择内容在其宝可梦之前发送的提示相同——在该内容以 10000 为基的 holder 上、id 10040、可靠端口 0 回复 SyncSaveDataHolder{syncCommand{data:N}}，并在端口 1 上应答状态本身。内容 40 接受的是命令而不是宝可梦：其解析器 0x010df6d0 接受一条携带一个 int32 的子消息。它自身的机器按该顺序发送 0、1、2 和 3（swsh_trade.SYNC_COMMANDS）"
"swsh-lan-raid-join:--confirm-phase" = "用低 u16 中的阶段 N 来应答确认内容的四字节步骤，而不是回显控制台自己的值。控制台正是从这些字节读出其阶段（`0x006d6490` 存储它们，`0x006d3260` 读取它们），而本项目迄今发送的每个步骤都是把该值原样回显"
"swsh-lan-raid-join:--ladder-refresh" = "确认阶梯等待主机回应期间，每隔 SECONDS 秒重新发送我们这对 40040 消息，并将其时钟推进到当前时间。0 表示关闭"
"swsh-lan-raid-join:--abort-on-stall" = "一旦确认阶梯产生了它的第一个步骤，就在 SECONDS 过去而没有新的步骤体之后立即结束本次运行：停止发送、断开连接，让实机报告连接丢失。用确认把停滞的阶梯维持住，反而会让游戏宣布交换失败，这会让玩家损失大约一小时。最后一个步骤体之后除了确认没有别的内容。0 表示关闭，此时会完整地保持等待。"
"swsh-lan-raid-join:--confirm-commands" = "--confirm-command 的握手形式：每当确认内容在 elementId 20000 上放入新的四字节主体时，依次发送这些值中的下一个。内容 40 自身的机器发送 0,1,2,3，并在每步之后停留；一条命令可推进两级，之后阶梯便停止"
"swsh-lan-raid-join:--confirm-final-delta" = "CONFIRMATION content 用哈希应答我们的 syncCommand 后，重新装载 40040 这一对，并以该时钟增量再次发送两个成员，这正是 --selection-final-delta 在 40050 上所做的动作，可让选择阶段越过它自己的哈希"
"swsh-lan-raid-join:--selection-final-delta" = "选择 HASH 被应答后，以该时钟增量再次发送 40050 对的两个成员。nxldn-lab 的 `selection_final_delta` 为 9（nxldn-lab 的 `selection_final_delta`）。--rpc-pair 按封套锁存，因此第二对需要先清除锁存。0 表示关闭"
"swsh-lan-raid-join:--open-content-offer" = "让 --open-content 在 10000 基址的 holder 上发送我们的 PK8，而不是空的 `ping`。ping 会打开 content 50 并被当作我们的宝可梦：实机因此进入确认阶段，并要求玩家用他们的宝可梦换一颗蛋。同一时刻、同一 holder，里面放一只宝可梦"
"swsh-lan-raid-join:--box-on-accept" = "MIGRATION_START 一到就发送这些 box 命令 - 这是唯一表示玩家按下接受的信号。主机在此之后还会持续确认约五秒"
"swsh-lan-raid-join:--box-period" = "排队的 offer 后载荷之间的秒数。把它们拉开，让轮扫覆盖到接受：主机是在接受时才拆除，而不是靠计时器，因此几秒内发出的命令都会在拆除前到达"
"swsh-lan-raid-join:--selection-offer" = "当主机在选择阶段宝可梦之后跟随主体以 `0100` 结尾的状态时，在该内容以 10000 为基的 holder（id 10050）上、可靠端口 0 提供我们的宝可梦，并在端口 1 上应答该状态"
"swsh-lan-raid-join:--pair-after-hash" = "hash 体应答之后，发送针对它的双成员 RPC 对来打开 content N 的阶段（40 是确认）。在这台实机上，只有成对的形式才能打开一个阶段：40030 打开了提供，40050 打开了选择。单纯的内容 ping（`382700000a00`）和单纯的 sync-120 ping（`780000000a00`）都会被忽略"
"swsh-lan-raid-join:--sync-after-offer" = "把 holder N 上的 sync 紧跟在我们的选择提供之后排队，放在 --selection-offer 打开时真正执行的那条分支里。--sync-after-hash 在那里无法触发：这个可以"
"swsh-lan-raid-join:--sync-field" = "--sync-after-hash 发送哪个 SyncPingDataHolder 字段：1 ping、2 pingReply、3 pingSynced（`780000001a00`，即跟踪记录中的那个）"
"swsh-lan-raid-join:--sync-after-hash" = "hash 体应答之后，在端口 0 上对 sync holder N 发送 `ping`（120 是确认用的那个）。实机会自己驱动 97、60000、110 和 130，并在 130 的 pingSynced 到达时打开选择阶段；它从不发送 120。阶段跟随的是它的 sync，而不是内容 ping"
"swsh-lan-raid-join:--open-after-hash" = "hash 体应答之后，在端口 0 上对 content N 的 10000 基址 holder 执行 `ping` 以打开下一阶段——40 就是确认，因此这会发送 `382700000a00`。hash 应答到达后，实机就停止发送 40050 且不再多说什么；Pia 会重传它仍在等待的一切，所以这种静默意味着已满足，下一阶段需要主动打开"
"swsh-lan-raid-join:--rpc-bodies" = "对 40000 频段内每个不同的 (envelope, base, field-5 body) 只应答一次，此外还覆盖开局的那一对。每条消息的时钟都会前进，所以载荷不能当作键，但消息体可以：`00000000` 和 `000018fc` 是开局消息，其他任何值都是新的。按 envelope 设置的守卫会在哈希体处停止应答并卡在那里"
"swsh-lan-raid-join:--rpc-pair" = "把控制台的 40030 RPC 当作它本来的一对来应答：每个 base 收集一个成员，先 10000 后 20000，以 BASE 字段为键。`payload[5] in (0x19, 0x1A)` 是内层长度，并随发送方的 station-id varint 变化（某些控制台上是 0x1A/0x1B）。按该顺序各发送一次，此窗口内不再发送其他内容；`said_by_port` 只保留最后一个载荷，所以镜像会反复发送其中一个成员，永远不发另一个"
"swsh-lan-raid-join:--open-early" = "在 0x84 快照 ack 时、双方都尚未发起提供之前，对 content N 的 10000 基址 holder 执行 `ping`。主机的盒子发送受 content+0x4c 处的一个 ready 布尔值控制，只有 `0x010ce040` 在结果码为 0 时会设置它；在此之前，游戏尝试发送的每条命令都停在 content+0x48。停下的命令若与下一条不匹配，就会置位错误字节 +0x4d，而 `0x010c9bb0` 会把它变成交换状态 9：中止，应用层上没有任何提示"
"swsh-lan-raid-join:--box-open" = "主机一确认我们的 0x84 快照就发送这些 box 命令 - 早于任一方提供宝可梦。游戏只在交换会话建立后的第一帧、且 session+0x419 处的角色位为 clear（0x010c9bb0）时发送一次命令 3，因此两方中总有一方要在其他事情发生前先给开场。若改为在双方都 offer 之后才发送，主机会在玩家还在挑选时就离开"
"swsh-lan-raid-join:--box-commands" = "我们的提供被确认后，依次对每个 N 在 trade holder 上发送 boxSyncStateCommand{data:N}，每个已确认的序列发一条。20030 是 BoxSyncStateDataHolder，其字段 2 是命令枚举；本项目 1 表示提供、2 表示撤回；4 表示确认、5 表示撤回确认"
"swsh-lan-raid-join:--snapshot-account" = "替换快照 profile 开头的三个 id（伪设备 id、账号 Uid、网络服务账号 id）。它们属于实机自身，否则会原样交回"
"swsh-lan-raid-join:--selection-offer-data" = "配合 --selection-offer：在 RPC 端口上用携带我们 ownerId 的 40050 Data 的第 5 个字段（`body`）放入我们的 PK8 来应答主机的选择状态，而不是在 10050 端口 0 上用 PokemonTradeDataHolder。Content 50 的接收处理程序会把发送方解析为站点索引，无法解析时静默丢弃；holder 形式不携带 owner"
"swsh-lan-raid-join:--selection-offer-sweep" = "把我们的 PK8 作为 elementId 10000 上的 Data 发送，并作为 30000 基址 id（30050）上的 holder 发送，每个 content 都会注册它。可同时指定多个变量"
"swsh-lan-raid-join:--selection-offer-high" = "配合 --selection-offer：把我们的 PK8 作为 PokemonTradeDataHolder 放在基于 20000 的 holder（id 20050）上来应答选择状态，箱子阶段自己的宝可梦正是在它之上多一个 content 传输的。覆盖 --selection-offer-mirror 和 --selection-offer-data"
"swsh-lan-raid-join:--selection-offer-mirror" = "配合 --selection-offer：把我们的 PK8 放进携带主机自身字段集的 40050 来应答选择状态 - 即 syncId、clock、body，且不含 elementId 和 ownerId，这正是它自己的选择提议被解码的方式。覆盖 --selection-offer-data"
"swsh-lan-raid-join:--offer-echo" = "原样回送实机刚提供给我们的那个 PK8，而不是从 --send-snapshot 里取一个。这些字节来自它自己的存档，所以如果运行仍然中止，就可以排除这条记录"
"swsh-lan-raid-join:--offer-on-50" = "把我们的 PK8 放进 40050 对中第二个成员的字段 5。content 50 是 PokemonTradeDataHolder，即传输；content 30 是盒子交换。一个 344 字节的 PK8 就装在该字段里"
"swsh-lan-raid-join:--send-selection" = "何时在 0x7c 端口 1 上用一对 40050 开始选择阶段。“offer”在我们的提供被确认后立即发送，这是主机仍在读取的唯一窗口；“migration”在迁移开始时发送，此时主机已经停止。这一对消息与主机自己的 40030 是同一个封套，位于偏移 50，并带我们的站点 id；构建器会逐字节复现它的 40030 对"
"swsh-lan-raid-join:--update-mesh" = "一旦迁移使我们成为主机，就像实机那样广播 UPDATE_MESH：用它最后发出的那条，并把主机索引设为我们的。实机在移交角色后就停止发送这些消息，如果没有任何一方接手，mesh 大约 1.3 s 后就会消失"
"swsh-lan-raid-join:--update-mesh-period" = "多久广播一次；实机大约每 2 s 发送一次"
"swsh-lan-raid-join:--migration-period" = "每隔多久重传迁移响应，直到被确认"
"swsh-lan-raid-join:--answer-once" = "对控制台发送的每个载荷只应答一次，而不是每个周期都为其上一个载荷重新推导答案。`said` 从不清空，所以没有这个选项时，一个提议会发出数百次。控制台自己的每条消息只发送一次"
"swsh-lan-raid-join:--offer-slot" = "回赠 --send-snapshot 的哪个队伍槽位，1-6；0 表示不提供任何内容，只记录主机提供给我们的内容"
"swsh-lan-raid-join:--offer-file" = "用于 --offer-slot 并取代快照记录的 .pk8，可以是盒子或同行格式、加密文件或 PKHeX 解密导出文件。除非指定 --offer-file-as-is，否则会使用快照的初训家名称与 ID。可重复指定，会话中每次交换一条：主机的玩家会从盒子里重新选择；之后的所有交换都使用最后一条"
"swsh-lan-raid-join:--trade-back" = "每次交换后再次交换，将主机刚送出的宝可梦换回，让需要通信进化的宝可梦在主机上进化；玩家需将本程序送出的宝可梦换回（docs/architecture.md，Trade back）"
"swsh-lan-raid-join:--fresh-pid" = "为每只被提议的宝可梦抽取新的加密常数和 PID"
"swsh-lan-raid-join:--offer-file-as-is" = "保留文件自带的初训家名和训练家 id"
"swsh-lan-raid-join:--offer-species" = "在 --offer-slot 中构建记录，而不是原样发送：使用这个全国图鉴编号，在快照公布的队伍记录中以及提议中都是如此，好让两者仍然讲同一个故事"
"swsh-lan-raid-join:--offer-ability" = "所构建记录的特性 id；--offer-species 会保留模板原来的特性"
"swsh-lan-raid-join:--offer-level" = "所构建记录 0x148 处的等级字节，1..100；除非给出 --offer-experience，否则经验值字保持不变"
"swsh-lan-raid-join:--offer-experience" = "所构建记录 0x10 处的经验值字"
"swsh-lan-raid-join:--offer-moves" = "四个招式 id，以逗号分隔；0 表示清空该槽位。PP 保持模板中原有的值"
"swsh-lan-raid-join:--offer-nickname" = "所构建记录的昵称；会设置已起昵称标志"
"swsh-lan-raid-join:--offer-ot" = "所构建记录的初训家名"
"swsh-lan-raid-join:--offer-ivs" = "六项个体值，逗号分隔，按 PKHeX 的 HP,ATK,DEF,SPE,SPA,SPD 顺序"
"swsh-lan-raid-join:--save-offer" = "在触碰射频之前，把我们将要提供的 PK8 写入此文件"
"swsh-lan-raid-join:--save-shown" = "将主机在交换画面上显示的每只宝可梦写入此文件夹，无论交换是否完成"
"swsh-lan-raid-join:--save-offered" = "交换完成后，将主机换出的 PK8 写入此文件；第 N 次交换（N > 1）写入 FILE-N"
"swsh-lan-raid-join:--rpc-clock-delta" = "我们在应答中把交换 RPC 的时钟推进多远。5 是 nxldn-lab 的值，也是这条路径上此处唯一没有实测过的数字"
"swsh-lan-raid-join:--rpc-pair-advance" = "应答一组 RPC 对之后，把时钟推进这么多再重新发送两个成员。主机会在每次突发时把自己那一对的时钟推进 2（b41c、b61c、b81c）。时钟重复就意味着状态重复，因此只带一个时钟的应答永远不会推动我们的时钟。0 表示关闭"
"swsh-lan-raid-join:--selection-start" = "主机一报告 id 130 pingSynced 就发送我们自己的 40050 对，早于它自己的选择突发。nxldn-lab 的客户端就是这样开启选择阶段的，而这里的任何实现都从未开启过；在我们自己的抓包里，主机在其 40050 突发之前 0.3 s 发送 820000001a00"
"swsh-lan-raid-join:--ack-snapshot" = "对主机的 0x84 分片（类型 0x21，连续基址加位掩码）回 ACK。此前从未有实现确认过该协议，因此主机会把同一份快照重传 19142 次而始终不前进"
"swsh-lan-raid-join:--send-snapshot" = "一个 3456 字节的交换快照，在主机发送自己的快照后通过 0x84 发回；实时模式（--preset trade 下的默认）则发回本次会话中主机自己的快照。2965 字节的短负载会先解压。身份信息由 --snapshot-name/-tid/-sid 重写"
"swsh-lan-raid-join:--snapshot-port" = "我们发送 0x84 消息所用的 Pia 端口；主机在端口 0 上发送"
"swsh-lan-raid-join:--snapshot-period" = "在我们自己的分片之间"
"swsh-lan-raid-join:--snapshot-repeat" = "在整包重发之间；控制台会重传自己的消息直到被确认"
"swsh-lan-raid-join:--sync-answers" = "用 `pokeldn.swsh.trade.SYNC_ANSWERS` 应答，而不是回显单个载荷：ping，以及预计控制台在交换快照之后会发出的另外三个同步持有者。没有规则匹配的载荷会被报告并保持不应答 —— 该报告正是这次运行的意义"
"swsh-lan-raid-join:--send-mirror" = "回送主机在此协议上最后说的内容，而不是固定的 --send-data。--send-data 仍是第一个载荷，此时主机还没有说过任何话"
"swsh-lan-raid-join:--send-count" = "总共要发送多少个我们的序列 id；0 表示不限。一条消息承载不了实机的状态；它在 180 s 内大约发送 580 次自己的心跳"
"swsh-lan-raid-join:--send-period" = "重传间隔。窗口会一直重传，直到被确认"
"swsh-lan-raid-join:--send-seconds" = "无人确认时持续重传多久；0 表示一直发送到本次运行结束"
"swsh-lan-raid-join:--raid-join" = "极巨团体战巢穴的客人：发出快照后再发送 PlayerInfo、BattleReady 和 SelectPokemon（即 --offer-slot 指定的宝可梦）；配合 --scene 60006 使用"
"swsh-lan-raid-join:--lair-join" = "极巨大冒险（极巨巢穴）的客人：大厅、路线和对战；配合 --scene 50000 使用"
"swsh-lan-raid-join:--lair-rental" = "作为我们的租用宝可梦发送的加密队伍 PK8，用来替代原本提供的那个"
"swsh-lan-raid-join:--lair-rental-choice" = "我们占用的提供位置；默认是主机留下的第一个"
"swsh-lan-raid-join:--raid-ready" = "主机确认大厅消息之后这么多秒按下准备"
"swsh-lan-raid-join:--raid-move" = "我们的宝可梦每回合使用的招式槽位"
"swsh-lan-raid-join:--raid-name" = "团体战大厅为我们显示的名字"
"swsh-lan-raid-join:--hold-after-trade" = "在队列中最后一次交换完成后等待指定秒数，再离开座位；默认会一直占用座位，直到主机离开或达到时间限制"
"swsh-lan-raid-join:--grace" = "超过 --hold 之后，仍保留交换进行中的会话的秒数：主机已发出 offer 而阶梯尚未走完"
"swsh-lan-lair-host:--keys" = "Switch 的 prod.keys；默认取自 config/host.toml 或 host.local.toml 的 keys_path"
"swsh-lan-lair-host:--phy" = "Linux Wi-Fi 网卡的 phy（phyN），或使用 auto；若要改用开发板，请通过 POKELDN_RADIO 指定"
"swsh-lan-lair-host:--capture" = "将每个数据报写入指定文件，每条各占一行 JSON"
"swsh-lan-lair-host:--ip-host" = "在局域网通过 ldn_mitm 为模拟器建立会话；无需无线设备，也无需 root 权限"
"swsh-lan-lair-host:--our-ip" = "配合 --ip-host 或 --lan 使用时，要公布的地址；使用 --lan 且未指定时，会采用主机搜索所在子网上的本机地址"
"swsh-lan-lair-host:--lan" = "通过此 IP 网络，为处于《剑》LAN 模式的主机建立会话（docs/swsh_session.md，LAN mode）；无需无线设备、root 权限和密钥"
"swsh-lan-lair-host:--lan-max-players" = "--lan：会话信息中声明的最大玩家人数"
"swsh-lan-lair-host:--lan-broadcast" = "--lan：主机质询时使用的子网广播地址"
"swsh-lan-lair-host:--lan-console-ip" = "从回环地址使用 --lan 时，这台电脑上的主机所认为的自身地址；默认为这台电脑自身的地址"
"swsh-lan-lair-host:--advert" = "可选的 Sword 宣告（十六进制、原始或 swsh_net_facts.json）；没有的话就新建一条站点记录"
"swsh-lan-lair-host:--snapshot" = "可选的已保存 Sword 0x84 快照；否则使用本会话中加入的实机的快照"
"swsh-lan-lair-host:--offer-slot" = "我们提供的队伍槽位"
"swsh-lan-lair-host:--offer-file" = "放入指定同行位置的 PK8，可为加密文件或 PKHeX 导出文件。可重复指定，每次交换使用一条；玩家可从盒子再次交换或重新搜索，之后的交换会持续使用最后一条"
"swsh-lan-lair-host:--fresh-pid" = "为被提议的宝可梦抽取新的加密常数和 PID"
"swsh-lan-lair-host:--card-set" = "设置主机可能在交换后保留的联盟卡字段（pokeldn.swsh.league_card：name、trainer_id、dex_owned、poke1_species、...）"
"swsh-lan-lair-host:--end-delay" = "配合 --migrate：阶梯执行到箱子命令 3，并完成迁移"
"swsh-lan-lair-host:--migrate" = "以盒命令 3 和 MIGRATION_START 结束，就像带领我们加入者的零售版 Sword 所做的那样；默认主机保留会话"
"swsh-lan-lair-host:--accept-first" = "像玩家那样，不等加入方接受就直接接受；用于我们自己的加入方，它会等搭档先接受"
"swsh-lan-lair-host:--lead" = "仅供 bin/swsh_connect.py 测试：扮演主机上的玩家：在一次交换后还有另一个排队的 --offer-file 时，在阶梯之后这么多秒从 box 中发出 offer，而不等待加入方的 offer"
"swsh-lan-lair-host:--save-shown" = "将主机在交换画面上显示的每只宝可梦写入此文件夹，无论交换是否完成"
"swsh-lan-lair-host:--received" = "把加入方的宝可梦写入此处；N > 1 的交换会写入 FILE-N"
"swsh-lan-lair-host:--code" = "玩家搜索所用的连接密码，例如 12345678；默认无"
"swsh-lan-lair-host:--network-id" = "广播的值（十六进制，如 0x00）；搜索中的《剑》只会加入比自己的值更大的网络；默认为 0xFFFF 加两个随机字节"
"swsh-lan-lair-host:--hold-after-trade" = "在队列中最后一次交换完成后等待指定秒数，再关闭会话；默认会保持会话，直到主机离开或达到时间限制"
"swsh-lan-lair-host:--raid-boss" = "开设一个以该首领为对手的极巨团体战巢穴大厅，而不是连接交换（docs/swsh_raid.md）"
"swsh-lan-lair-host:--raid-reward" = "一行奖励，包含道具 ID 和数量；最多 15 行；不指定时使用模拟巢穴的奖励行"
"swsh-lan-lair-host:--raid-seed" = "BattleSeed 值；默认随机"
"swsh-lan-lair-host:--raid-ready" = "客人的大厅打开之后这么多秒，我们的玩家准备"
"swsh-lan-lair-host:--raid-event" = "开设一场极巨团体战，首领取自这个旷野地带活动配信（EventsGallery 的 'Index NNN' 文件夹），而不是 --raid-boss；奖励也取自它，除非指定 --raid-reward（docs/swsh_raid.md，Event raids）"
"swsh-lan-lair-host:--raid-stars" = "配合 --raid-event：星级，1 到 5"
"swsh-lan-lair-host:--raid-event-boss" = "配合 --raid-event：头目，按不带此选项时打印的列表编号"
"swsh-lan-lair-host:--raid-version" = "配合 --raid-event：头目来自哪个版本的表；默认为广告所用的版本"
"swsh-lan-lair-host:--raid-area" = "配合 --raid-event：头目所来自的巢穴区域表"
"swsh-lan-lair-host:--raid-event-drops" = "配合 --raid-event：像巢穴那样为每个掉落物判定一次概率，或给予全部掉落物"
"swsh-lan-lair-host:--raid-gigantamax" = "--raid-boss 所指头目为超极巨化；零售主机会在基础巢穴容纳该超极巨化宝可梦的位置接受它（docs/swsh_raid.md）"
"swsh-lan-lair-host:--raid-boss-as-is" = "直接使用 --raid-boss 文件原有的等级、个体值、性格、体型与 PID，不按巢穴种子生成；主机捕捉到的宝可梦将无法通过 PKHeX 的极巨团体战检查（docs/swsh_raid.md，A boss a catch keeps legal）"
"swsh-lan-lair-host:--raid-console-serves" = "把实机排在 BattleStart 和框架对象 0 的第一位，让它来主持战斗，而面板以客户端身份应答（docs/swsh_raid.md）"
"swsh-lan-lair-host:--lair-legendary" = "开设一个极巨大冒险（Max Lair）大厅，其传说的宝可梦为该物种；冒险一开始主机就离开（docs/swsh_raid.md）"
"swsh-lan-lair-host:--lair-scene" = "大厅的 LDN 场景 ID；默认扫描并使用主机自身大厅的场景 ID，找不到时使用 50000（docs/swsh_raid.md）"
"swsh-lan-lair-host:--lair-seed" = "冒险种子（ChikaBattleSeed）：租借宝可梦与遭遇；默认随机"
"swsh-lan-lair-host:--lair-leave" = "在传说宝可梦发出之后这么久离开；电脑搭档随后会占我们的座位并挑选我们的租借宝可梦"
"swsh-lan-lair-host:--online" = "与远方的玩家交换：对方主机的提供会在这里给出，双方都只在两台主机都确认后才确认（docs/online.md）"
"swsh-lan-lair-host:--online-code" = "双方玩家进入的房间；默认为连接密码，而没有密码就无法遇到其他在线交换的玩家"
"swsh-lan-lair-host:--trade-back" = "每次交换后再次交换，将主机刚送出的宝可梦换回，让需要通信进化的宝可梦在主机上进化；玩家需将本程序送出的宝可梦换回（docs/architecture.md，Trade back）"
"swsh-lan-lair-join:--preset" = "已测试的标志集：“capture” 记录主机的队伍快照，“trade” 需要 --send-snapshot，“raid” 为极巨团体战巢穴访客，“lair” 为极巨大冒险访客"
"swsh-lan-lair-join:--comm-id" = "十六进制；默认为 Sword 的 0x0100abf008968000"
"swsh-lan-lair-join:--keys" = "Switch 的 prod.keys；默认取自 config/host.toml 或 host.local.toml 的 keys_path"
"swsh-lan-lair-join:--phy" = "Linux Wi-Fi 网卡的 phy（phyN），或使用 auto；若要改用开发板，请通过 POKELDN_RADIO 指定"
"swsh-lan-lair-join:--capture" = "将每个数据报写入指定文件，每条各占一行 JSON"
"swsh-lan-lair-join:--ip-join" = "加入局域网中通过 ldn_mitm 托管的模拟实机；无需射频、无需 root、无需密钥。--scans 的每一次都会等待 --dwell 秒以获得一个应答"
"swsh-lan-lair-join:--host-ip" = "--ip-join：主机的地址"
"swsh-lan-lair-join:--our-ip" = "--ip-join：我们在该局域网中的地址"
"swsh-lan-lair-join:--scan-ip" = "--ip-join：扫描发出时使用的地址；默认 --our-ip"
"swsh-lan-lair-join:--lan" = "通过 IP 网络加入处于《剑》LAN 模式的主机：可填入主机地址、子网广播地址，或使用 auto 搜索所有本机 /24 子网（docs/swsh_session.md，LAN mode）；无需无线设备或密钥"
"swsh-lan-lair-join:--lan-port" = "--lan：本站点的端口"
"swsh-lan-lair-join:--lan-broadcast" = "--lan：主机的广播地址；默认为 --lan 所在 /24 子网的广播地址"
"swsh-lan-lair-join:--lan-max-players" = "--lan：搜索会话时指定的最大玩家人数；极巨团体战或极巨大冒险默认为 4，交换默认为 2"
"swsh-lan-lair-join:--lan-host-wait" = "--lan：在站点握手前重复发送主机请求的秒数"
"swsh-lan-lair-join:--lan-quiet" = "--lan：连续未收到主机数据多少秒后，判定主机已离开"
"swsh-lan-lair-join:--ifname" = "Linux：站点接口"
"swsh-lan-lair-join:--scans" = "在放弃之前扫描匹配的搜索（--scene）"
"swsh-lan-lair-join:--scene" = "要加入的 LDN 场景 id：60001 为连接交换搜索；any 取第一个剑版网络（极巨团体战巢穴，docs/swsh_gift.md）"
"swsh-lan-lair-join:--listen-first" = "发出第一个包之前先监听的秒数，这样抓包中就有主机自身的速率可供对照"
"swsh-lan-lair-join:--station-sweep" = "0x05 处头字节的读数，按顺序；每个读数后面跟着 IV 的来源 id"
"swsh-lan-lair-join:--ack-seconds" = "每个读数"
"swsh-lan-lair-join:--quiet-for" = "没有 update 会话达到多少秒就算重广播停止 - 主机每秒发送十条，所以这里是漏掉十五条"
"swsh-lan-lair-join:--seq-delta" = "对照组。对主机从未发送过的序列号回 ACK：若在 --seq-delta 1 下重播照旧继续，就说明 0 下的停止归因于 ACK 的内容，而不是仅仅因为我们发送过 ACK"
"swsh-lan-lair-join:--connect" = "收到 ack 后，在协议 0x14 上扫描版本 4 的连接请求"
"swsh-lan-lair-join:--nat-flags" = "字节 [1] 的取值，列表或 LO-HI"
"swsh-lan-lair-join:--nat-location" = "字节 [0x10] 的取值"
"swsh-lan-lair-join:--request-gap" = "请求之间的秒数；主机在 40 ms 内应答了 BDSP 的请求"
"swsh-lan-lair-join:--connect-station" = "请求中 0x05 处头部字节及其 IV 源 id 的取值；列表或 LO-HI"
"swsh-lan-lair-join:--respond" = "用连接响应应答控制台发给我们的连接请求"
"swsh-lan-lair-join:--respond-result" = "0 也可接受"
"swsh-lan-lair-join:--respond-with" = "响应中两个 id 字段分别放入谁的常量 id 和变量 id——这是推断，因此 “both” 会在多次重传中交替使用两者"
"swsh-lan-lair-join:--request-platform" = "[2] 处平台字节的取值。9 是真实值；任何其他值都会得到连接响应而不是被丢弃，这可用于探测我们的消息是否真的到达 0x14 处理程序"
"swsh-lan-lair-join:--request-flags" = "MESSAGE 标志字节的取值。0x09 是主机在自己的 Local Protocol 消息上使用的值；BDSP 的站点请求携带 0x11"
"swsh-lan-lair-join:--request-unicast" = "把请求发送给主机而不是广播地址"
"swsh-lan-lair-join:--request-broadcast" = "改为把它们发送到广播地址"
"swsh-lan-lair-join:--src-var" = "我们自己的站点变量 id；省略时为新的随机值，因为在 BDSP 上复用一个会被当成“already one of my stations”"
"swsh-lan-lair-join:--no-variable-id" = "清除 [3]，这会让控制台跳过变量 id 比较"
"swsh-lan-lair-join:--unicast" = "发送给主机而不是广播地址"
"swsh-lan-lair-join:--join" = "站点握手关闭后，发送 Mesh Protocol（0x18）加入请求，并对返回的任何内容回 ack"
"swsh-lan-lair-join:--join-wait" = "等待站点接受多久后放弃加入"
"swsh-lan-lair-join:--join-seconds" = "重传加入请求多久；Pia 自带的加入端到 10 就放弃"
"swsh-lan-lair-join:--join-gap" = "Pia 每 500 毫秒重传一次未确认的加入请求"
"swsh-lan-lair-join:--join-port" = "加入流程所使用的 Pia 端口；更新网格使用可靠端口"
"swsh-lan-lair-join:--join-station-index" = "字节 [1]。0xFD 是 0x017c1700 比较所针对的值；其他任何值都是说明已进入处理程序的标志"
"swsh-lan-lair-join:--join-ack-id" = "加入请求的固定确认 id；省略时随机"
"swsh-lan-lair-join:--answer-rtt" = "应答控制台的 0x58 RTT 请求。版本 4 下为十六字节，回复会回显那七个尚未被读取的字节"
"swsh-lan-lair-join:--ack-reliable" = "确认 0x7C 可靠窗口。通过的信号是重传停止，并且序列号继续前进"
"swsh-lan-lair-join:--ack-slots" = "填充 32 个 ack 槽位中的哪些；“all”（默认）会全部填充，因为只会读取某个站点索引处的槽位，而具体是哪个索引尚未确定。“0” 是主机，“1” 是我们"
"swsh-lan-lair-join:--ack-lowest-pending" = "头部自身的“待确认的最低序列号”。我们在该协议上尚未发送任何内容，因此 1（我们将要使用的下一个 id）和 0 都说得通；主机自身在等待自己的第一条消息时发送 1"
"swsh-lan-lair-join:--data-destination" = "0x58 和 0x7C 上的站点 BITMAP。主机向我们发送 2，即站点索引 1；1 是站点 0（也就是主机）的位"
"swsh-lan-lair-join:--send-data" = "mesh 建立后发送 APPLICATION DATA - 本项目的第一次。载荷以十六进制给出；\"610000000a00\" 就是主机在 0x7C 上反复发给我们的六个字节。没有这个标志就什么也不发送"
"swsh-lan-lair-join:--send-protocol" = "0x80（广播可靠窗口，默认值：它每秒向我们请求一次序列 1）或 0x7c（单播窗口，它从未有 ack 可发给我们，因为它从未收到过我们的数据）"
"swsh-lan-lair-join:--send-sequence" = "序列 id。两个窗口都要求 1；第一条消息还会携带 FLAG_IS_INITIALIZED，并定义流的起始位置"
"swsh-lan-lair-join:--send-stream" = "流 id。0 是主机在两个协议上发送的值"
"swsh-lan-lair-join:--send-destinations" = "头部的目标列表。“console” 指定其站点常量 id，即它自己的广播 ack 对我们的做法；“none” 发送计数 0，0x01859578 从不过滤该值，且每条 0x7C 消息都会携带它。“auto” 按协议镜像主机：0x7C 上为 none，0x80 上为 console"
"swsh-lan-lair-join:--send-zlib" = "压缩消息，就像控制台压缩它发送的每条 0x80 消息那样。该标志属于 Pia 消息（版本 4 下为 0x10），所以怎么选都没有代价 —— 而且它只是一个变量，所以单独扫它"
"swsh-lan-lair-join:--send-port" = "Pia 消息端口。主机在 0 和 1 上发送它的 0x80 ack，每个数据包同时携带两者；“0,1” 即是照此模拟"
"swsh-lan-lair-join:--send-wait" = "等待站点握手多久后放弃发送"
"swsh-lan-lair-join:--send-after" = "接受之后多少秒才发第一条数据消息，这样它到达时 mesh 加入与 RTT 交换已经在进行"
"swsh-lan-lair-join:--send2-data" = "经由 --send2-protocol 的第二条流，在主机发出 --send2-trigger 后发送。`60ea000012020801` 是 BlockDataHolder{imReady:true}，主机在 0x80 上发出它并等待它"
"swsh-lan-lair-join:--send2-trigger" = "发送前先在 --send2-protocol 上等待该负载；省略则在网格一建立就发送"
"swsh-lan-lair-join:--trade-ready" = "我们的提供被确认后，在 TRADE holder（20030）上发送 imReady。主机从未发送过这些字节，而已发布的客户端会在提供之前等待它们，所以也许轮到我们来说"
"swsh-lan-lair-join:--rpc-port-answers" = "在交换 RPC 自己的 Pia 端口上、用它自己的可靠窗口来应答。控制台在 0x7C 端口 1 上发送它们；在端口 0 上应答会落在它不读取它们的窗口上"
"swsh-lan-lair-join:--answer-migration" = "用 MIGRATION_RESPONSE 应答控制台在 0x18 端口 1 上的 MIGRATION_START。只有玩家接受时 `440001` 才会到达那里，而之后控制台会在所有窗口上静默：它最后请求的是两字节的 mesh，而不是应用数据"
"swsh-lan-lair-join:--leave-with-host" = "当主持主机离开时，对其携带主机迁移状态的更新会话进行 ack，并在其 START_HOST_MIGRATION 时离开网络，如同它自己的客户端所做；每一步在无应答时等待 10 秒"
"swsh-lan-lair-join:--migration-answer" = "主机迁移网格时发送的内容。“auto” 在开始消息指定我们为下一个主机时发送 MIGRATION_FINISH，指定其他任何对象时发送 MIGRATION_RESPONSE，这与二进制中的行为一致。“response” 则始终应答 0x48，用于对比"
"swsh-lan-lair-join:--open-content" = "我们的提供被确认后，对每个 N 在 content N 的 10000 基址 holder 上发送 `ping`，例如 40 对应 `382700000a00`；这正是 nxldn-lab 的客户端用来开始确认阶段的开场消息，此处根据我们自己的 content 注册表重建，而不是照抄"
"swsh-lan-lair-join:--confirm-command" = "当 CONFIRMATION 信封（40040）发送主体以 `0100` 结尾的四字节状态时——这与选择内容在其宝可梦之前发送的提示相同——在该内容以 10000 为基的 holder 上、id 10040、可靠端口 0 回复 SyncSaveDataHolder{syncCommand{data:N}}，并在端口 1 上应答状态本身。内容 40 接受的是命令而不是宝可梦：其解析器 0x010df6d0 接受一条携带一个 int32 的子消息。它自身的机器按该顺序发送 0、1、2 和 3（swsh_trade.SYNC_COMMANDS）"
"swsh-lan-lair-join:--confirm-phase" = "用低 u16 中的阶段 N 来应答确认内容的四字节步骤，而不是回显控制台自己的值。控制台正是从这些字节读出其阶段（`0x006d6490` 存储它们，`0x006d3260` 读取它们），而本项目迄今发送的每个步骤都是把该值原样回显"
"swsh-lan-lair-join:--ladder-refresh" = "确认阶梯等待主机回应期间，每隔 SECONDS 秒重新发送我们这对 40040 消息，并将其时钟推进到当前时间。0 表示关闭"
"swsh-lan-lair-join:--abort-on-stall" = "一旦确认阶梯产生了它的第一个步骤，就在 SECONDS 过去而没有新的步骤体之后立即结束本次运行：停止发送、断开连接，让实机报告连接丢失。用确认把停滞的阶梯维持住，反而会让游戏宣布交换失败，这会让玩家损失大约一小时。最后一个步骤体之后除了确认没有别的内容。0 表示关闭，此时会完整地保持等待。"
"swsh-lan-lair-join:--confirm-commands" = "--confirm-command 的握手形式：每当确认内容在 elementId 20000 上放入新的四字节主体时，依次发送这些值中的下一个。内容 40 自身的机器发送 0,1,2,3，并在每步之后停留；一条命令可推进两级，之后阶梯便停止"
"swsh-lan-lair-join:--confirm-final-delta" = "CONFIRMATION content 用哈希应答我们的 syncCommand 后，重新装载 40040 这一对，并以该时钟增量再次发送两个成员，这正是 --selection-final-delta 在 40050 上所做的动作，可让选择阶段越过它自己的哈希"
"swsh-lan-lair-join:--selection-final-delta" = "选择 HASH 被应答后，以该时钟增量再次发送 40050 对的两个成员。nxldn-lab 的 `selection_final_delta` 为 9（nxldn-lab 的 `selection_final_delta`）。--rpc-pair 按封套锁存，因此第二对需要先清除锁存。0 表示关闭"
"swsh-lan-lair-join:--open-content-offer" = "让 --open-content 在 10000 基址的 holder 上发送我们的 PK8，而不是空的 `ping`。ping 会打开 content 50 并被当作我们的宝可梦：实机因此进入确认阶段，并要求玩家用他们的宝可梦换一颗蛋。同一时刻、同一 holder，里面放一只宝可梦"
"swsh-lan-lair-join:--box-on-accept" = "MIGRATION_START 一到就发送这些 box 命令 - 这是唯一表示玩家按下接受的信号。主机在此之后还会持续确认约五秒"
"swsh-lan-lair-join:--box-period" = "排队的 offer 后载荷之间的秒数。把它们拉开，让轮扫覆盖到接受：主机是在接受时才拆除，而不是靠计时器，因此几秒内发出的命令都会在拆除前到达"
"swsh-lan-lair-join:--selection-offer" = "当主机在选择阶段宝可梦之后跟随主体以 `0100` 结尾的状态时，在该内容以 10000 为基的 holder（id 10050）上、可靠端口 0 提供我们的宝可梦，并在端口 1 上应答该状态"
"swsh-lan-lair-join:--pair-after-hash" = "hash 体应答之后，发送针对它的双成员 RPC 对来打开 content N 的阶段（40 是确认）。在这台实机上，只有成对的形式才能打开一个阶段：40030 打开了提供，40050 打开了选择。单纯的内容 ping（`382700000a00`）和单纯的 sync-120 ping（`780000000a00`）都会被忽略"
"swsh-lan-lair-join:--sync-after-offer" = "把 holder N 上的 sync 紧跟在我们的选择提供之后排队，放在 --selection-offer 打开时真正执行的那条分支里。--sync-after-hash 在那里无法触发：这个可以"
"swsh-lan-lair-join:--sync-field" = "--sync-after-hash 发送哪个 SyncPingDataHolder 字段：1 ping、2 pingReply、3 pingSynced（`780000001a00`，即跟踪记录中的那个）"
"swsh-lan-lair-join:--sync-after-hash" = "hash 体应答之后，在端口 0 上对 sync holder N 发送 `ping`（120 是确认用的那个）。实机会自己驱动 97、60000、110 和 130，并在 130 的 pingSynced 到达时打开选择阶段；它从不发送 120。阶段跟随的是它的 sync，而不是内容 ping"
"swsh-lan-lair-join:--open-after-hash" = "hash 体应答之后，在端口 0 上对 content N 的 10000 基址 holder 执行 `ping` 以打开下一阶段——40 就是确认，因此这会发送 `382700000a00`。hash 应答到达后，实机就停止发送 40050 且不再多说什么；Pia 会重传它仍在等待的一切，所以这种静默意味着已满足，下一阶段需要主动打开"
"swsh-lan-lair-join:--rpc-bodies" = "对 40000 频段内每个不同的 (envelope, base, field-5 body) 只应答一次，此外还覆盖开局的那一对。每条消息的时钟都会前进，所以载荷不能当作键，但消息体可以：`00000000` 和 `000018fc` 是开局消息，其他任何值都是新的。按 envelope 设置的守卫会在哈希体处停止应答并卡在那里"
"swsh-lan-lair-join:--rpc-pair" = "把控制台的 40030 RPC 当作它本来的一对来应答：每个 base 收集一个成员，先 10000 后 20000，以 BASE 字段为键。`payload[5] in (0x19, 0x1A)` 是内层长度，并随发送方的 station-id varint 变化（某些控制台上是 0x1A/0x1B）。按该顺序各发送一次，此窗口内不再发送其他内容；`said_by_port` 只保留最后一个载荷，所以镜像会反复发送其中一个成员，永远不发另一个"
"swsh-lan-lair-join:--open-early" = "在 0x84 快照 ack 时、双方都尚未发起提供之前，对 content N 的 10000 基址 holder 执行 `ping`。主机的盒子发送受 content+0x4c 处的一个 ready 布尔值控制，只有 `0x010ce040` 在结果码为 0 时会设置它；在此之前，游戏尝试发送的每条命令都停在 content+0x48。停下的命令若与下一条不匹配，就会置位错误字节 +0x4d，而 `0x010c9bb0` 会把它变成交换状态 9：中止，应用层上没有任何提示"
"swsh-lan-lair-join:--box-open" = "主机一确认我们的 0x84 快照就发送这些 box 命令 - 早于任一方提供宝可梦。游戏只在交换会话建立后的第一帧、且 session+0x419 处的角色位为 clear（0x010c9bb0）时发送一次命令 3，因此两方中总有一方要在其他事情发生前先给开场。若改为在双方都 offer 之后才发送，主机会在玩家还在挑选时就离开"
"swsh-lan-lair-join:--box-commands" = "我们的提供被确认后，依次对每个 N 在 trade holder 上发送 boxSyncStateCommand{data:N}，每个已确认的序列发一条。20030 是 BoxSyncStateDataHolder，其字段 2 是命令枚举；本项目 1 表示提供、2 表示撤回；4 表示确认、5 表示撤回确认"
"swsh-lan-lair-join:--snapshot-account" = "替换快照 profile 开头的三个 id（伪设备 id、账号 Uid、网络服务账号 id）。它们属于实机自身，否则会原样交回"
"swsh-lan-lair-join:--selection-offer-data" = "配合 --selection-offer：在 RPC 端口上用携带我们 ownerId 的 40050 Data 的第 5 个字段（`body`）放入我们的 PK8 来应答主机的选择状态，而不是在 10050 端口 0 上用 PokemonTradeDataHolder。Content 50 的接收处理程序会把发送方解析为站点索引，无法解析时静默丢弃；holder 形式不携带 owner"
"swsh-lan-lair-join:--selection-offer-sweep" = "把我们的 PK8 作为 elementId 10000 上的 Data 发送，并作为 30000 基址 id（30050）上的 holder 发送，每个 content 都会注册它。可同时指定多个变量"
"swsh-lan-lair-join:--selection-offer-high" = "配合 --selection-offer：把我们的 PK8 作为 PokemonTradeDataHolder 放在基于 20000 的 holder（id 20050）上来应答选择状态，箱子阶段自己的宝可梦正是在它之上多一个 content 传输的。覆盖 --selection-offer-mirror 和 --selection-offer-data"
"swsh-lan-lair-join:--selection-offer-mirror" = "配合 --selection-offer：把我们的 PK8 放进携带主机自身字段集的 40050 来应答选择状态 - 即 syncId、clock、body，且不含 elementId 和 ownerId，这正是它自己的选择提议被解码的方式。覆盖 --selection-offer-data"
"swsh-lan-lair-join:--offer-echo" = "原样回送实机刚提供给我们的那个 PK8，而不是从 --send-snapshot 里取一个。这些字节来自它自己的存档，所以如果运行仍然中止，就可以排除这条记录"
"swsh-lan-lair-join:--offer-on-50" = "把我们的 PK8 放进 40050 对中第二个成员的字段 5。content 50 是 PokemonTradeDataHolder，即传输；content 30 是盒子交换。一个 344 字节的 PK8 就装在该字段里"
"swsh-lan-lair-join:--send-selection" = "何时在 0x7c 端口 1 上用一对 40050 开始选择阶段。“offer”在我们的提供被确认后立即发送，这是主机仍在读取的唯一窗口；“migration”在迁移开始时发送，此时主机已经停止。这一对消息与主机自己的 40030 是同一个封套，位于偏移 50，并带我们的站点 id；构建器会逐字节复现它的 40030 对"
"swsh-lan-lair-join:--update-mesh" = "一旦迁移使我们成为主机，就像实机那样广播 UPDATE_MESH：用它最后发出的那条，并把主机索引设为我们的。实机在移交角色后就停止发送这些消息，如果没有任何一方接手，mesh 大约 1.3 s 后就会消失"
"swsh-lan-lair-join:--update-mesh-period" = "多久广播一次；实机大约每 2 s 发送一次"
"swsh-lan-lair-join:--migration-period" = "每隔多久重传迁移响应，直到被确认"
"swsh-lan-lair-join:--answer-once" = "对控制台发送的每个载荷只应答一次，而不是每个周期都为其上一个载荷重新推导答案。`said` 从不清空，所以没有这个选项时，一个提议会发出数百次。控制台自己的每条消息只发送一次"
"swsh-lan-lair-join:--offer-slot" = "回赠 --send-snapshot 的哪个队伍槽位，1-6；0 表示不提供任何内容，只记录主机提供给我们的内容"
"swsh-lan-lair-join:--offer-file" = "用于 --offer-slot 并取代快照记录的 .pk8，可以是盒子或同行格式、加密文件或 PKHeX 解密导出文件。除非指定 --offer-file-as-is，否则会使用快照的初训家名称与 ID。可重复指定，会话中每次交换一条：主机的玩家会从盒子里重新选择；之后的所有交换都使用最后一条"
"swsh-lan-lair-join:--trade-back" = "每次交换后再次交换，将主机刚送出的宝可梦换回，让需要通信进化的宝可梦在主机上进化；玩家需将本程序送出的宝可梦换回（docs/architecture.md，Trade back）"
"swsh-lan-lair-join:--fresh-pid" = "为每只被提议的宝可梦抽取新的加密常数和 PID"
"swsh-lan-lair-join:--offer-file-as-is" = "保留文件自带的初训家名和训练家 id"
"swsh-lan-lair-join:--offer-species" = "在 --offer-slot 中构建记录，而不是原样发送：使用这个全国图鉴编号，在快照公布的队伍记录中以及提议中都是如此，好让两者仍然讲同一个故事"
"swsh-lan-lair-join:--offer-ability" = "所构建记录的特性 id；--offer-species 会保留模板原来的特性"
"swsh-lan-lair-join:--offer-level" = "所构建记录 0x148 处的等级字节，1..100；除非给出 --offer-experience，否则经验值字保持不变"
"swsh-lan-lair-join:--offer-experience" = "所构建记录 0x10 处的经验值字"
"swsh-lan-lair-join:--offer-moves" = "四个招式 id，以逗号分隔；0 表示清空该槽位。PP 保持模板中原有的值"
"swsh-lan-lair-join:--offer-nickname" = "所构建记录的昵称；会设置已起昵称标志"
"swsh-lan-lair-join:--offer-ot" = "所构建记录的初训家名"
"swsh-lan-lair-join:--offer-ivs" = "六项个体值，逗号分隔，按 PKHeX 的 HP,ATK,DEF,SPE,SPA,SPD 顺序"
"swsh-lan-lair-join:--save-offer" = "在触碰射频之前，把我们将要提供的 PK8 写入此文件"
"swsh-lan-lair-join:--save-shown" = "将主机在交换画面上显示的每只宝可梦写入此文件夹，无论交换是否完成"
"swsh-lan-lair-join:--save-offered" = "交换完成后，将主机换出的 PK8 写入此文件；第 N 次交换（N > 1）写入 FILE-N"
"swsh-lan-lair-join:--rpc-clock-delta" = "我们在应答中把交换 RPC 的时钟推进多远。5 是 nxldn-lab 的值，也是这条路径上此处唯一没有实测过的数字"
"swsh-lan-lair-join:--rpc-pair-advance" = "应答一组 RPC 对之后，把时钟推进这么多再重新发送两个成员。主机会在每次突发时把自己那一对的时钟推进 2（b41c、b61c、b81c）。时钟重复就意味着状态重复，因此只带一个时钟的应答永远不会推动我们的时钟。0 表示关闭"
"swsh-lan-lair-join:--selection-start" = "主机一报告 id 130 pingSynced 就发送我们自己的 40050 对，早于它自己的选择突发。nxldn-lab 的客户端就是这样开启选择阶段的，而这里的任何实现都从未开启过；在我们自己的抓包里，主机在其 40050 突发之前 0.3 s 发送 820000001a00"
"swsh-lan-lair-join:--ack-snapshot" = "对主机的 0x84 分片（类型 0x21，连续基址加位掩码）回 ACK。此前从未有实现确认过该协议，因此主机会把同一份快照重传 19142 次而始终不前进"
"swsh-lan-lair-join:--send-snapshot" = "一个 3456 字节的交换快照，在主机发送自己的快照后通过 0x84 发回；实时模式（--preset trade 下的默认）则发回本次会话中主机自己的快照。2965 字节的短负载会先解压。身份信息由 --snapshot-name/-tid/-sid 重写"
"swsh-lan-lair-join:--snapshot-port" = "我们发送 0x84 消息所用的 Pia 端口；主机在端口 0 上发送"
"swsh-lan-lair-join:--snapshot-period" = "在我们自己的分片之间"
"swsh-lan-lair-join:--snapshot-repeat" = "在整包重发之间；控制台会重传自己的消息直到被确认"
"swsh-lan-lair-join:--sync-answers" = "用 `pokeldn.swsh.trade.SYNC_ANSWERS` 应答，而不是回显单个载荷：ping，以及预计控制台在交换快照之后会发出的另外三个同步持有者。没有规则匹配的载荷会被报告并保持不应答 —— 该报告正是这次运行的意义"
"swsh-lan-lair-join:--send-mirror" = "回送主机在此协议上最后说的内容，而不是固定的 --send-data。--send-data 仍是第一个载荷，此时主机还没有说过任何话"
"swsh-lan-lair-join:--send-count" = "总共要发送多少个我们的序列 id；0 表示不限。一条消息承载不了实机的状态；它在 180 s 内大约发送 580 次自己的心跳"
"swsh-lan-lair-join:--send-period" = "重传间隔。窗口会一直重传，直到被确认"
"swsh-lan-lair-join:--send-seconds" = "无人确认时持续重传多久；0 表示一直发送到本次运行结束"
"swsh-lan-lair-join:--raid-join" = "极巨团体战巢穴的客人：发出快照后再发送 PlayerInfo、BattleReady 和 SelectPokemon（即 --offer-slot 指定的宝可梦）；配合 --scene 60006 使用"
"swsh-lan-lair-join:--lair-join" = "极巨大冒险（极巨巢穴）的客人：大厅、路线和对战；配合 --scene 50000 使用"
"swsh-lan-lair-join:--lair-rental" = "作为我们的租用宝可梦发送的加密队伍 PK8，用来替代原本提供的那个"
"swsh-lan-lair-join:--lair-rental-choice" = "我们占用的提供位置；默认是主机留下的第一个"
"swsh-lan-lair-join:--raid-ready" = "主机确认大厅消息之后这么多秒按下准备"
"swsh-lan-lair-join:--raid-move" = "我们的宝可梦每回合使用的招式槽位"
"swsh-lan-lair-join:--raid-name" = "团体战大厅为我们显示的名字"
"swsh-lan-lair-join:--hold-after-trade" = "在队列中最后一次交换完成后等待指定秒数，再离开座位；默认会一直占用座位，直到主机离开或达到时间限制"
"swsh-lan-lair-join:--grace" = "超过 --hold 之后，仍保留交换进行中的会话的秒数：主机已发出 offer 而阶梯尚未走完"
