"rse-trade-host:--no-native-nonce-sequence" = "使用火红版会话级递增的 Pia nonce"
"rse-trade-host:--no-session-response-first" = "在 type 5 广播之前先单播 Session type 2"
"rse-trade-host:--tick-hz" = "主机每秒发出多少个 RFU 槽位（默认 59.727，每个 GBA VBlank 一个）。真实的一对实机远低于此；调低它会让每个连接步骤按相同倍数变慢。"
"rse-trade-join:--out" = "将收到的宝可梦保存于此（trades=1）；trades>1 时，此路径作为基础或前缀，每只收到的宝可梦保存为 <stem>_trade<k>_<species>.pk3"
"rse-trade-join:--save-shown" = "将主机在交换界面上显示的每只宝可梦写入此文件夹，无论交换是否成功"
"rse-trade-join:--out-size" = "接收到的文件大小（100=队伍，80=盒子）"
"rse-trade-join:--out-format" = "接收到的宝可梦格式：pk3=已解密（可在 PKHeX 中打开），ek3=加密/原始"
"rse-trade-join:--slot" = "第一轮要提供的队伍槽位（默认 1）；每轮的默认列表从这里开始递增（整队互换时为 [0..N-1]）"
"rse-trade-join:--slots" = "显式指定要提议的队伍槽位逗号列表（从 0 开始），每次交换一个（长度必须 == --trades，互不相同，每个 < 队伍规模），例如 --slots 0,2,4"
"rse-trade-join:--trades" = "要执行的连续交换数量，1..6（默认 1；6 = 互换双方整支队伍）。第 N 次交换之后，模拟器会取消并离开。"
"rse-trade-join:--trade-back" = "每次交换后再次交换，将主机刚送出的宝可梦换回，让需要通信进化的宝可梦在主机上进化；玩家需将本程序送出的宝可梦换回（docs/architecture.md，Trade back）"
"rse-trade-join:--hold-after-trade" = "队列中最后一次交换结束后等待指定时长再离开座位；默认本次运行会一直保留座位，直到主机离开或时间限制结束"
"rse-trade-join:--self-id" = "线上 mpId / gLocalLinkPlayerId（加入方 = 1 = 右侧座位；这是唯一有效值——mpId 0 是主机/父级）[trade.c:1816; link_rfu_2.c:1633-1638]"
"rse-trade-join:--ot" = "训练家名称；默认为 DEFAULT_TRAINER"
"rse-trade-join:--version" = "游戏版本；默认为 DEFAULT_TRAINER"
"rse-trade-join:--language" = "训练家语言；默认为 DEFAULT_TRAINER"
"rse-trade-join:--id" = "十进制训练家 ID，后面可选填十进制里 ID"
"rse-trade-join:--card-flag-id" = "我们在联盟交谊厅卡片交换中，训练家卡所声明的神秘卡片标志 id。持有该 id 卡片的主机会启用自身的卡片计数器，因此与我们进行交换或线缆俱乐部对战会使其递增 [union_room.c:1777]；默认 0，不启用任何计数器"
"rse-trade-join:--anim-delay" = "START_TRADE 之后、READY_FINISH 之前等待的帧数（默认 1935，即实测的无线 DoTradeAnim 时长）"
"rse-trade-join:--decline" = "在确认提示处拒绝（confirm-NO -> 立即 READY_CANCEL，优雅地取消并离开）[trade.c:2019-2023]"
"rse-trade-join:--refuse-illegit" = "将提供的 Deoxys/Mew 视为 PARTNER_MON_INVALID 并取消退出（主机的非法传说宝可梦闸门；合法性无法离线解码）[trade.c:1965-1968]"
"rse-trade-join:--no-trust-pia" = "每块分片只发送一次（发后不管），而不是主机那种重发到确认为止的循环。默认关闭（忠实重发）：对真实客户端，一次块传输在激进重发（约 1.5 倍）下 1-2s 内完成；trust_pia 的只发一次则爬行（约 0.1 分片/秒）且从未完成。trust_pia 曾是对“洪泛”的变通做法，但那是 rtt 死锁（现已修复）。--trust-pia 会重新启用只发一次"
"rse-trade-join:--compress" = "用 zstd 压缩输出的 payload"
"rse-trade-join:--pace-ms" = "live：发往实机的两个数据报之间的最小 ms 数，把到期的合并成一个（0 = 关闭）。测量方法见 sim.PACE_MIN_GAP_MS。"
"rse-trade-join:--connect-id" = "（实时）覆盖模拟器连接（“C”）帧中发送的 RFU 连接 ID（十六进制，例如 7036）。默认：一个随机的非零 ID，任何非零值都可用。--parent-pid 是已弃用的别名。"
"rse-trade-join:--live" = "加入真实的 Switch"
