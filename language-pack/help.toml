"lgpe-join:--over-ip" = "通过普通 UDP 而不是射频联系对端：不扫描、不做 LDN 关联，Pia socket 直接打到 --host-ip:12345。用于调试器下的模拟主机。需要 --app-data、--host-mac、--our-mac"
