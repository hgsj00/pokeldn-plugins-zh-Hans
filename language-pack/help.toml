"pla-host:--net-protocol" = "发送连接请求所用的 Net 协议 id"
"pla-host:--player-name" = "LDN 节点名称；实机会在此公布其用户昵称"
"pla-host:--rtt-probe" = "同时发送一个 RTT 请求，对端会以完全不带状态的方式应答"
"pla-host:--rtt-version" = "RTT 协议版本字节"
"pla-host:--no-net-probe" = "加入后保持静默，以测量加入方在无人提示时会做什么"
"pla-host:--ip-host" = "在局域网通过 ldn_mitm 为模拟器建立会话；无需无线设备，也无需 root 权限"
