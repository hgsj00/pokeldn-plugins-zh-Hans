"rse-trade-join:--phy" = "Linux Wi-Fi 网卡的 phy（phyN），或 auto；改用开发板时由 POKELDN_RADIO 指定"
"rse-trade-join:--capture" = "（实时）将双向的每个 Pia 数据报记录到 .jsonl（含 SSID），以便离线解密实时连接"
"rse-trade-join:--comm-id" = "要加入的 LDN local_communication_id（十六进制，实时）；省略时加入唯一可用的网络（扫描会记录候选网络）"
