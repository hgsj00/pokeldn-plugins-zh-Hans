"sv-gift-host:--gift-event" = "按相同顺序指定各条 --trade-offer 所依据的神秘礼物卡片：即其在 PKHeX 配信数据库中的键（pokeldn.pokemon.Service.gift_events）"
"sv-gift-host:--for-receiver" = "交换时，对于使初训家成为领取者本人的 --gift-event 卡片，按主机存档重新生成：由主机先提供宝可梦，根据该存档捕捉到的宝可梦确定训练家；若无法确定，则使用主机会话数据中的训练家。两者都失败时，按原样提供，使用“设置”中的训练家（pokeldn.receiver_gift，docs/gift_simulated.md）"
"sv-gift-host:--trade-back" = "每次交换后再次交换，将主机刚送出的宝可梦换回，让需要通信进化的宝可梦在主机上进化；玩家需将本程序送出的宝可梦换回（docs/architecture.md，Trade back）"
"sv-gift-host:--offer-set" = "在提供记录封装前写入其中的字段，名称按 pokeldn.sv.pokemon：nickname=SHINY、species=906、level=50、ivs=31,31,31,31,31,31、pid=0x1234、trainer_id=12345、ball=4、moves=33,0,0,0。可重复指定；单独使用 shiny 时，会按该记录自身的 ID 随机生成异色 PID"
"sv-gift-host:--offer-dump" = "把所提供记录的 348 字节主体以十六进制写入此文件并退出，不需要射频"
"sv-gift-host:--offer-out" = "将主机自己提供的宝可梦写入此文件，内容为其 80 00 02 00 报文的 348 字节主体，以十六进制文本表示。其内容可由 pokeldn.sv.pokemon 读取"
"sv-gift-host:--save-shown" = "将主机在交换画面上显示的每只宝可梦写入此文件夹，不论交换是否完成"
"sv-gift-host:--send-on-open" = "DELAY:PROTO:PORT:HEX[:z][:start|:end]，在主机宣布自己的 0x80 键已在 0x7c 端口 1 上打开后指定秒数发送。在该打开之前发往端口 0 的消息会被主机确认，却永远不会到达游戏；该端口上此后的所有消息同样如此；可重复指定；默认使用 pokeldn.sv.reference 中的身份分片"
