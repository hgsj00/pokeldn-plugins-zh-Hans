"sv-raid-join:--our-ip" = "--ip-join：我们自己的地址"
"sv-raid-join:--scan-timeout" = "--ip-join：等待一次 ldn_mitm 扫描应答的秒数"
"sv-raid-join:--ifname" = "Linux：客户端接口"
"sv-raid-join:--dwell" = "扫描时每个信道的秒数；主机的开房窗口只有几秒，停留过久就会错过"
"sv-raid-join:--seconds" = "持续尝试的时间"
"sv-raid-join:--hold" = "在一次已加入的会话中停留多久后再次扫描"
"sv-raid-join:--hold-after-trade" = "排队中的最后一次交换完成后，等待这么久再离开连接位置；默认会一直保留，直到主机离开或达到时间限制"
"sv-raid-join:--name" = "我们发布的 LDN 节点名"
"sv-raid-join:--platform" = "我们发布的站点平台字节；1 是 Switch 2 发送的值"
"sv-raid-join:--mac" = "在关联前设置网卡的 MAC，例如 48:f1:eb:11:22:33。Pia 由站点的 MAC 推导其恒定 id，而两台主机的 MAC 是 Nintendo OUI，网卡的不是。启动器中的驱动重载会把网卡自身的地址恢复"
"sv-raid-join:--scene-id" = "只加入此 LDN 场景的网络：4 为连接交换，7 为太晶团体战"
"sv-raid-join:--raid-pokemon" = "加入主机开设的太晶团体战大厅，并带上这份通过 PKHeX 合法性检查的同行宝可梦记录。本程序角色会准备就绪、回应开始，并在对战开始时离开，由其宝可梦替主机继续战斗"
"sv-raid-join:--raid-ready-delay" = "在团体战大厅中、我们的玩家准备之前的秒数"
"sv-raid-join:--union-circle" = "加入实机托管的集友圈，像团体战客人加入团体战那样：占住座位、发送我们的身份、打开游戏的通道、应答主机的开始、把我们的玩家放到主机所在的位置并在 --hold 期间保持（docs/sv_union_circle.md）"
"sv-raid-join:--circle-task" = "搭配 --union-circle：完成指定任务后，本程序角色会离开集友圈并结束运行。snacksworth 会在开场演出结束后，每秒为建房玩家补上一项其缺少的团队任务或单人任务通关，以补齐解锁点心大叔全部传说宝可梦所需的通关；bp 则完成一项给予建房玩家 --bbq-clear BP 的任务"
"sv-raid-join:--bbq-clear" = "--circle-task bp 给予的 BP，范围为 1 到 9999999"
"sv-raid-join:--follow-host" = "配合 --union-circle：我们的玩家会复制主机的移动、动画和坐骑，与它保持 5 米距离并朝向它"
"sv-raid-join:--spawn" = "搭配 --union-circle：开场演出结束 10 秒后，在距建房玩家 15 到 25 米处维持 3 只该种类（开发编号）的野生宝可梦，如同主机共享自己的野生宝可梦；被主机对战、被移除或离主机超过 50 米的个体，会在附近重新生成"
"sv-raid-join:--spawn-tera" = "太晶属性，按属性顺序从 0 一般排到 17 妖精（默认 %(default)s）"
"sv-raid-join:--spawn-item" = "携带物品 id"
"sv-raid-join:--spawn-scale" = "0 到 255（默认随机）"
"sv-raid-join:--spawn-gender" = "1 雌性（默认 0）"
"sv-raid-join:--spawn-nature" = "0 到 24（默认随机）"
"sv-raid-join:--spawn-ivs" = "六项个体值，0 到 31（默认各自随机，如同野生宝可梦）"
"sv-raid-join:--spawn-ability" = "特性槽位，2 表示隐藏特性（默认随机取 0 或 1，与野生宝可梦相同）"
"sv-raid-join:--spawn-mark" = "生成宝可梦携带的证章，以 PKHeX 的 RibbonIndex 指定（53 为正午之证，97 为不振之证；默认为无）"
"sv-raid-join:--spawn-legal" = "配合 --spawn：仅当主机站在 PKHeX 认可该生成物被捕获的区域时才生成，该区域依据主机的游戏机所共享的野生宝可梦判断（只有我们的玩家靠近后它才会共享：--follow-host）"
"sv-raid-join:--scan-only" = "报告实机所公布的内容，不加入任何东西"
"sv-raid-join:--session-join" = "按零售版布局发送 Pia Session 加入请求（docs/sv.md, The Session join request）：十个协议及其版本、一个四字节 nonce、两个位置 id、一个七字节站点地址和一条玩家记录。mesh 加入是单播，因此没有任何被动抓包能看到零售版的加入"
"sv-raid-join:--send-record" = "座位形成后，在 0x81 端口 1（我们的站点流）上发送这条 1395 字节的身份记录，作为游戏的数据交换，并重传直到主机端确认。正式版的加入方会在这里发送自己的身份"
"sv-raid-join:--no-clock" = "不发送克隆时钟请求。已入座的加入者会在其他任何内容之前于 0x77 上发送十八个零字节，然后由主机作答"
"sv-raid-join:--game-channel" = "在 0x7c 上通告我们自己的通道表。站点通过发送其对端在端口 1 上发送的同一张 31 字节表、在端口 2 上发送一个打开消息，并镜像之后每次表更新，来打开游戏的通道；只有当我们的表通告之后，对端才会在端口 0 上把游戏发过来（docs/sv.md）"
"sv-raid-join:--record-set" = "按顺序将此文件夹中的记录通过 0x81 端口 1 发送，作为我方自己的身份，取代 --mirror-records，从而能重播完整的真实身份，而不是把主机端的身份原样回送；默认使用 pokeldn.sv.reference 中的记录集"
"sv-raid-join:--trainer-name" = "身份记录 1 携带的玩家名称，即交换画面显示的名称"
"sv-raid-join:--no-identity" = "除非 --record-set 或 --send-on-open 指定了某个站点身份，否则不发送任何站点身份；默认使用 pokeldn.sv.reference 中记录的那个"
"sv-raid-join:--mirror-records" = "把房主发到 0x81 端口 0 的每条记录按顺序以我们自己的名义回送到端口 1。零售版加入方会用自己的记录集应答房主的记录；此项用游戏自己组成的记录填充那个集合"
"sv-raid-join:--record-delay" = "席位之后多少秒才发出第一条身份记录"
"sv-raid-join:--no-channel-ack" = "不在游戏的可靠通道 0x7c 上确认主机的消息"
"sv-raid-join:--port2-now" = "在 0x7c 端口 2 上带信道表发送游戏的 type-3 join，而不是应答主机在 0x80 端口 2 上的 type-7 通告。参考那一对的加入方是应答该通告的（docs/sv.md, Port 2）"
"sv-raid-join:--send-on-open" = "DELAY:PROTO:PORT:HEX[:z][:start|:end]，在主机端宣布 0x80 键已在 0x7c 端口 1 上打开后指定秒数发送。一个站点的身份是 0x7c 端口 0 上的四条消息，即两个分片各发两次；在该宣布之前发往该端口的消息都不会到达游戏；可重复指定；默认使用 pokeldn.sv.reference 中的身份分片"
"sv-raid-join:--fresh-pid" = "为每笔记录重新生成 PID 与加密常数，保留异色状态，让接收过它的存档能再次接收"
"sv-raid-join:--trade-offer" = "保存本加入端所提供的 348 字节记录的文件（原始二进制或十六进制文本；352 字节的游戏报文会去掉头部）。指定后，加入端会以自己的提供回应主机端送来的提供，并确认、提交，像配对中的加入端一样回应四个交换步骤（pokeldn.sv.trade）。可重复指定：第 2 条及之后的记录在同一连接位置提供，每次交换一条，随每次交换结束依次使用"
"sv-raid-join:--trade-back" = "每次交换后再次交换，将主机刚送出的宝可梦换回，让需要通信进化的宝可梦在主机上进化；玩家需将本程序送出的宝可梦换回（docs/architecture.md，Trade back）"
"sv-raid-join:--offer-set" = "在提供记录封装前写入其中的字段，名称按 pokeldn.sv.pokemon：nickname=SHINY、species=906、ivs=31,31,31,31,31,31、trainer_id=12345、ball=4。可重复指定；单独使用 shiny 时，会按该记录自身的 ID 随机生成异色 PID"
"sv-raid-join:--offer-dump" = "把所提供记录的 348 字节主体以十六进制写入此文件并退出，不需要射频"
"sv-raid-join:--offer-out" = "将主机端自己提供的宝可梦写入此文件，内容为其 80 00 02 00 报文的 348 字节主体，以十六进制文本表示"
"sv-raid-join:--save-shown" = "将主机在交换画面上显示的每只宝可梦写入此文件夹，不论交换是否完成"
"sv-raid-join:--offer-after-open" = "房主打开 key-0x80 之后多少秒由加入方先发 offer，早于房主；不设此项时加入方应答房主的 offer"
"sv-raid-join:--confirm-delay" = "房主的确认之后多少秒才是加入方自己的确认"
"sv-raid-join:--commit-delay" = "房主的确认之后多少秒加入方才提交；参考那一对的加入方在自己的确认后 1.5 s 提交，其房主也照样回应"
"sv-raid-join:--quiet-seat" = "当控制台在座位上完全没有任何发送达到这么多秒时结束该座位，并回到扫描。在控制台的主机阶段之外建立的关联不承载任何流量；没有这个选项时，运行会在整个 --hold 期间占着它"
"sv-raid-join:--leave-on-migration" = "在控制台要求我们接管主机角色（Session type 7）之后这么多秒结束该座位，并回到扫描。在实测的座位中，发过它的控制台之后只发送 NetStartHostMigration；没有这个选项时，运行会在整个 --hold 期间占着该座位"
"sv-raid-join:--stay-on-host-migration" = "在控制台的 NetStartHostMigration（Net 0x40）之后继续占住座位。默认加入者在第一个到达时就离开：控制台正在销毁其网络，并会一直重发它直到所有客户端都离开，最长 4 秒"
"sv-raid-join:--announce-timeout" = "如果座位建立后这么多秒内其控制台仍未在 0x80 端口 2 上通告，就结束该座位并回到扫描。一个座位可以把每条流都跑完却始终没有通告（docs/sv.md，Unresolved）；板上完成过交换的座位分别在 5.8 秒和 7.7 秒时通告"
"sv-raid-join:--no-take-host" = "当主机在公告之前（而非有玩家离开）把主机角色交给我们时，离开它的网络，并用 bin/sv_host.py 在同一信道和密码上成为主机，如 bin/pla_join.py 所做；需要 --answer-migration"
"sv-raid-join:--answer-migration" = "用 type-8 确认应答主机的 type-7 带主机迁移离开，告诉它我们接受它移交的主机角色"
"sv-raid-join:--no-update-ack" = "不用 type 6 应答 Session type-5 站点更新"
"sv-raid-join:--join-delay" = "在座位建立之后把 Session 加入请求压住这么久。控制台若在 WaitMember（3 到 4 秒）结束时仍未加入，就会带主机迁移离开，因此在其离开等待期间被接受的加入会引出 type 7（docs/sv.md，What decides a seat）"
"sv-raid-join:--join-repeat" = "配合 --session-join：每 N 秒重新发送一次（0 表示只发送一次）"
"sv-raid-join:--join-player-id" = "加入请求中的 16 字节玩家 id：“arceus”（先 1 后 0，作为两个大端 u64，即零售版 Arceus 所声明的值）、“random”、“high”（带前导 0xff 的随机值）或 32 个十六进制数字。朱版主机自身的值是 10047bd4a25543e057cee5c71ab1f2a2（sv18）"
"sv-raid-join:--join-player-name" = "加入请求中唯一玩家记录里的玩家名；零售主机的该值为单个空格"
"sv-raid-join:--join-flags" = "加入请求上的消息标志；加入的 Arceus 在每次重发它时都发送 0x01，即跳过来源检查"
"sv-raid-join:--join-dst-var" = "加入请求中包头部的目标变量 id：0，即加入的 Arceus 所使用的值，或主机自身的值"
"sv-raid-join:--net-ack" = "用 0x12 确认应答主机的 Net 0x11。零售版加入者并不这样做，而这个确认反而会让控制台请求主机迁移（sv08）"
"sv-raid-join:--connect-timeout" = "允许建立关联本身的秒数；若主机的建房阶段在连接途中结束，ldn.connect 会一直阻塞，且自身没有超时限制"
"sv-raid-join:--open-delay" = "加入响应之后（没有 --session-join 时则为席位之后）多少秒才发出十一个 ack 和两个 stream open；零售版加入方在加入后 0.75 s 打开"
"sv-raid-join:--rtt-period" = "我们自己的 RTT 请求之间的秒数（0 表示不发送）"
"sv-raid-join:--no-rtt" = "不应答 RTT 请求"
"sv-raid-join:--rtt-delay" = "延迟 SECONDS 秒应答每个 RTT 请求；RTT 采样会启用主机的重传定时器（docs/sv.md）"
"sv-raid-join:--no-ack" = "不对可靠流做确认"
"sv-raid-join:--repeat-ack-gap" = "对已持有的记录，每条流每 SECONDS 秒最多确认一次；新记录会立即确认。0 表示每次重复都确认（docs/sv.md）"
"sv-raid-join:--ack-highest" = "按收到的最高 id 加一、不带掩码地回 ack，而不是像正式版站点那样使用连续区间加掩码（docs/sv.md）"
"sv-raid-join:--ack-flags" = "我们批量 ack 上的 Pia 消息标志；0xa0 是两个零售站点都会发送的值，第 5 位会压缩消息体"
"sv-raid-join:--ack-entries" = "确认载荷中的条目数；零售版站点会发送四个"
"sv-raid-join:--ack-dest-bits" = "可靠头部的目标位；3 会附加零售站点发送的四字节位图，0 则保留九字节头部"
"sv-raid-join:--ack-sweep" = "在席位中轮换 --ack-flags、--ack-entries 与 --ack-dest-bits 的每种组合，每个 --ack-sweep-period 换一种，并在每种生效时打印。这样一次席位就能看出访客解析的是哪种形态"
"sv-raid-join:--ack-sweep-period" = "每个轮扫变体保持生效的秒数"
"sv-raid-join:--ack-period" = "在房主使用的每个 stream 上，周期性批量 ack 之间的秒数"
"sv-raid-join:--unicast" = "改为发送到房主地址，而不是 LDN 广播地址。两个零售版站点都会广播每个 Pia 包（sv11），而广播无需对端做 ARP 解析"
"sv-raid-join:--verbose-rtt" = "也打印 RTT 流量"
"sv-raid-join:--verbose-circle" = "配合 --union-circle：同时打印我们发送的每条集友圈消息和区域搜索的每一步；无论如何 --capture 文件都会保留这些步骤"
"sv-circle-join:--print-packets" = "打印进出的每个数据包；--capture 文件无论如何都会保留它们"
"sv-circle-join:--code" = "仅加入使用此连接密码搜索的主机；留空则不限密码"
"sv-circle-join:--comm-id" = "要加入的本地通信 id，十六进制；默认是任一卡带的"
"sv-circle-join:--keys" = "Switch 的 prod.keys；默认取自 config/host.toml 或 host.local.toml 的 keys_path"
