"sv-gift-host:--raid-serve" = "用插件的对战服务器（NAME，或第一个加载的）从本站点为团体战提供服务：主机和我们的宝可梦打一场对战；只支持一台主机；失败时就像没有此项一样把网络交还（docs/sv_raid.md, Serving the battle）"
