"sv-join:--mirror-records" = "把房主发到 0x81 端口 0 的每条记录按顺序以我们自己的名义回送到端口 1。零售版加入方会用自己的记录集应答房主的记录；此项用游戏自己组成的记录填充那个集合"
"sv-join:--record-delay" = "席位之后多少秒才发出第一条身份记录"
"sv-join:--no-channel-ack" = "不在游戏的可靠通道 0x7c 上确认主机的消息"
"sv-join:--port2-now" = "在 0x7c 端口 2 上带信道表发送游戏的 type-3 join，而不是应答主机在 0x80 端口 2 上的 type-7 通告。参考那一对的加入方是应答该通告的（docs/sv.md, Port 2）"
"sv-join:--send-on-open" = "DELAY:PROTO:PORT:HEX[:z][:start|:end]，在主机端宣布 0x80 键已在 0x7c 端口 1 上打开后指定秒数发送。一个站点的身份是 0x7c 端口 0 上的四条消息，即两个分片各发两次；在该宣布之前发往该端口的消息都不会到达游戏；可重复指定；默认使用 pokeldn.sv.reference 中的身份分片"
"sv-join:--fresh-pid" = "为每笔记录重新生成 PID 与加密常数，保留异色状态，让接收过它的存档能再次接收"
"sv-join:--trade-offer" = "保存本加入端所提供的 348 字节记录的文件（原始二进制或十六进制文本；352 字节的游戏报文会去掉头部）。指定后，加入端会以自己的提供回应主机端送来的提供，并确认、提交，像配对中的加入端一样回应四个交换步骤（pokeldn.sv.trade）。可重复指定：第 2 条及之后的记录在同一连接位置提供，每次交换一条，随每次交换结束依次使用"
"sv-join:--trade-back" = "每次交换后再次交换，将主机刚送出的宝可梦换回，让需要通信进化的宝可梦在主机上进化；玩家需将本程序送出的宝可梦换回（docs/architecture.md，Trade back）"
"sv-join:--offer-set" = "在提供记录封装前写入其中的字段，名称按 pokeldn.sv.pokemon：nickname=SHINY、species=906、ivs=31,31,31,31,31,31、trainer_id=12345、ball=4。可重复指定；单独使用 shiny 时，会按该记录自身的 ID 随机生成异色 PID"
"sv-join:--offer-dump" = "把所提供记录的 348 字节主体以十六进制写入此文件并退出，不需要射频"
"sv-join:--offer-out" = "将主机端自己提供的宝可梦写入此文件，内容为其 80 00 02 00 报文的 348 字节主体，以十六进制文本表示"
"sv-join:--save-shown" = "将主机在交换画面上显示的每只宝可梦写入此文件夹，不论交换是否完成"
"sv-join:--offer-after-open" = "房主打开 key-0x80 之后多少秒由加入方先发 offer，早于房主；不设此项时加入方应答房主的 offer"
"sv-join:--confirm-delay" = "房主的确认之后多少秒才是加入方自己的确认"
"sv-join:--commit-delay" = "房主的确认之后多少秒加入方才提交；参考那一对的加入方在自己的确认后 1.5 s 提交，其房主也照样回应"
"sv-join:--quiet-seat" = "当控制台在座位上完全没有任何发送达到这么多秒时结束该座位，并回到扫描。在控制台的主机阶段之外建立的关联不承载任何流量；没有这个选项时，运行会在整个 --hold 期间占着它"
"sv-join:--leave-on-migration" = "在控制台要求我们接管主机角色（Session type 7）之后这么多秒结束该座位，并回到扫描。在实测的座位中，发过它的控制台之后只发送 NetStartHostMigration；没有这个选项时，运行会在整个 --hold 期间占着该座位"
"sv-join:--stay-on-host-migration" = "在控制台的 NetStartHostMigration（Net 0x40）之后继续占住座位。默认加入者在第一个到达时就离开：控制台正在销毁其网络，并会一直重发它直到所有客户端都离开，最长 4 秒"
"sv-join:--announce-timeout" = "如果座位建立后这么多秒内其控制台仍未在 0x80 端口 2 上通告，就结束该座位并回到扫描。一个座位可以把每条流都跑完却始终没有通告（docs/sv.md，Unresolved）；板上完成过交换的座位分别在 5.8 秒和 7.7 秒时通告"
"sv-join:--no-take-host" = "当主机在公告之前（而非有玩家离开）把主机角色交给我们时，离开它的网络，并用 bin/sv_host.py 在同一信道和密码上成为主机，如 bin/pla_join.py 所做；需要 --answer-migration"
"sv-join:--answer-migration" = "用 type-8 确认应答主机的 type-7 带主机迁移离开，告诉它我们接受它移交的主机角色"
"sv-join:--no-update-ack" = "不用 type 6 应答 Session type-5 站点更新"
"sv-join:--join-delay" = "在座位建立之后把 Session 加入请求压住这么久。控制台若在 WaitMember（3 到 4 秒）结束时仍未加入，就会带主机迁移离开，因此在其离开等待期间被接受的加入会引出 type 7（docs/sv.md，What decides a seat）"
"sv-join:--join-repeat" = "配合 --session-join：每 N 秒重新发送一次（0 表示只发送一次）"
"sv-join:--join-player-id" = "加入请求中的 16 字节玩家 id：“arceus”（先 1 后 0，作为两个大端 u64，即零售版 Arceus 所声明的值）、“random”、“high”（带前导 0xff 的随机值）或 32 个十六进制数字。朱版主机自身的值是 10047bd4a25543e057cee5c71ab1f2a2（sv18）"
"sv-join:--join-player-name" = "加入请求中唯一玩家记录里的玩家名；零售主机的该值为单个空格"
"sv-join:--join-flags" = "加入请求上的消息标志；加入的 Arceus 在每次重发它时都发送 0x01，即跳过来源检查"
"sv-join:--join-dst-var" = "加入请求中包头部的目标变量 id：0，即加入的 Arceus 所使用的值，或主机自身的值"
"sv-join:--net-ack" = "用 0x12 确认应答主机的 Net 0x11。零售版加入者并不这样做，而这个确认反而会让控制台请求主机迁移（sv08）"
"sv-join:--connect-timeout" = "允许建立关联本身的秒数；若主机的建房阶段在连接途中结束，ldn.connect 会一直阻塞，且自身没有超时限制"
"sv-join:--open-delay" = "加入响应之后（没有 --session-join 时则为席位之后）多少秒才发出十一个 ack 和两个 stream open；零售版加入方在加入后 0.75 s 打开"
"sv-join:--rtt-period" = "我们自己的 RTT 请求之间的秒数（0 表示不发送）"
"sv-join:--no-rtt" = "不应答 RTT 请求"
"sv-join:--rtt-delay" = "延迟 SECONDS 秒应答每个 RTT 请求；RTT 采样会启用主机的重传定时器（docs/sv.md）"
"sv-join:--no-ack" = "不对可靠流做确认"
"sv-join:--repeat-ack-gap" = "对已持有的记录，每条流每 SECONDS 秒最多确认一次；新记录会立即确认。0 表示每次重复都确认（docs/sv.md）"
"sv-join:--ack-highest" = "按收到的最高 id 加一、不带掩码地回 ack，而不是像正式版站点那样使用连续区间加掩码（docs/sv.md）"
