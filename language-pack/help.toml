"sv-host:--raid-catch-normal" = "搭配 --raid-event：将每份存档仅能捕捉一次的活动遭遇（所有 7 星团体战、波荡水、铁斑叶等）按普通捕捉提供，捕获率恢复普通，记录编号换成没有任何存档捕捉过的替代编号，使捕捉过它的存档能再次捕捉；原本无法捕捉的仍然无法捕捉（docs/sv_raid.md，Event raids）"
"sv-host:--raid-players" = "团体战等待的主机数，范围为 1 到 3；当 N 台主机进入大厅且全部准备就绪，或大厅倒计时结束时开始"
"sv-host:--raid-partner" = "团体战安排入座的 NPC 伙伴，按槽位顺序，控制台每空出一个槽位就安排一个（一台控制台为 2 个，两台为 1 个，三台为 0 个）：Austin、Ava、Logan、Hailey、Evan、Charlotte、Kylie、Hunter、Gianna、Eli、Henry、Chase、Claire、Brooklyn、Zoe、Samantha、Dylan、Luke；主机抽取一个决定其入座的伙伴种子，其余自由抽取（docs/sv_raid.md，Partners）"
