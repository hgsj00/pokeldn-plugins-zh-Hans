"frlg-trade-host:--union-room-battle" = "联盟交谊厅：接受主机的“Combat”而不是拒绝。主机的同行中需要有两只 30 级或以下的非蛋宝可梦，否则它会在自己的屏幕上拒绝；对战由主机主控并运行，我们负责应答它的控制器命令"
