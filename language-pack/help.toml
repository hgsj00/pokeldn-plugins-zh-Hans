"sv-host:--send-on-open" = "DELAY:PROTO:PORT:HEX[:z][:start|:end]，在主机宣布自己的 0x80 键已在 0x7c 端口 1 上打开后指定秒数发送。在该打开之前发往端口 0 的消息会被主机确认，却永远不会到达游戏；该端口上此后的所有消息同样如此；可重复指定；默认使用 pokeldn.sv.reference 中的身份分片"
