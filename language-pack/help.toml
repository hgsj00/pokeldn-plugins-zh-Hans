"pla-host:--no-session-ack" = "不用 type-1 确认应答加入请求（能换来 8 秒，但什么也完不成）"
"pla-host:--no-session-response" = "不用 type-2 加入响应应答加入请求"
"pla-host:--join-seq" = "加入响应所承诺的序列 id；类型 5 的更新必须达到它"
"pla-host:--session-update" = "响应之后，发送一条类型 5 的站点列表更新（会设置 job+0x7c）。在完成 0x739050 解码之前，它按站点划分的布局都是暂定的"
"pla-host:--sustain" = "加入后，回显 RTT 并确认可靠流，这样实机就不会在 12 s 后超时并离开"
"pla-host:--reliable-hello" = "十六进制：一旦控制台在可靠通道上开口，就把它作为主机自己的可靠 seq-1 数据发送（如果主机始终不出声，游戏会在 +10 秒时离开）"
"pla-host:--reliable-mirror" = "与主机的可靠流同步推进：对每条实机的可靠数据消息，发送主机自己的下一序列数据并使用相同载荷（实机只在主机前进时才前进）"
"pla-host:--hello-protocol" = "主机发送可靠游戏数据所用的协议；游戏自身的读取器轮询 0x80（BroadcastReliable），因此 0x80 会把数据放到游戏会取走的位置"
"pla-host:--host-player-name" = "站点列表更新中主机的玩家名，游戏会将其读作身份；用真实名字替代占位的单个空格"
"pla-host:--host-player-id" = "十六进制，16 字节：站点列表更新中主机的玩家 id，用真实的 principal id 取代占位值"
"pla-host:--clock" = "用主机时钟消息应答控制台的克隆时钟（0x77）；控制台的 ClockProtocol 停在状态 4，而入站的时钟消息会重置其状态机（报告 157）"
"pla-host:--atomic-announce" = "mesh 运行后，发送一次 Atomic（0x74）的 kind-0 宣告；用于探测主机宣告是否会占用一个元素槽位（报告 163）"
"pla-host:--data-exchange" = "主机打开其 stream 后，在 0x81 数据交换中发送房主自己的记录；交换场景就是这个交换的成功分支"
"pla-host:--data-exchange-name" = "该记录中的玩家名；游戏会将其显示为交换对象（默认 --player-name）"
"pla-host:--data-exchange-id" = "十六进制：该记录中的四字节玩家 id"
"pla-host:--gender" = "0 雄性，1 雌性：该记录中的性别，外观随之而定"
"pla-host:--game-channel" = "数据交换完成后打开游戏自己的可靠通道（0x7c）：应答实机的通道消息、把同样的内容发回去，并打开主机自己的端口 0 通道，交换流程的步骤 0x20 正是靠它驱动其网络对象"
"pla-host:--trade-box" = "在游戏通道上提供主机自己的宝可梦：用我们的一只宝可梦在端口 0 的序列 2 上应答实机的交换盒"
"pla-host:--trade-box-ours" = "提供主机自己的记录，而不是捕获到的那条：同一只宝可梦，用数据交换中的玩家名和 id 以及一个新身份，这样就不会把实机自己持有的记录提供给它"
"pla-host:--trade-box-level" = "所提供记录队伍尾部中的等级字节"
"pla-host:--trade-box-experience" = "所提供记录中的经验值；游戏显示的等级由成长曲线决定，因此此项与 --trade-box-level 需配合使用"
"pla-host:--trade-box-pid" = "十六进制：被提议记录中的性格值。假设：当训练家 id、秘密 id 和该值的两半异或后小于 16 时，该记录就是异色，这是第六世代的规则，在此尚未验证"
"pla-host:--trade-box-nickname" = "所提供记录中的昵称"
"pla-host:--save-shown" = "将主机在交换画面上显示的每只宝可梦写入此文件夹，无论交换是否完成"
"pla-host:--offer-out" = "将主机交换过来的记录写入此文件；第 N 次交换（N > 1）会在扩展名前加上 -N"
"pla-host:--fresh-pid" = "每次运行时以新的 PID 与加密常数提供该记录，保留异色状态，让曾接收过的存档能再次接收"
"pla-host:--trade-box-record" = "改用此记录文件代替参考记录；可为盒子或队伍格式，加密或未加密。可重复指定，按顺序每次交换一个；列表用完后重复提供最后一个"
"pla-host:--interrupt-before-phase-6" = "应答阶段 3 后，等待主机的阶段 6，然后不作应答就离开；这会故意触发游戏的交换限制"
"pla-host:--leave-after" = "站点加入会话之后多少秒向它发送 type-3 leave 并结束运行；这是抓包中唯一没有显示的方向"
"pla-host:--hold-after-trade" = "在队列中最后一次交换完成后等待指定秒数，再关闭会话；默认会保持会话，直到主机离开或达到时间限制"
"pla-host:--leave-sends" = "要发送它多少次；实机会发送四次"
"pla-host:--stay-after-leave" = "离开后保持网络在线并静默，而不是结束本次运行；这样可以区分实机在离开消息里读到的内容和在网络断开时读到的内容。在实机完成交换后离开时，也会保留本次运行（以及 BOOT 标记）"
"pla-host:--data-exchange-skip-source-check" = "把跳过来源检查的标志放到记录上，而参考主机在那里不发送任何标志；若某次运行显示该记录未被分发，就只需改这一个变量"
"pla-host:--data-exchange-record" = "发送这个 139 字节的记录文件，而不是自行构建一个"
"pla-host:--reliable-dest-bits" = "主机可靠消息上的目的位数；取 2 是为了让控制台自身的站点索引 (1) 落在消息体目的位图检查的范围内"
"pla-host:--reliable-bitmap" = "目的位图字，在 wire[9] 处以大端存放；除非为其自身站点索引 (1) 的位被置位，否则控制台会丢弃该消息，所以 bit 1 = 0x2"
