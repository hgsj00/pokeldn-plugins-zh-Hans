"sv-host:--raid-seed" = "创建太晶团体战：种子为 8 位十六进制数字；头目、太晶属性与奖励由种子及四个 --raid-* 上下文标志决定"
"sv-host:--raid-pokemon" = "本程序角色带进团体战的同行宝可梦记录，需通过 PKHeX 合法性检查；与 --raid-seed 搭配使用"
