"sv-online:--raid-catch-normal" = "搭配 --raid-event：将每份存档仅能捕捉一次的活动遭遇（所有 7 星团体战、波荡水、铁斑叶等）按普通捕捉提供，捕获率恢复普通，记录编号换成没有任何存档捕捉过的替代编号，使捕捉过它的存档能再次捕捉；原本无法捕捉的仍然无法捕捉（docs/sv_raid.md，Event raids）"
