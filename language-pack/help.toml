"sv-join:--spawn-nature" = "0 到 24（默认随机）"
"sv-join:--spawn-ivs" = "六项个体值，0 到 31（默认各自随机，如同野生宝可梦）"
"sv-join:--spawn-ability" = "特性槽位，2 表示隐藏特性（默认随机取 0 或 1，与野生宝可梦相同）"
"sv-join:--spawn-mark" = "生成宝可梦携带的证章，以 PKHeX 的 RibbonIndex 指定（53 为正午之证，97 为不振之证；默认为无）"
"sv-join:--spawn-legal" = "配合 --spawn：仅当主机站在 PKHeX 认可该生成物被捕获的区域时才生成，该区域依据主机的游戏机所共享的野生宝可梦判断（只有我们的玩家靠近后它才会共享：--follow-host）"
"sv-join:--scan-only" = "报告实机所公布的内容，不加入任何东西"
"sv-join:--session-join" = "按零售版布局发送 Pia Session 加入请求（docs/sv.md, The Session join request）：十个协议及其版本、一个四字节 nonce、两个位置 id、一个七字节站点地址和一条玩家记录。mesh 加入是单播，因此没有任何被动抓包能看到零售版的加入"
"sv-join:--send-record" = "座位形成后，在 0x81 端口 1（我们的站点流）上发送这条 1395 字节的身份记录，作为游戏的数据交换，并重传直到主机端确认。正式版的加入方会在这里发送自己的身份"
"sv-join:--no-clock" = "不发送克隆时钟请求。已入座的加入者会在其他任何内容之前于 0x77 上发送十八个零字节，然后由主机作答"
"sv-join:--game-channel" = "在 0x7c 上通告我们自己的通道表。站点通过发送其对端在端口 1 上发送的同一张 31 字节表、在端口 2 上发送一个打开消息，并镜像之后每次表更新，来打开游戏的通道；只有当我们的表通告之后，对端才会在端口 0 上把游戏发过来（docs/sv.md）"
"sv-join:--record-set" = "按顺序将此文件夹中的记录通过 0x81 端口 1 发送，作为我方自己的身份，取代 --mirror-records，从而能重播完整的真实身份，而不是把主机端的身份原样回送；默认使用 pokeldn.sv.reference 中的记录集"
