name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  language-pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.13"

      - name: Offline pack checks (keys, placeholders, resources)
        run: python tools/validate_pack.py language-pack --reference reference/strings.en.toml

      - name: Coverage against the committed English snapshot
        run: python tools/check_upstream.py --pack language-pack --reference reference/strings.en.toml --help-keys reference/help-keys.json

      - name: language-pack is generated from the kit
        run: |
          python tools/build_strings.py --kit translation-kit --out dist
          for file in strings messages templates terms help; do
            diff -u "language-pack/$file.toml" "dist/$file.toml"
          done

      - name: Package structure and signature
        run: python tools/verify_package.py packages/pokeldn-zh-Hans-1.0.0.pokeplugin

      - name: Translation status
        run: python tools/status.py --kit translation-kit --reference reference/strings.en.toml
