name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  language-pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      POKELDN_REF: 2bee2a1e0209062f39de8458fbd12b2965391094   # reference/upstream.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.13"

      - name: Fetch the pinned pokeldn checkout
        run: |
          git clone --filter=blob:none https://github.com/Decryptu/pokeldn.git ../pokeldn
          git -C ../pokeldn checkout "$POKELDN_REF"

      - name: Install pokeldn's runtime dependencies (for the official checker)
        run: |
          python -m pip install --upgrade pip
          # The upstream requirements pin direct dependencies only; transitive packages come from PyPI.
          python -m pip install -r ../pokeldn/requirements.txt

      - name: English template still matches the checkout
        run: python ../pokeldn/scripts/extract_strings.py --check

      - name: Offline pack checks (keys, placeholders, resources)
        run: python tools/validate_pack.py language-pack --reference reference/strings.en.toml

      - name: Official checker (missing/unknown keys and tool help)
        run: python ../pokeldn/scripts/check_language_pack.py language-pack

      - name: Package it the way the app does
        run: |
          python ../pokeldn/scripts/pack_plugin.py language-pack -o dist/pokeldn-zh-Hans.pokeplugin
          python - <<'PY'
          import zipfile
          names = zipfile.ZipFile("dist/pokeldn-zh-Hans.pokeplugin").namelist()
          assert "plugin.toml" in names and "strings.toml" in names, names
          print(len(names), "files:", names)
          PY

      - name: Coverage summary
        run: python tools/status.py --kit translation-kit --reference reference/strings.en.toml
